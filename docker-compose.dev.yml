services:
  nicolify_postgres_dev:
    image: postgres:15-alpine
    container_name: nicolify_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nicolify_dev
    volumes:
      - nicolify_postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - nicolify_dev_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nicolify_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nicolify_postgres_dev_data:
    name: nicolify_postgres_dev_data

networks:
  nicolify_dev_net:
    name: nicolify_dev_net
    driver: bridge
