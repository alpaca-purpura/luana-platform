[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E711",  # None comparison — Model.col == None generates WHERE col IS NULL (SQLAlchemy ORM pattern)
    "E712",  # Bool comparison — Model.col == True/False is valid SQLAlchemy filter syntax
]

[tool.ruff.lint.per-file-ignores]
"**/tests/conftest.py" = ["E402"]  # env vars must be set before module imports
"**/scripts/*.py" = ["E402", "E501"]  # scripts manipulate sys.path and may have long docstrings

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-x -q --tb=short --import-mode=importlib"
markers = [
    "arch: architecture fitness tests (determinism, invariants, boundary checks)",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.19",
]
