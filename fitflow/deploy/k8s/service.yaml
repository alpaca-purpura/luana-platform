# fitflow/deploy/k8s/service.yaml
# Placeholder K8s service manifest — FitFlow
# bootstrap brand topology — 2026-05-15

apiVersion: v1
kind: Service
metadata:
  name: fitflow-backend
  namespace: luana
  labels:
    app: fitflow-backend
    brand: fitflow
spec:
  type: ClusterIP
  selector:
    app: fitflow-backend
  ports:
    - name: http
      port: 8010
      targetPort: 8010
---
apiVersion: v1
kind: Service
metadata:
  name: fitflow-frontend
  namespace: luana
  labels:
    app: fitflow-frontend
    brand: fitflow
spec:
  type: ClusterIP
  selector:
    app: fitflow-frontend
  ports:
    - name: http
      port: 3010
      targetPort: 3010
