playwright_required: true

playwright_visual_scope:
  story_scope_routes:
    - "/{tenantId}/lisa/staff"
    - "/{tenantId}/lisa/staff/[doctor-id]/perfil"
    - "/{tenantId}/lisa/staff/[doctor-id]/horarios"
    - "/{tenantId}/lisa/staff/[doctor-id]/servicios"
  story_scope_components:
    - features/lisa/components/staff/**
    - components/shared/shell-organism/EntitySubNavBar.tsx
  forbidden_visual_changes:
    - components/shared/shell-organism/SubSubTabsBar.tsx   # NO modificar el N3-static existente
    - components/shared/shell-organism/Ribbon.tsx
    - components/shared/shell-organism/SubTabsBar.tsx
    - components/shared/shell-organism/ValeriaSidebar.tsx
    - app/[tenantId]/(shell-organism)/lisa/marca/**         # sibling story, no tocar
  out_of_mockup_scope:
    - "Servicios funcional (catalogo selection) — pendiente, solo placeholder en esta story"
    - "Tab KPIs — diferido"
    - "Landing publica UI — diferida a lisa-landing-public (solo toggle + endpoint aqui)"
  non_egoismo_clause: >-
    Si el builder ve un bug en wrapper shell (Ribbon/SubTabsBar/ValeriaSidebar) o en lisa/marca,
    NO lo arregla en esta story (fuera de scope). Lo documenta en vitalia/docs/observed-bugs/
    y sigue. Solo toca EntitySubNavBar (nuevo) + features/lisa/components/staff/**.

test_construction_plan:
  tdd_order: "RED-first per layer (tdd-mandatory.md). BE: domain -> infra -> app -> api/e2e. FE: hook -> component -> store -> e2e."
  creation_order:
    # BE (T-BE-2..6)
    - 1: "domain AvailabilityBlock validation test (recurrence-end-condition-required) RED -> domain impl GREEN"
    - 2: "credential_validator test (PE/AR/MX/CL) RED -> impl GREEN"
    - 3: "AvailabilityProjectionService rrule test (weekly/biweekly/end_date/occurrences/one-off/open-ended-90d) RED -> impl GREEN"
    - 4: "DoctorRepository dual-filter + pgcrypto encrypt/decrypt test RED -> impl GREEN"
    - 5: "availability_block_mutable test (reproject future, delete preserves confirmed) RED -> impl GREEN"
    - 6: "bio_generation_service no-invent + fallback test RED -> impl GREEN"
    - 7: "doctors_api test (response_model, RBAC admin_clinic, masking, pagination, soft-deactivate) RED -> router GREEN"
    - 8: "cross_tenant + dni_race + public allowlist tests RED -> GREEN"
    - 9: "migration 036 idempotency test (clone DB 2x) RED -> migration GREEN"
    # FE (T-FE-*)
    - 10: "useStaffList/useDoctor/useAvailabilityBlocks hook tests (MSW) RED -> hooks GREEN"
    - 11: "EntitySubNavBar test (enabled/disabled leaves, a11y roving) RED -> component GREEN"
    - 12: "StaffCard/StaffDirectoryView/NuevoIntegranteModal vitest RED -> GREEN"
    - 13: "AvailabilityCalendar/BloquePopover vitest (drag-to-create, recurrence popover) RED -> GREEN"
    - 14: "BioRepoInputs/GeneratedBioSections/AvatarUploader vitest RED -> GREEN"
    - 15: "Playwright e2e SC-1..SC-11 + axe wcag2aa + visual goldens (6+1)"
  scenario_to_test:
    SC-1: [V-FN-1]
    SC-1b: [V-FN-2]
    SC-1c: [V-FN-3]
    SC-1d: [V-FN-4]
    SC-2: [V-FN-5]
    SC-3: [V-FN-6]
    SC-3b: [V-FN-7]
    SC-4: [V-NF-1]
    SC-5: [V-NF-2]
    SC-6: [V-NF-3]
    SC-7: [V-NF-4]
    SC-8: [V-FN-8]
    SC-9: [V-NF-5]
    SC-10: [V-VIS-*, axe-embedded]   # accessibility keyboard nav + axe wcag2aa embedded in e2e specs
    SC-11: [V-FN-12]
  poms_required:
    - vitalia/frontend/e2e/pages/StaffDirectoryPage.ts        NEW
    - vitalia/frontend/e2e/pages/DoctorWorkspacePage.ts       NEW
    - vitalia/frontend/e2e/pages/AvailabilityCalendarPage.ts  NEW
  fixtures_required:
    - "Clerk auth admin_clinic token (playwright-expert)"
    - "tenant A (3 doctores) + tenant B (5 doctores) seed fixture (SC-6)"
    - "doctor con citas futuras confirmadas fixture (SC-3, SC-3b)"
    - "1200-doctor seed fixture (SC-9 pagination)"
    - "MSW handlers staff.ts (all endpoints, 503 mock for SC-7)"
    - "LocalStorageStrategy swap for asset upload tests (no live R2)"
  real_verification_gate: >-
    Verificacion REAL (test-design-doctrine): los scenarios de write (crear doctor, crear/eliminar bloque,
    autosave bio) se ejercen con la accion real (POST/PATCH/DELETE) + se observa el efecto en DB
    (state_check queries del spec) + logs. GET 200 NO es verificacion. E2E NO mockean el backend
    para los happy-path writes (usan backend real dev stack BE:8002).
