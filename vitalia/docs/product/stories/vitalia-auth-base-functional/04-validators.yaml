  - id: nf-fe-eslint
    must_pass: true
    surface: frontend
    command: |
      cd vitalia/frontend && npx eslint src/ --cache --max-warnings=0
    expected_exit: 0
    description: "ESLint 0 errors + 0 warnings"

  - id: nf-fe-arch-fitness
    must_pass: true
    surface: frontend
    command: |
      cd vitalia/frontend && npx vitest run src/__tests__/architecture/ --reporter=default
    expected_exit: 0
    description: "FE arch fitness ratchet — shrink-only allowlists, no new violations"

  - id: nf-be-ruff-check
    must_pass: true
    surface: backend
    command: |
      WS=$(git rev-parse --show-toplevel) && cd $WS/vitalia/backend && $WS/.venv/bin/ruff check src/modules/vitalia/admin/ tests/admin/ --no-cache
    expected_exit: 0
    description: "Ruff 0 errors on new admin module + tests"

  - id: nf-be-ruff-format
    must_pass: true
    surface: backend
    command: |
      WS=$(git rev-parse --show-toplevel) && cd $WS/vitalia/backend && $WS/.venv/bin/ruff format --check src/modules/vitalia/admin/ tests/admin/
    expected_exit: 0
    description: "Ruff format consistency on admin module"

  - id: nf-be-arch-fitness
    must_pass: true
    surface: backend
    command: |
      WS=$(git rev-parse --show-toplevel) && cd $WS/vitalia/backend && $WS/.venv/bin/pytest tests/architecture/ -x -q --tb=short
    expected_exit: 0
    description: "BE arch fitness (DDD, tenant isolation, admin-panel rules)"

  - id: nf-anti-duplication-scan
    must_pass: true
    surface: cross-cutting
    command: |
      WS=$(git rev-parse --show-toplevel) && \
      MIRROR_COUNT=$(diff <(find $WS/nicolify/backend/src/modules/nicolify/admin/modules -name "tenants.py" -o -name "users.py" | xargs cat) <(find $WS/vitalia/backend/src/modules/vitalia/admin/modules -name "tenants.py" -o -name "users.py" | xargs cat) | wc -l) && \
      [ "$MIRROR_COUNT" -gt 50 ]
    expected_exit: 0
    description: "Cross-brand anti-mirror check: vitalia admin modules MUST differ ≥50 lines from nicolify (proven brand-specific reimplementation, not copy-paste). Per .claude/rules/admin-panel.md + anti-duplication.md."

