      - Fixture clinics seeded
      - Clerk testing token generated (Chris)

  - id: vs-playwright-trace-no-console-errors
    must_pass: true
    surface: e2e-live
    command: |
      cd vitalia/frontend && \
        E2E_BASE_URL=https://dev-app.vitalialat.com \
        CLERK_TESTING_TOKEN=${CLERK_TESTING_TOKEN_VITALIA} \
        npx playwright test e2e/auth/ --trace=on --reporter=list && \
      ! grep -i "ClerkProvider" vitalia/frontend/playwright-report/*.zip 2>/dev/null
    expected_exit: 0
    description: "Playwright trace inspection — no Clerk init console errors"

