# Dashboard welcome state — vitalia

Pantalla inicial autenticada del dashboard `/`. Welcome con contexto del tenant + 5 placeholder cards para Slice 1.

## Surfaces

- **Frontend (FSD-Lite feature):**
  - `vitalia/frontend/src/features/dashboard/index.ts` (public surface)
  - `vitalia/frontend/src/features/dashboard/components/DashboardWelcome.tsx` (Server Component)
  - `vitalia/frontend/src/features/dashboard/components/SliceOneStubsRow.tsx` (Server Component — corrected from Client in self-fix iter-1)
  - `vitalia/frontend/src/features/dashboard/types/DashboardData.ts`
  - `vitalia/frontend/src/app/(dashboard)/page.tsx` (consumes feature)
  - `vitalia/frontend/src/app/(dashboard)/layout.tsx` (shell con VitaliaLogo + UserButton)
- **Tests:** `vitalia/frontend/src/features/dashboard/__tests__/DashboardWelcome.test.tsx` (3 unit tests RED→GREEN)

## Comportamiento

- h1 `Hola, {first_name}` — extraído de Clerk `auth()` server-side
- Badge `{clinic_name} · {plan_tier}` — server fetch `/api/v1/iam/me`
- CTA `Configurar tu clínica` → linkea `/onboarding/wizard` (visible si `!is_onboarded`)
- 5 stub cards (Inbox / Pipeline / Agenda / Fidelización / Marketing) con label "pronto"

## Out-of-scope

- Offers / bookings / appointments (placeholders, siguen Slice 1 stories)
- Métricas reales del Growth Studio (capability separado futuro)

