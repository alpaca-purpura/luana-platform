- Existing Clerk dev keys (`NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY`, `CLERK_SECRET_KEY`, `CLERK_ISSUER`)

## Notes

- `auth.protect()` delegado 100% a Clerk — sin redirect manual ni RBAC.
- RBAC se hace en route handlers / page level, no middleware.
