# Sign-in / Sign-up pages — Clerk real components

Pages que renderizan los componentes oficiales de Clerk con localización Spanish neutro.

## Surfaces

- **Frontend:** `vitalia/frontend/src/app/(auth)/sign-in/page.tsx`, `vitalia/frontend/src/app/(auth)/sign-up/page.tsx`
- **Tests:** `vitalia/frontend/e2e/auth/sign-in-form.spec.ts` (T-6.a)

## Comportamiento

- `/sign-in` → `<SignIn />` Clerk component, redirects to `/` after success (per `NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL`)
- `/sign-up` → `<SignUp />` Clerk component, idem
- Spanish neutro tuteo en headers/labels (Clerk localization)

## Out-of-scope

- Webhook handler (BE) — capability separado (admin.streamlit-tenants-users via webhook)
- Custom appearance tokens beyond defaults — defer to brand-styling story

## DELETE legacy (this story)

- `vitalia/frontend/src/app/onboarding/step-1/`, `step-2/`, `step-3/` — eliminados (wizard único en `/onboarding/wizard` desde Story 11)

