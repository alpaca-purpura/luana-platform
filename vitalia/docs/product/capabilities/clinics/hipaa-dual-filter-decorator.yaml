summary: |
  HIPAA-lite enforcement decorator `@require_clinic_access(clinic_id_from=...)`
  que verifica el user autenticado tiene acceso al clinic_id solicitado. Aplica
  dual filter (tenant_id + clinic_id) per `vitalia/.claude/rules/hipaa-lite.md`.
  Returns HTTP 403 + audit log row si cross-clinic o cross-tenant.

