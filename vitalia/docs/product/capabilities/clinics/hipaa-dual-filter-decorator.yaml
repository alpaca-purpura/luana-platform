user_facing_name: "Decorator @require_phi_access dual filter"
user_facing_description: >
  Componente técnico que protege de forma automática todo endpoint que acceda a
  datos sensibles del paciente. Verifica que la consulta incluya tanto el tenant
  como la clínica correspondiente, y que el rol del usuario tenga permiso para
  ver PHI. Si alguno de estos filtros falta, bloquea la solicitud con error.

