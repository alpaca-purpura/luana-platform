    - "cd vitalia/backend && ${WS}/.venv/bin/pytest tests/modules/vitalia/clinics/test_clinic_repository.py tests/modules/vitalia/clinics/test_clinic_service.py -v"
  gherkin_evidence:
    - SC-08 Admin crea clinic asociada a tenant → INSERT vitalia_clinic_branches FK tenants.id + audit

