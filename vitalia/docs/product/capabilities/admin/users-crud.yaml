summary: |
  Admin Streamlit page para CRUD users + asignaciones a tenants. Consume engine
  `luana_core_iam.UserRepository` + `UserTenantRepository`. Soporta create + list
  con join (role per tenant) + ban (toggle is_active) + dropdown filtro por
  tenant. Audit log sync write.

