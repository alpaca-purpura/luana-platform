# Admin Streamlit — Tenants + Usuarios

Panel admin Streamlit Vitalia con scope mínimo: 2 pages (tenants + usuarios). Pattern espejado de Nicolify pero código brand-specific reescrito (1500 diff lines vs nicolify, ≥50 threshold).

## Surfaces

- **Backend (DDD Inside-Out application-layer):**
  - `vitalia/backend/src/modules/vitalia/admin/app.py` (entry, `st.set_page_config` único, registry-based `st.navigation`)
  - `vitalia/backend/src/modules/vitalia/admin/pages/{tenants,usuarios}.py` (thin wrappers)
  - `vitalia/backend/src/modules/vitalia/admin/modules/{tenants,users}.py` (forms + logic)
  - `vitalia/backend/src/modules/vitalia/admin/_shared/{auth,db}.py` (bcrypt super-admin gate + sync SessionLocal)
- **Tests:**
  - Unit: `vitalia/backend/tests/admin/test_admin_contract.py` (8 contract tests — PAGE_SPECS registry, slug uniqueness, callable)
  - Integration: `vitalia/backend/tests/integration/admin/{test_clerk_webhook_integration,test_audit_log_verify,test_cross_tenant_isolation}.py` (gated by Postgres; SKIP graceful in unit run)
- **Compliance:** `vitalia/backend/src/modules/vitalia/compliance/{audit,domain/phi_fields}.py` (HIPAA-lite audit log + PHI sanitization)

## Comportamiento

### Tenants page
- Form crear tenant + clinic + location atomicamente
- UUIDv5 determinista con `NAMESPACE_DNS` (`uuid.uuid5(NAMESPACE_DNS, f"{entity_type}.{slug}.vitalia.com")`)
- INSERT clinics + tenants + locations sync (Streamlit sync paradigm)
- Audit log row sync write antes response (`vitalia_audit_log` table, `action=admin.tenant.create`)

### Usuarios page
- Form crear user con Clerk Backend API
- INSERT `user_profiles` con tenant_id + clinic_id auto-asociado
- Magic link email vía Clerk (Q4 default: 1 admin password env-var, multi-admin defer)
- Audit log row (auditor flagged magic-link write missing — follow-up ticket)

### Auth gate
- bcrypt password vs `VITALIA_ADMIN_PASSWORD_HASH` env-var (per D8)
- Sin OAuth, sin multi-admin (per Q4 ratified default)

## HIPAA-lite invariants enforced

- Audit log sync write antes response (no async fire-forget)
- `payload_redacted`: identity ok (`clinic_name`, `country`, `email`), NO PHI fields (per `compliance/domain/phi_fields.py`)
- Cross-tenant isolation: query `tenant_id_A` con `clinic_id_B` → 404 (dual filter)
- Webhook HMAC validation strict (T-4 commit handles invalid sig → 400 per D2 design choice "no auth semantics leakage")

