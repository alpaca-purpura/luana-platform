# v3 cement 2026-05-27 · 4 dimensiones + dev_preview (ADR-vitalia-005)
tech_module: admin
agent_owner: config
functional_area: config.admin
user_visible: true
nature: feature

user_facing_name: "Servicio admin Streamlit"
user_facing_description: >
  Panel de administración interno construido con Streamlit para el equipo de Vitalia
  (no visible para clientes). Permite gestionar tenants, clínicas y usuarios de forma
  transversal, depurar incidentes y ejecutar operaciones de mantenimiento. Se accede
  con contraseña de administrador y corre en un servicio Docker separado.

dev_preview:
  route: "http://localhost:8502 (Streamlit)"
  how_to_navigate: "Ejecutar 'make dev-vitalia-admin' → abrir http://localhost:8502 → ingresar contraseña VITALIA_ADMIN_PASSWORD del .env.dev"
  main_component: null
  api_endpoints: []
  e2e_test: "vitalia/frontend/e2e/admin/admin-login.spec.ts"
  fixtures_required: []
  storybook_url: null
  loom_demo: null

summary: |
  Service docker-compose `vitalia_admin_dev` exposing Streamlit admin panel en
  port 8502 (per D4 platform outcome). Profile `admin` opt-in. Bcrypt password
  auth (VITALIA_ADMIN_PASSWORD_HASH env var, single super-admin). Container
  name: `luana-dev-vitalia_admin_dev-1`. Makefile target `dev-vitalia-admin`.

surfaces:
  config:
    - "vitalia/docker-compose.dev.yml (vitalia_admin_dev service, profiles: [admin])"
    - "Makefile (dev-vitalia-admin, dev-down-vitalia-admin targets)"
    - "vitalia/.env.dev (VITALIA_ADMIN_PASSWORD_HASH + VITALIA_ADMIN_PASSWORD + VITALIA_INTERNAL_API_TOKEN)"
    - "vitalia/.env.dev.template (comment re single-quote requirement para hashes con $)"
  tests:
    - "vitalia/frontend/e2e/admin/admin-login.spec.ts (Playwright admin-smoke project)"

verification:
  commands:
    - "docker compose -f docker-compose.dev.yml -f vitalia/docker-compose.dev.yml --profile admin up -d vitalia_admin_dev"
    - "curl -sS http://127.0.0.1:8502/_stcore/health"  # expected: ok
    - "cd vitalia/frontend && E2E_ADMIN_BASE_URL=http://127.0.0.1:8502 VITALIA_ADMIN_PASSWORD='<env>' npx playwright test --project=admin-smoke -g 'SC-01'"
  gherkin_evidence:
    - SC-01 Admin login con bcrypt password OK → dashboard accesible
    - SC-12 Admin logout → session destroyed → redirect login

