## Dependencies

- `luana-core-platform` (advisory_locks helpers + base SQLA)
- `vitalia/backend/payment/*` (MercadoPago / Stripe Connect / tokenized recurring)
- `luana-core-iam` (tenant_id required en todas las queries)

## Scenarios live

- Paciente abre slots → ve disponibilidad por doctor + fecha
- Reserva slot → BookingService toma advisory_lock → previene double-booking
- Crea payment_intent (30% depósito) → redirect a gateway
- Webhook payment confirmed → booking activa
- Si oferta requiere consentimiento → consent-signature-modal antes de confirmar
- Cancela booking → refund automático + advisory_lock released
- Reagendar → busca nuevo slot + libera anterior atomicamente
