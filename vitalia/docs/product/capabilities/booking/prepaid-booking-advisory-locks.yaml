# vitalia-prepaid-booking-advisory-locks

Motor de reservas prepagadas con `Postgres advisory_locks` para prevenir double-booking de slots de doctores. Depósito por defecto 30% (configurable per-oferta). Soporta confirmación de pago, firma de consentimiento, cancelación, reagendamiento.

## Surface

### Backend (`vitalia/backend/src/modules/vitalia/`)

- **`application/services/booking_service.py`** — orquesta booking + advisory_lock + payment_intent
- **`application/services/prepaid_payment_service.py`** — gestiona balance prepaid + quota deduction
- **`infrastructure/advisory_locks.py`** — helper Postgres `pg_advisory_xact_lock(doctor_id, slot_ts)`
- **`infrastructure/models/booking_model.py`** + **`payment_intent_model.py`** + **`payment_schedule_model.py`**
- **`infrastructure/repositories/booking_repository.py`** + **`payment_intent_repository.py`**
- **API endpoints** (`api/routes.py`):
  - `GET /api/v1/vitalia/bookings/available-slots` — slots disponibles por doctor/fecha
  - `POST /api/v1/vitalia/bookings` — crea booking
  - `GET /api/v1/vitalia/bookings` — listado
  - `POST /api/v1/vitalia/bookings/{id}/confirm-payment`
  - `POST /api/v1/vitalia/bookings/{id}/consent-sign`
  - `POST /api/v1/vitalia/bookings/{id}/cancel`
  - `POST /api/v1/vitalia/bookings/{id}/reschedule`

### Frontend (`vitalia/frontend/`)

- **Rutas dashboard**:
  - `src/app/(dashboard)/appointments/page.tsx` — calendario
  - `src/app/(dashboard)/bookings/page.tsx` — listado
  - `src/app/(dashboard)/bookings/[id]/page.tsx` — detalle
- **Componentes**: `features/vitalia/components/appointments-calendar-client.tsx`, `consent-signature-modal.tsx`
- **Schemas + hooks**: `schemas/booking-schema.ts`, `schemas/appointment-schema.ts`, `schemas/consent-schema.ts`, `api/use-booking-*.ts` (availability, create, cancel, reschedule, get, list)

### Config

- `booking.requires_consent_when_offer_marks: true`
- `booking.default_deposit_percent: 30`
- `booking.default_currency_per_country: {AR:ARS, CL:CLP, MX:MXN, CO:COP, PE:PEN, BR:BRL, US:USD}`

