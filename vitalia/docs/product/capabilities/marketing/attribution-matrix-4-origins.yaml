# vitalia-marketing-attribution-matrix-4-origins

Attribution heatmap 4 origins × KPI columns en Stage Reserva del Bowtie funnel. Identifica qué canales convierten mejor. Top insight Lucas embedded. Consume `LucasAttributionService.compute_attribution_matrix` shipped 2026-05-18 vitalia-copilot-tools-impl.

## Surface

### Domain / Application
- `AttributionService` (marketing proxy wrapper) — `matrix()` delegates to `LucasAttributionService.compute_matrix(...)`
- 4 origins: `sales_agent` · `walk_in` · `phone_manual` · `proactive_outbound` (mapped from `APPOINTMENT_ORIGIN_REGISTRY` — registries-medical-vertical capability)
- KPI columns: bookings · conversions · revenue · CAC (configurable per tenant)

### API
- `GET /api/v1/vitalia/marketing/attribution-matrix` — read snapshot persisted by Lucas analysis cron

### FE Components
- `vitalia/frontend/src/features/marketing/components/AttributionMatrixWidget.tsx` — heatmap conv cells (Tailwind tokens vt-text-success/warning/danger) + top insight Lucas
- `ReservationStage.tsx` — embeds `AttributionMatrixWidget` inline

### Hooks
- `useAttributionMatrix`

