# vitalia-marketing-bowtie-funnel-5-stages

5-stage Bowtie marketing funnel for health clinics: pre-revenue + post-revenue lens unified. SSoT en `BowtieStage` enum + `MarketingLayout` orchestrator FE. Pixel-invariante SVG per `02-design-ui-mockup.html`.

## Surface

### Domain
- `vitalia/backend/src/modules/vitalia/marketing/domain/enums.py::BowtieStage` — 5 values: `ATTRACTION`, `QUALIFICATION`, `RESERVATION`, `ADOPTION`, `EXPANSION`
- `BowtieSummary` / `StageDetail` / `ChannelDetail` domain entities (snapshot read by Lucas cron + channel_metrics)

### Persistence (Alembic migrations 026-031)
- `vitalia_channel_metrics` — per-stage KPIs source (synced by `channel_metrics_sync_meta/google` cron c/4h)
- `vitalia_channel_sync_state` — per-tenant per-provider sync health
- `vitalia_lucas_recommendations` — per-stage actionable insights

### API
- `GET /api/v1/vitalia/marketing/bowtie/summary` — 5-stage snapshot (counts + conversion rates + KPI hero)
- `GET /api/v1/vitalia/marketing/stage/{stage_slug}` — detailed stage view + secondary widgets (Reserva: Attribution, Expansión: Referrals)
- `GET /api/v1/vitalia/marketing/channels/{provider}` — per-channel breakdown row

### FE Components
- `vitalia/frontend/src/features/marketing/components/MarketingBowtieSVG.tsx` — pixel-invariante SVG renderer (5 stages)
- `MarketingStageTabs.tsx` — 5 tabs + KPI hero per active stage + count badges
- `MarketingLayout.tsx` — sticky top bowtie + tabs + StageDispatcher
- `StageDispatcher.tsx` — URL `?tab=` SSoT dispatches to AttractionStage/QualificationStage/ReservationStage/AdoptionStage/ExpansionStage
- 5 stage sections in `components/{Attraction,Qualification,Reservation,Adoption,Expansion}Stage.tsx`
- `vitalia/frontend/src/app/marketing/page.tsx` Server Component reading nuqs server-side

### Hooks
- `useBowtieSummary` · `useStageDetail` (React Query, key factory)

