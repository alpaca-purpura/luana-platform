# vitalia-marketing-referrals-leaderboard

Referrals widget en Stage Expansión: 3 KPIs hero + top 5 leaderboard + Adrián template CTA. Cron `referrals_value_sync` daily 10:00 UTC recomputes `conversion_value_cents` from completed appointments. Consume `LucasReferralsService` shipped 2026-05-18.

## Surface

### Domain
- `Referral` entity (status: `OPEN` · `SHARED` · `SIGNED_UP` · `CONVERTED` · `EXPIRED`)
- `ReferralStatus` enum (5 values per spec)
- `ReferralCodeGenerated`, `ReferralConverted` domain events

### Persistence (migrations 029 + 031)
- `vitalia_referrals` table — `conversion_value_cents INTEGER NOT NULL DEFAULT 0` (added in 031)
- Dual filter via `CompoundScopeRepositoryBase`

### Application
- `ReferralsService` (marketing proxy wrapper)
  - `leaderboard()` — top 5 ranked
  - `generate_code(patient_id)` — creates `Referral` row + code
- Proxies to agentic `LucasReferralsService.compute_referrals_leaderboard`

### Cron
- `referrals_value_sync` daily 10:00 UTC — recomputes `conversion_value_cents` from completed appointments (where `appointment.status = COMPLETED` AND `appointment.referral_id IS NOT NULL`)
- Updates `Referral.status = SIGNED_UP → CONVERTED` when revenue > 0

### API
- `GET /api/v1/vitalia/marketing/referrals` — leaderboard + KPIs hero

### FE Components
- `vitalia/frontend/src/features/marketing/components/ReferralsWidget.tsx` — 3 KPIs + top 5 leaderboard + Adrián CTA button
- `ExpansionStage.tsx` — embeds `ReferralsWidget` + NPS placeholder

### Hooks
- `useReferrals`

