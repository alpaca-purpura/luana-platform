## Dependencies (cluster pre-reqs — Chris manual gate)

- Namespace `vitalia` existe
- Secret `vitalia-secrets` con keys:
  - `NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY`, `CLERK_SECRET_KEY`, `CLERK_ISSUER`
  - `VITALIA_CLERK_WEBHOOK_SECRET` (NEW — Chris from Clerk dashboard webhook config)
  - `VITALIA_ADMIN_PASSWORD_HASH` (NEW — bcrypt from `generate_admin_password_hash.sh`)
- DNS `vitalia-admin.vitalialat.com` apunta a ingress controller
- cert-manager letsencrypt issuer configurado

