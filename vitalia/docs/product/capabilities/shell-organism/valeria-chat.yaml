# Valeria Chat Organism — Vitalia FE Fase 1 (F1-S6)

`ValeriaChat` organismo: panel chat dentro del slot derecho del `ValeriaSidebar`. Estructura completa **ChatHeader + ChatMessages + ChatComposer** con mock data 6 mensajes (incluye bot Valeria, user, delegate marker a Camila, bot Camila via Valeria, thinking dots Camila). Composer NO envía a backend real; al apretar Enter agrega user-message al store local, simula `thinking` 800ms, agrega bot-response canned determinístico (`MOCK_RESPONSES_BY_AGENT[activeAgent][count % len]`).

Reemplaza el `ValeriaChatSlot` placeholder (F1-S5) que tenía ChatHeader real + skeleton bubbles. F1-S6 evoluciona el header (preserva avatar/name/status, agrega Mode Pill "🤖 Modo agente" + status text largo "En línea · Tu secretaria virtual") y reemplaza body + composer con implementación funcional.

`ChatHeader` y `MessageBubble` parametrizados por `agent: AgentSlug` desde día 1 (D9) — preparado para sub-story futura ("AgentSwitcher en ChatHeader") que agregue selector/dropdown sin re-trabajo. F1-S6 hardcodea `DEFAULT_CHAT_AGENT='valeria'`; el setter `setActiveAgent(agent)` existe en `chat-store.ts` pero NO se consume desde UI (deferred).

XSS guard via React JSX text-children auto-escape — NUNCA `dangerouslySetInnerHTML` (arch test enforce).

## Surfaces

### Frontend (vitalia/frontend/src/)

- `lib/agent-catalog.ts` — **NEW SSoT 6 agentes canónicos** (lisa/valeria/adrian/lucas/camila/mateo) con slug + name + role + colorToken + colorSoftToken + hex + thumbnail + transparent + initial. Export `AgentSlug`, `AgentDescriptor`, `AGENT_CATALOG`, `AGENT_SLUGS`, `DEFAULT_CHAT_AGENT='valeria'`. Header comment LIFT CANDIDATE cross-brand. Consumed by: ChatHeader, MessageBubble, TypingIndicator, DelegateMarker (F1-S6); futuro Ribbon (F1-S7), RailIconButtons (F1-S5 evolve).
- `stores/chat-store.ts` — **NEW** zustand store. `messages: ChatMessage[]`, `activeAgent: AgentSlug`, `status: 'idle'|'thinking'|'streaming'`, `sendMessage(content)`, `clearMessages()`, `setActiveAgent(agent)`. Mock send flow: push user → setTimeout 800ms thinking → reemplaza por canned bot response → status idle. Idempotency guard: si status='thinking' segundo dispatch no-op. NO persist middleware (ephemeral cross-reload). Dev/test mode expone `window.__zustand_chat_store` para Playwright POM access.
- `components/shared/shell-organism/_mock-messages.ts` — **NEW** fixture. `MOCK_MESSAGES` 6 entries (bot/user/delegate/bot Camila/user/thinking Camila — Spanish neutro tuteo). `MOCK_RESPONSES_BY_AGENT` set rotativo determinístico (4 strings para valeria; arrays vacíos para otros agentes — F2 wire real).
- `components/shared/shell-organism/_agent-tw-classes.ts` — **NEW** DRY helper para dynamic Tailwind class names (switch/map JIT-safe, NO template strings).
- `components/shared/shell-organism/ValeriaChat.tsx` — **NEW** organism root `'use client'`. Grid 3 rows (header/messages/composer). Section role="region" aria-label.
- `components/shared/shell-organism/ChatHeader.tsx` — **NEW** molécula `'use client'`. Avatar 9×9 con img (onError fallback letra) + name + status text largo + Mode Pill (Shadcn Badge variant outline). Parametrizado por `agent: AgentSlug`.
- `components/shared/shell-organism/ChatMessages.tsx` — **NEW** molécula `'use client'`. `role="log" aria-live="polite"`. Switch render per `msg.role` (bot/user/delegate/thinking). EmptyStateChat branch cuando `messages.length === 0` (heading "Empieza una conversación" + subtexto tuteo + img Valeria grande con halo).
- `components/shared/shell-organism/ChatComposer.tsx` — **NEW** molécula `'use client'`. Textarea controlled (Enter envía, Shift+Enter newline, IME composition guard). 3 stubs adjuntos (📎/🎙️/⚡ con `title="próximamente"`). Send button bg-agent-valeria disabled cuando empty. sr-only label + kbd hint Cmd+K.
- `components/shared/shell-organism/MessageBubble.tsx` — **NEW** atom. Variants per `role: 'bot'|'user'` con styles diferenciados. Server Component (no hooks).
- `components/shared/shell-organism/TypingIndicator.tsx` — **NEW** atom. Bubble rico con name agent + acción text + 3 typing-dots animados (keyframe en globals.css).
- `components/shared/shell-organism/DelegateMarker.tsx` — **NEW** molécula. Italic centered con "→ delegando a [pill agent] (modo X)" + thumbnail pill.
- `components/shared/shell-organism/ValeriaSidebar.tsx` — **MODIFY** swap import + JSX: `<ValeriaChatSlot />` → `<ValeriaChat />` (preserva el resto: rail/history/drawer mobile/keyboard shortcuts intactos).
- `components/shared/shell-organism/ValeriaChatSlot.tsx` + `.test.tsx` — **DELETED** (F1-S5 placeholder cumplió su rol; reemplazado por implementación real).
- `app/globals.css` — **MODIFY** agrega `--agent-mateo-soft` (light + dark) que faltaba del set inicial; agrega `@keyframes typing-dot` + `.typing-dot` rule con nth-child delays.

