# vitalia.shell.routing

Sistema de routing del shell-organism agéntico: App Router Next.js 16 con `proxy.ts` (replaces middleware.ts), tenant validation server-side defense-in-depth 3 capas, `not-found.tsx` jerárquico (outer + inner), validators `isValidAgent`/`isValidSubtab` sobre `agent-catalog.ts` SSoT, default landing `/{tenantId}/valeria/agenda`.

## Surface

### Backend (`vitalia/backend/`)

- `src/main.py` (MODIFY F1-S9 T-1) — montaje `auth_router` desde `luana_core_iam.api.routers` con prefix `/api/v1/iam/users`. Pattern paridad nicolify:543 verbatim. Endpoint final: `GET /api/v1/iam/users/me/tenants` → `list[TenantSchema]`.
- DELETED `src/modules/vitalia/iam/api/router.py` (Slice 1 stub `/me` brand-local — zero consumers post (dashboard)/ cleanup).

### Frontend (`vitalia/frontend/`)

- `src/proxy.ts` (MODIFY F1-S9 T-3) — Clerk `clerkMiddleware()` + `createRouteMatcher` rutas públicas (`/sign-in`, `/sign-up`, `/marketing`, `/public/(.*)`, `/__clerk/(.*)`). Runtime Node.js (Next.js 16 default).
- `src/app/[tenantId]/(shell-organism)/layout.tsx` (MODIFY F1-S9 T-3) — server component con tenant validation: fetch `/me/tenants` → audit log cross-tenant attempt + no-tenants-assigned + network failure fallback.
- `src/app/[tenantId]/(shell-organism)/page.tsx` (MODIFY F1-S9 T-4) — redirect a `/{tenantId}/valeria/agenda` (default landing — cambio vs F1-S4 `/lisa/marca`).
- `src/app/[tenantId]/(shell-organism)/[agent]/layout.tsx` (NEW F1-S9 T-4) — validate agent slug or `notFound()`.
- `src/app/[tenantId]/(shell-organism)/[agent]/page.tsx` (NEW F1-S9 T-4) — redirect a `AGENT_CATALOG[agent].defaultSubtab`.
- `src/app/[tenantId]/(shell-organism)/[agent]/[subtab]/page.tsx` (NEW F1-S9 T-4) — validate subtab + placeholder `"Contenido próximamente — F1-S10 empty-states"`.
- `src/app/[tenantId]/(shell-organism)/not-found.tsx` (NEW F1-S9 T-4) — outer 404 sin chrome shell.
- `src/app/[tenantId]/(shell-organism)/[agent]/not-found.tsx` (NEW F1-S9 T-4) — inner 404 con chrome contextual del agent.
- DELETED `src/app/[tenantId]/(shell-organism)/[...slug]/page.tsx` (F1-S7 catchall stub obsoleto).
- `src/lib/agent-catalog.ts` (EXTEND F1-S9 T-2) — `isValidAgent(slug)` + `isValidSubtab(agent, subtab)` validators.
- `src/lib/iam/api.ts` (NEW F1-S9 T-2) — `fetchUserTenants(userId): Promise<TenantSchema[]>` consume core endpoint.
- `src/components/shared/shell-organism/NetworkErrorFallback.tsx` (NEW F1-S9 T-3) — fallback UI cuando BE timeout.

