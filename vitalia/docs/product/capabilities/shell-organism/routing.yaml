## Scenarios (verbatim 01-spec.md § 5)

8 Gherkin scenarios SC-1..SC-8 cubren happy-path + invalid agent (outer 404) + invalid subtab (inner 404) + cross-tenant attempt + network failure + a11y + i18n + no-tenants edge.

## HIPAA-lite compliance

- Audit log payload safe: SOLO `userId + attemptedTenant_id + timestamp + ip` (NO PII, NO patient data)
- Transport actual: `console.warn("[audit]", {...})`. BE audit endpoint diferido Fase 2 (writes a `audit_log` table con retention 10y).
- Cross-tenant attempts + no-tenants events siempre loggeados.

## Dependencies cross-package

- `luana-core-iam` (engine) — provee `auth_router` con `GET /me/tenants` + `TenantSchema` DTO. Mount via `app.include_router()` en vitalia/backend.
- `@clerk/nextjs` v6.36.8 — `clerkMiddleware()` + `auth()` server helpers.
- `next` v16.2.3 — `proxy.ts` file convention (replaces deprecated `middleware.ts`).

## KPIs (Fase 2 instrumentation)

- `shell_default_landing` event (post-login redirect)
- `shell_route_change` event (nav cross-tab)
- `shell_not_found_outer/inner` events (invalid URLs)
- `shell_cross_tenant_attempt` event (security audit)
- `shell_no_tenants_assigned` event (edge UX)
- `shell_network_error_fallback` event (degraded UX rate)
