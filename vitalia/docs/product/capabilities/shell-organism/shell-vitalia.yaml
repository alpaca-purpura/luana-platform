# vitalia-shell-vitalia

Shell visual consolidado de Vitalia post-login (ADR-vitalia-005 merge de 7 caps atómicos F1-S4..F1-S10). Layout 50/50 con Valeria conversacional izquierda + panel agéntico derecha (Ribbon 5 agentes + Configurar · SubTabsBar · empty states 22 sub-tabs). Splitter resizable con 3 estados (chat-collapsed · chat-narrow · 50-50). WAI-ARIA tablist completo.

## Atomics incluidos

| Atomic | Story origen | Surface | Status |
|---|---|---|---|
| Layout 50/50 splitter resizable | vitalia-fase1-shell-layout-5050 (F1-S4) | FE | live |
| Valeria sidebar rail + history | vitalia-fase1-valeria-rail-history (F1-S5) | FE | live |
| Valeria chat skeleton | vitalia-fase1-valeria-chat-skeleton (F1-S6) | FE | live |
| Ribbon 6 tabs WAI-ARIA | vitalia-fase1-ribbon-6-tabs (F1-S7) | FE | live |
| SubTabsBar línea 2 | vitalia-fase1-sub-tabs-line2 (F1-S8) | FE | live |
| Routing shell route groups | vitalia-fase1-routing-shell (F1-S9) | FE | live |
| Empty states 22 sub-tabs | vitalia-fase1-empty-states (F1-S10) | FE | live |

## Surface

### Key components (`vitalia/frontend/src/components/shared/shell-organism/`)

- `AppPanelSlot.tsx` — orquestador principal. Grid `grid-rows-[auto_auto_1fr]`. Valeria-side izquierda · contenido-side derecha. Splitter resizable 3 estados.
- `Ribbon.tsx` + `RibbonTab.tsx` + `ConfigTab.tsx` — Ribbon horizontal con 5 agentes + Configurar. WAI-ARIA tablist completo (roving tabindex, Arrow/Home/End, aria-selected).
- `SubTabsBar.tsx` — sub-tabs de segunda línea que cambian según agente activo. Colores `bg-agent-{slug}-soft`.
- `SubSubTabsBar.tsx` — N3-static para sub-tabs con 3+ vistas (ADR-vitalia-004 v1.1).
- `ValeriaChat.tsx` + `ValeriaRail.tsx` — Valeria side: modo chat (expandido) y modo rail (60px colapsado).
- `EmptyStatePlaceholder.tsx` — Placeholder 22 sub-tabs con mensajes contextuales por agente.

### Routing

- `vitalia/frontend/src/app/[tenantId]/(shell-organism)/` — route group raíz del shell
- `vitalia/frontend/src/lib/agent-catalog.ts` — SSoT `AGENT_CATALOG` + `AGENT_RIBBON_ORDER` + `AGENT_SUBTABS` + `AGENT_SUBSUBTABS` + `extractAgentFromPath()`
- `vitalia/frontend/src/proxy.ts` — proxy auth middleware
- `vitalia/frontend/src/lib/iam/api.ts` — IAM client-side

### Design tokens

- `bg-agent-lisa-soft` · `bg-agent-lucas-soft` · `bg-agent-adrian-soft` · `bg-agent-valeria-soft` · `bg-agent-camila-soft`
- Fuente: `vitalia/frontend/src/app/globals.css` + `vitalia/frontend/src/lib/tokens.ts`

