# SubTabsBar Organism — Vitalia FE Fase 1 (F1-S8)

`SubTabsBar` organismo: barra horizontal LÍNEA 2 debajo del Ribbon, dinámica per agente activo. Renderiza N sub-tabs del agente (4·5·4·2·4·3 según `RIBBON_SUBTABS` whitelist: Lisa 4 · Lucas 5 · Adrián 4 · Valeria 2 · Camila 4 · Config 3) con active state per URL segment `[subtab]` derivado de `extractSubtabFromPath(usePathname())`. Color tint por agente (`bg-agent-{slug}-soft` + `agentTextClassSubTab(slug)`) cuando active; Lucas excepción D18 (text-foreground por contraste); Config excepción D19 (bg-muted + text-foreground, color neutral). WAI-ARIA tablist completo con roving tabindex pattern (Arrow Left/Right circular wrap · Home/End · Enter/Space) — paridad F1-S7 Ribbon.

Q5 cement: `return null` cuando `activeAgent === null || subtabs.length === 0` (no DOM, grid AppPanel colapsa fila). Q4 cement: `min-h-[42px]` contenedor con `bg-card border-b border-border flex items-center px-4 gap-1 overflow-x-auto`. Q1 cement (anti-duplication): EXTEND `vitalia/frontend/src/lib/agent-catalog.ts` (NO crear `lib/agents/subtabs.ts`).

Reemplaza el placeholder skeleton sub-tabs de F1-S4/F1-S7 (`AppPanelSlot.tsx` líneas 56-65) con `<SubTabsBar />` real. Visible en ambos modos shell (`agentic` 50/50 split + `web` Valeria rail 60px) — misma horizontal sin if-statements `mode === 'web'`, adaptación via `flex` + `overflow-x-auto` natural.

## Surfaces

### Frontend (vitalia/frontend/src/)

- `lib/agent-catalog.ts` — **EXTEND F1-S6/F1-S7 SSoT** con `SubTabMeta` interface (`{ id: string; label: string; icon: string }`) + `RIBBON_SUBTABS: Record<RibbonTabSlug, readonly SubTabMeta[]>` (22 sub-tabs distribuidos, mateo=[] transversal) + `extractSubtabFromPath(pathname)` helper con defensive null/undefined handling (devuelve raw segment, consumer compara contra ids estáticos). Anti-duplication Q1 HARD: NO crear `lib/agents/subtabs.ts` ni `lib/agents/routing.ts`.
- `components/shared/shell-organism/SubTabsBar.tsx` — **NEW** organismo (`'use client'`). `usePathname` + `useRouter` + `useParams<{tenantId}>` + `useRef<(HTMLButtonElement | null)[]>` array + `useState<focusedIdx>` para roving tabindex. `handleKeyDown` sync handler con modulo aritmético wrap circular (paridad Ribbon.tsx F1-S7). `navigateTo(subtabId)` callback con `router.push('/{tenantId}/{activeAgent}/{subtabId}')`. Q5 early-return guard antes de hooks-dependent work.
- `components/shared/shell-organism/SubTab.tsx` — **NEW** molécula con `forwardRef<HTMLButtonElement>`. Emoji `aria-hidden="true"` (decorative) + visible label span. Active state: `bg-agent-{slug}-soft` tint + `agentTextClassSubTab(slug)` + `font-semibold` + active:hover preserva tint (paridad F1-S7 Q16). `role="tab"` + `aria-selected` + `tabIndex` roving + `data-testid="sub-tab-{id}"` + `data-active` + `data-color`. Focus-visible ring: `focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-1` (no plain `focus:`).
- `components/shared/shell-organism/_agent-tw-classes.ts` — **EXTEND F1-S6** con `agentTextClassSubTab(slug: RibbonTabSlug): string` Tailwind switch helper. Standard agents (lisa/valeria/adrian/camila/mateo) → `text-agent-{slug}`. Lucas exception D18: `text-foreground` (hex #111111 near-black, poor contrast on bg-lucas-soft). Config exception D19: `text-foreground` (Config not agente, bg-muted neutral). TypeScript exhaustiveness guard en default branch (never assertion).
- `components/shared/shell-organism/AppPanelSlot.tsx` — **MODIFY** swap placeholder `<div aria-hidden="true" className="flex items-center gap-3 ...">` skeleton sub-tabs por `<SubTabsBar />` real. Grid `grid-rows-[auto_auto_1fr]` preservado (Ribbon row 1 · SubTabsBar row 2 · content row 3).

