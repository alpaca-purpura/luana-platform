## Scenarios (verbatim de 01-spec.md v2 — embedded post-merge)

### SC-1 happy · click tab agente navega a default subtab

```gherkin
Given usuario en /{tenantId}/lisa/marca, active tab Lisa visible con bg-agent-lisa-soft tint
When click RibbonTab "Atraer" (Lucas)
Then router.push("/{tenantId}/lucas/lanzar") se invoca (AGENT_CATALOG.lucas.defaultSubtab="lanzar")
And el segmento URL [agent] cambia a "lucas"
And active state migra: Lucas tab muestra bg-agent-lucas-soft + label font-semibold
And Lisa tab pierde tint (text-muted-foreground, font-medium)
```

### SC-2 happy · URL deep link marca active state correcto

```gherkin
Given usuario navega directamente (deep link) a /{tenantId}/camila/voz
When la página carga
Then extractAgentFromPath(pathname) devuelve "camila"
And Camila tab renderiza con bg-agent-camila-soft + label font-semibold
And aria-selected="true" solo en Camila tab
```

### SC-3 happy · ConfigTab navega a /{tenantId}/config/cuenta

```gherkin
Given active tab cualquier agente (ej. Valeria)
When click ConfigTab (IconButton ⚙ right-aligned)
Then router.push("/{tenantId}/config/cuenta") se invoca
And ConfigTab muestra estado active (bg-muted + ring-1 + data-active=true)
And tooltip "Configurar" se oculta tras click
```

### SC-4 negative · URL inválido → idle

```gherkin
Given usuario navega a /{tenantId}/foobar/baz (segmento [agent] inválido)
When la página carga
Then extractAgentFromPath devuelve null
And ninguno de los 6 tabs muestra active state
And aria-selected="false" en todos
And NO se lanza error en consola
```

### SC-5 edge · viewport mobile 375px → horizontal scroll

```gherkin
Given viewport 375x667
When la página carga con active=lisa
Then el Ribbon renderiza con overflow-x-auto
And user puede scrollear lateral para alcanzar ConfigTab al final
And ConfigTab mantiene ml-auto (último DOM, no flota fijo)
```

### SC-6 adversarial · XSS payload → safe

```gherkin
Given usuario navega a /{tenantId}/<script>alert(1)</script>/foo
When la página carga
Then extractAgentFromPath devuelve null (slug enum mismatch sanitizes)
And React JSX auto-escape sanea el segment
And NO se ejecuta el script
```

### SC-7 a11y · keyboard WAI-ARIA tablist completo

```gherkin
Given foco en body
When Tab → focus va al primer tab activable
And Arrow Right → focus mueve a Lucas (no activa)
And Home → focus regresa a Lisa
And End → focus salta a ConfigTab (último, índice 5)
And Enter en ConfigTab focused → router.push("/{tenantId}/config/cuenta")
Then focus ring visible (ring-2 ring-ring) sobre el tab focused
And screen reader anuncia "tab, {tabLabel}, {N de 6}"
```

### SC-8 i18n · microcopy Spanish neutro verbatim

```gherkin
Given Ribbon renderizado
When inspeccionamos textos visibles
Then verificamos: Mi Clínica·Lisa / Atraer·Lucas / Vender·Adrián / Operar·Valeria / Mantener·Camila / Configurar
And ConfigTab aria-label="Configurar"
And NO aparece voseo
And tildes correctas (Adrián con tilde, Clínica con tilde)
```

### SC-9 edge · Avatar PNG falla → fallback initial

```gherkin
Given thumbnail PNG de Valeria 404 (asset removed / CDN flake)
When Ribbon renderiza tab Valeria
Then Shadcn AvatarImage detecta fallo
And AvatarFallback muestra letra "V" sobre bg-agent-valeria-soft
And el tab sigue funcional
```

