# Ribbon Organism — Vitalia FE Fase 1 (F1-S7)

`Ribbon` organismo: barra horizontal arriba del AppPanel con 5 RibbonTabs (Lisa·Lucas·Adrián·Valeria·Camila) + 1 ConfigTab (⚙️ IconButton 40x40 right-aligned). Active state per URL segment `[agent]` derivado de `extractAgentFromPath(usePathname())`. Click navega a default subtab del agente via `router.push('/{tenantId}/{slug}/{defaultSubtab}')`. WAI-ARIA tablist completo (6 tabs en sequence — ConfigTab peer del tablist) con roving tabindex pattern (Arrow Left/Right circular wrap · Home/End · Enter/Space). Avatar fallback graceful Shadcn `<AvatarFallback>` con initial letter sobre `bg-agent-{slug}-soft` si PNG 404.

Reemplaza el placeholder skeleton ribbon de F1-S4 (`shell-layout-5050`) en `AppPanelSlot.tsx`. Visible en ambos modos shell (`agentic` 50/50 split + `web` Valeria rail 60px) — misma horizontal sin if-statements `mode === 'web'`, adaptación via `flex` + `overflow-x-auto` natural.

## Surfaces

### Frontend (vitalia/frontend/src/)

- `lib/agent-catalog.ts` — **EXTEND F1-S6 SSoT** con `tabLabel` + `defaultSubtab` per agente + `AGENT_RIBBON_ORDER` readonly tuple `['lisa', 'lucas', 'adrian', 'valeria', 'camila']` (excluye mateo transversal) + `RibbonTabSlug = AgentSlug | 'config'` union type + `extractAgentFromPath(pathname)` helper con defensive null/undefined/invalid handling. Anti-duplication HARD: NO crear `lib/agents/catalog.ts` (arch fitness `test-agent-catalog-ssot.test.ts` enforce).
- `components/shared/shell-organism/Ribbon.tsx` — **NEW** organismo (`'use client'`). `usePathname` + `useRouter` + `useParams<{tenantId}>` + `useRef<(HTMLButtonElement | null)[]>` array + `useState<focusedIdx>` para roving tabindex. `handleKeyDown` sync handler con modulo aritmético wrap circular. `navigateTo(slug)` callback con `router.push`. `TooltipProvider` wrap para ConfigTab tooltip.
- `components/shared/shell-organism/RibbonTab.tsx` — **NEW** molécula con `forwardRef<HTMLButtonElement>`. Avatar Shadcn 28px circle + AvatarFallback con initial sobre `agentBgSoftClass(slug)`. tabLabel + role spans con `whitespace-nowrap` HARD (Q15 cement — ribbon h-14 uniforme en widths estrechos). Active state: `bg-agent-{slug}-soft` tint + `font-semibold` + active:hover preserva tint (Q16 cement — repite `hover:${agentBgSoftClass(slug)}` para specificity). `role="tab"` + `aria-selected` + `tabIndex` roving + `data-testid="ribbon-tab-{slug}"` + `data-active`.
- `components/shared/shell-organism/ConfigTab.tsx` — **NEW** molécula `forwardRef`. IconButton 40x40 + Lucide `Settings` icon + Shadcn Tooltip "Configurar". **Q13 cement: `role="tab"` + `aria-selected` + `tabIndex` roving (peer del tablist, Slack/Notion pattern). NO standalone button.** `ml-auto` right-align. Active state: `bg-muted` + `ring-1 ring-border` + `data-active="true"`.
- `components/shared/shell-organism/AppPanelSlot.tsx` — **MODIFY** swap placeholder skeleton `<div ribbon />` por `<Ribbon />` real. Grid `grid-rows-[auto_auto_1fr]` preservado (Ribbon row 1 · F1-S8 sub-tabs placeholder row 2 · content row 3).
- `components/shared/shell-organism/_agent-tw-classes.ts` — **REUSE** existing `agentBgSoftClass(slug)` helper (F1-S6) + Tailwind purge allowlist con `bg-agent-{slug}-soft` 5 classes static (JIT-safe switch).

