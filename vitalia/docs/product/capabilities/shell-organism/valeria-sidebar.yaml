# Valeria Sidebar Organism — Vitalia FE Fase 1

Panel izquierdo del shell agéntico (50% del viewport en modo agentic). Grid interno 2-col mutuamente exclusivos:
- **State `rail`:** `[Rail 60px | Chat 1fr]` — rail con 4 botones MVP (PanelLeftOpen/Plus/Search/PanelLeftClose) + chat slot placeholder
- **State `full`:** `[History 280px | Chat 1fr]` — history panel (header + search + 3 grupos Hoy/Ayer/Esta semana + 8 mock items) + chat slot placeholder
- **State `collapsed`:** auto-triggers `shellMode='web'` (Valeria minimizada a rail 60px + AppPanel 100%)

Mobile (`<md` viewport): React.createPortal monta drawer a `document.body` para escapar del hidden agentic main parent (CSS spec: descendants de `display:none` no renderizan ni `position:fixed`). Drawer con `role="dialog" aria-modal="true"` + backdrop + focus trap manual.

Keyboard shortcuts globales con hardened guard: `c/r/f/n/Esc/Cmd+K`. Skip handler si `e.isComposing=true` (IME) OR target ∈ INPUT/TEXTAREA/[contenteditable]/[role=textbox] OR ancestor con esos atributos. Modifier shortcuts (Cmd+K) bypassan guard.

Adversarial guard: invalid `valeriaState` (devtools tampering) → `console.warn` + fallback render `'rail'` (cero white screen).

