## Scenarios (verbatim 01-spec.md)

### SC-1 happy · keyboard cycle de estados + auto-coupling shellMode

```gherkin
Given Shell carga con valeriaState 'full' (default architect override F1-S4) + shellMode 'agentic'
  And focus NO está en ningún <input>/<textarea>/[contenteditable]
When user presiona tecla 'r'
  And presiona 'f'
  And presiona 'c'
  And presiona 'Escape'
  And presiona 'r' de nuevo
Then 'r' transitions a [Rail 60 | Chat 1fr], shellMode sigue 'agentic'
  And 'f' transitions a [History 280 | Chat 1fr]
  And 'c' setValeriaState('collapsed') + setShellMode('web') auto-coupled, layout 50/50→[60|1px|AppPanel 1fr]
  And 'Escape' idempotente — sigue en collapsed/web
  And 'r' de nuevo setValeriaState('rail') + setShellMode('agentic') auto-restored
  And localStorage 'vitalia-shell-state' persiste valeriaState + shellMode tras cada cambio
```

### SC-2 negative · typing en composer NO dispara shortcuts

```gherkin
Given ValeriaSidebar en state 'full' + focus en composer (textarea/contenteditable)
When user escribe 'COMPRAR' (C-O-M-P-R-A-R) + Enter
Then letras 'c/r' (shortcuts globales) se escriben normalmente en el campo
  And valeriaState sigue 'full' (no cambió)
  And cero side-effect en localStorage
```

### SC-3 edge · IME composition skip shortcuts

```gherkin
Given focus en composer textarea + user activa IME (Pinyin / acento muerto)
When user comienza composición (e.isComposing === true) + roza tecla 'r' o 'c'
Then handler skip por e.isComposing guard — NO transition valeriaState
  And IME composition continúa sin interrupción
```

### SC-4 adversarial · shell-store tampering devtools

```gherkin
Given ValeriaSidebar en state 'rail'
When atacante en devtools console: useShellStore.setState({ valeriaState: 'INVALID' as any })
Then type guard runtime ignora valor inválido OR ValeriaSidebar render fallback 'rail' default
  And cero crash app · cero white screen
  And console.warn emite 'Invalid valeriaState ignored'
```

### SC-5 edge · click rail PanelLeftClose mientras agentic

```gherkin
Given ValeriaSidebar state='rail', shellMode='agentic' (50/50 split)
When user click botón PanelLeftClose (footer rail)
Then setValeriaState('collapsed') + setShellMode('web') ejecutados (mismo handler que keyboard 'c')
  And shell layout transitions 50/50 → [60px Rail | 1px | AppPanel 1fr] con animación 220ms
  And chat se oculta, rail queda visible (4 botones MVP)
  And click PanelLeftOpen o press r/f vuelve a agentic
```

### SC-6 empty_state · búsqueda sin resultados

```gherkin
Given ValeriaSidebar state='full' (history visible con 8 mock items) + focus en search input
When user escribe 'xyzabc123' (string sin match)
Then lista history items filtra a 0 resultados
  And EmptyStateInline muestra: icon Search24 muted + h3 'Sin resultados' + p 'Intenta con otra palabra'
  And grupos 'Hoy/Ayer/Esta semana' desaparecen (no mostrar labels vacíos)
  And input search retiene texto escrito
  And press Esc limpia búsqueda + restablece lista completa (NO colapsa Valeria mientras input tiene focus)
```

### SC-7 a11y · keyboard navigation + axe wcag2aa

```gherkin
Given ValeriaSidebar montado (state='rail') + screen reader simulated (axe-playwright + Tab traversal)
When user presiona Tab repetidamente desde TopBar
Then Tab order lógico: TopBar items → Rail buttons (PanelLeftOpen → Plus → Search → PanelLeftClose) → ChatSlot composer placeholder
  And cada botón rail anuncia rol + nombre via aria-label (ej. 'Mostrar historial')
  And aside tiene role='complementary' + aria-label='Panel Valeria' + aria-expanded={valeriaState !== 'collapsed'}
  And live region role='status' aria-live='polite' anuncia cambios estado: 'Valeria con historial' / 'Valeria abierta' / 'Valeria cerrada'
  And contrast ratio texto rail buttons hover ≥ 4.5:1 (tokens vitalia validan)
  And axe-playwright ruleset wcag2aa 0 violations en estados collapsed/rail/full
```

### SC-8 a11y · mobile drawer aria-modal + focus trap

```gherkin
Given viewport 375x667 (mobile) + drawer cerrado + focus en TopBar hamburger
When user press Enter (tap) hamburger + Tab repetidamente + press Esc
Then drawer abre con role='dialog' + aria-modal='true' + focus auto-mueve al primer interactivo (input search)
  And focus trap activo: Tab cycle dentro del drawer, no escapa al background
  And backdrop tiene aria-hidden='true' + click cierra drawer
  And press Esc cierra drawer + focus auto-retorna al hamburger (focus restoration)
  And axe-playwright 0 violations modal pattern
```

### SC-9 i18n · Spanish neutro LatAm rendered

```gherkin
Given ValeriaSidebar state='full' montado en cualquier viewport
When render completo del componente
Then todos los strings user-facing son Spanish neutro (tuteo, sin voseo):
  'Conversaciones', 'Buscar conversación...', 'Nueva conversación', 'Hoy', 'Ayer', 'Esta semana',
  'Sin resultados', 'Intenta con otra palabra', 'En línea', 'Valeria'
  And tooltips rail buttons: 'Mostrar historial', 'Nueva conversación', 'Buscar (Cmd+K)', 'Cerrar Valeria'
  And alert mock 'n': 'Nueva conversación (próximamente)'
  And aria-labels español neutro
  And cero voseo: cero match contra glosario .claude/rules/spanish-text.md
  And cero placeholders sin traducir tipo 'TODO' / 'Lorem ipsum' / 'Search...'
  And cero PHI patterns en mock data (HIPAA-lite compliant)
```

