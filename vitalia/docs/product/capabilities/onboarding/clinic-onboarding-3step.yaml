## Dependencies

- `luana-core-iam` (tenant provisioning)
- `luana-core-platform` (clerk webhook adapter para signup)
- `vitalia.infrastructure.adapters.clerk_webhook_adapter`

## Scenarios live

- Usuario nuevo se registra en Clerk → clerk_webhook crea tenant
- Doctor abre `/onboarding/step-1` → elige tipo de clínica
- Step 2: completa perfil + país (`AR/CL/MX/CO/PE/BR/US`) → moneda default por país
- Step 3: elige plan tier → tenant queda configurado
- Default currency por país honrado en booking + payment flows
