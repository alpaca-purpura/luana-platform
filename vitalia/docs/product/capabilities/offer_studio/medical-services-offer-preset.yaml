# vitalia-medical-services-offer-preset

Preset pack `medical_services_v1` registrado vía Extension SDK EP-2 en `extensions.py`. Wizard de creación de oferta multi-paso adaptado a verticales médicas: consulta individual, paquete de sesiones, plan de tratamiento, suscripción wellness.

## Surface

### Config (`vitalia/config/brand.yaml`)

```yaml
offer_studio:
  preset_pack: medical_services_v1
  default_offer_type: medical_services
```

### Frontend (`vitalia/frontend/`)

- **Rutas dashboard**:
  - `src/app/(dashboard)/offers/page.tsx` — listado
  - `src/app/(dashboard)/offers/new/page.tsx` — wizard
  - `src/app/(dashboard)/offers/[id]/page.tsx` — detalle/edit
- **Componentes** (`features/vitalia/components/`):
  - `offer-wizard-client.tsx`
  - `medical-services-offer-wizard-steps.tsx`
- **Schemas + hooks**: `schemas/offer-wizard-schema.ts`, `api/use-offers.ts`, `api/use-offer.ts`, `api/use-offer-create.ts`, `api/use-offer-presets.ts`

### Backend

- Consume `core/luana-core-offer-studio/` (engine) vía Extension SDK EP-2 (preset pack)
- API: `GET /api/v1/vitalia/offer/presets` — devuelve preset_pack medical_services_v1 con sub-formats

## Test coverage

- `vitalia/frontend/tests/integration/offer-wizard-flow.test.ts` — wizard E2E
- E2E smoke: `vitalia/frontend/e2e/specs/vitalia/offer-wizard-individual-session.smoke.spec.ts`, `offer-wizard-packages.smoke.spec.ts`, `offer-wizard-implant.smoke.spec.ts`

## Dependencies

- `core/luana-core-offer-studio` (engine — archetype + value_level + section + format catalogs)
- `luana-core-extension-sdk` EP-2 (OfferTypePresetDef)
- `core/luana-core-llm` (extraction wave-based para autocompletar offer fields)

## Scenarios live

- Dentista crea oferta "Implante dental + corona" → wizard guía variant_structure
- Psicóloga crea paquete "10 sesiones de terapia" → preset packages activado
- Wellness center crea suscripción mensual → preset subscription_wellness
- Plan de tratamiento multi-procedimiento → preset treatment_plan
- Conditional questions del preset filtran fields visibles según offer_type
