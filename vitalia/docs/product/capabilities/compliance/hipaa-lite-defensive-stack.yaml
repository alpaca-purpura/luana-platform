## Dependencies

- `luana-core-observability` (sanitization factory)
- `luana-core-extension-sdk` (compliance gates registry)

## Scenarios live

- Toda lectura/escritura PHI via PatientRepository (extends PhiRepositoryBase) bloquea queries sin clinic_id
- Audit log row creada SYNC antes response — verificable via DB query post-request
- WhatsApp tier free + SMS bloqueados para mensajes con `contains_phi=true`
- Marketing role queries → PHIAccessDeniedError (no autorizado)
- PHI fields redacted en traces via sanitize_phi_payload (22 fields)

