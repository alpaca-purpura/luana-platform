# vitalia-hipaa-lite-defensive-stack

HIPAA-lite defensive infrastructure architecturally enforced (no human-discipline). Combina dual filter validation, audit log sync writes, PHI sanitization vía engine factory, RBAC decorator pattern, channel guard, encryption-at-rest pgcrypto.

## Surface

- **`PhiRepositoryBase`** (`infrastructure/persistence/phi_repository_base.py`) — base class enforces dual filter tenant_id + clinic_id en toda query PHI. `.validate_dual_filter(tenant_id, clinic_id)` raises `MissingClinicFilterError` si clinic_id missing
- **`AuditLogRepository`** (`infrastructure/persistence/audit_log_repository.py`) — sync write (await session.execute + flush) antes response, NO fire-forget. `AuditLogEntry` contiene tenant_id, clinic_id, user_id, action, resource_type, resource_id, from_ip, user_agent, timestamp, payload_redacted BYTEA
- **`KEKClient`** (`infrastructure/encryption/kek_client.py`) — Key Encryption Key from env var only (KEK rotation annually)
- **`@require_phi_access(roles=["doctor","nurse","admin_clinic"])`** decorator — application layer RBAC gate. `PHIAccessDeniedError` raised si role no autorizado
- **`VitaliaComplianceAdapter`** (`application/compliance_adapter.py`) — channel guard. Blocks `whatsapp_free` + `sms` para mensajes con PHI. `BlockedChannelError` raised
- **`sanitize_phi_payload`** — imported from `core/luana-core-observability/src/luana_core_observability/recording/sanitization.py` (NOT mirrored). Vitalia-specific 22 PHI fields configurados en `phi_fields.py` SSoT
- **pgcrypto BYTEA columns** (T-infra-1): `treatment_plans.notes`, `re_engagement_events.payload_phi`, `channel_sync_state.oauth_token_encrypted`

