# vitalia-design-tokens-theme

Theme toggle (light/dark) operativo con persistencia localStorage via next-themes. Completa el sistema de design tokens iniciado en F1-S0: ahora `:root` + `.dark` blocks tienen TODAS las CSS vars Shadcn-standard + agent tokens, `tailwind.config.ts` declara `darkMode: ['class', '[data-theme="dark"]']` para honrar next-themes attribute mode, y `<ThemeToggle>` component reusa Shadcn Button ghost icon con Lucide Moon/Sun + ARIA dinámico Spanish neutro.

## Surface

### Theme infrastructure (`vitalia/frontend/`)

- `package.json` + `pnpm-lock.yaml` — `next-themes ^0.3.0` devDep
- `src/app/globals.css` — `:root` (light) + `.dark` blocks COMPLETOS verbatim Design Contract § 5.1 (Shadcn standard vars + 7 agent tokens base + 5 soft variants). Bloque `.vt-*` legacy preservado intacto.
- `tailwind.config.ts` — `darkMode: ['class', '[data-theme="dark"]']` + theme.extend.colors agent palette
- `src/app/layout.tsx` — `<html lang="es" suppressHydrationWarning>` (silencia hydration warning legítimo por next-themes inline script)
- `src/app/providers.tsx` — `<ThemeProvider attribute="data-theme" defaultTheme="light" enableSystem={false} storageKey="vitalia-theme">` wrapping children (D1+D4 ratificadas)

### ThemeToggle component (`vitalia/frontend/src/components/shared/shell-organism/`)

- `ThemeToggle.tsx` — client component named export. Uses Shadcn `<Button variant="ghost" size="icon">` + Lucide `Moon`/`Sun` icons (`h-[1.2rem] w-[1.2rem]`). Imports `useTheme` directo desde next-themes (D5 ratificada — drop wrapper hook).
- `ThemeToggle.test.tsx` — Vitest unit suite (7 tests):
  - Renders Moon icon when theme=light
  - Renders Sun icon when theme=dark
  - aria-label dinámico Spanish neutro `Cambiar tema (actual: ${isDark ? 'oscuro' : 'claro'})`
  - aria-pressed boolean
  - data-testid="theme-toggle" estable
  - Click calls setTheme con valor opuesto
  - Initial state SSR-safe (defaultTheme="light")

### Vitest introspection (`vitalia/frontend/src/__tests__/tokens/`)

- `test-shadcn-vars-resolvable.test.ts` — 59 tests verificando que CSS vars del Design Contract § 5.1 están definidas en `globals.css` :root + .dark:
  - 16 Shadcn standard vars (--background, --foreground, --primary, --accent, etc.)
  - 7 agent tokens base + 5 soft variants
  - 13 vitalia brand legacy vars preservados
  - Format HSL space-separated (no commas)
  - Tailwind config resolvability vía require('./tailwind.config.ts')

### Test page preview (`vitalia/frontend/src/app/test-stack/design-tokens-theme/`)

- `page.tsx` — Next.js wrapper que importa+ exporta default `e2e/__test-pages__/design-tokens-theme/theme-toggle-showcase.tsx`. Permite navegar a `/test-stack/design-tokens-theme` sin auth (proxy.ts ya lista `/test-stack(.*)` public).

### Test page fixture (`vitalia/frontend/e2e/__test-pages__/design-tokens-theme/`)

- `theme-toggle-showcase.tsx` — renderiza ThemeToggle aislado en card neutral (sin Clerk auth, sin layout app). Fixture pure para Playwright visual baseline.

### Playwright suites (`vitalia/frontend/e2e/`)

- `regression/design-tokens-theme/theme-toggle-interaction.smoke.spec.ts` — behavior tests (3 scenarios):
  - SC-01 click toggle alterna html data-theme + localStorage + ARIA state
  - SC-02 reload persistencia + NO FOUC
  - SC-03 ARIA pressed boolean + aria-label dinámico
- `visual/design-tokens-theme/theme-toggle.spec.ts` — visual goldens (2 scenarios):
  - SC-04 ThemeToggle light mode golden
  - SC-05 ThemeToggle dark mode golden
- `a11y/design-tokens-theme/theme-toggle.spec.ts` — accessibility (3 scenarios):
  - SC-06 zero WCAG 2.1 AA violations light mode (axe-core)
  - SC-07 zero WCAG 2.1 AA violations dark mode
  - SC-08 keyboard navigation Tab focuses + Enter/Space activates

### Visual goldens (`vitalia/frontend/e2e/__screenshots__/visual/design-tokens-theme/theme-toggle.spec.ts/`)

- `theme-toggle-light.png` — generado + matched vs `mockups/theme-toggle.html` (Chris ratificado 2026-05-22T19:00 iter 1)
- `theme-toggle-dark.png` — primer dark golden REAL (no byte-idéntico a light — F1-S1 introduce real .dark class application via next-themes)

