# vitalia-tenant-switcher

Dropdown TenantSwitcher (organismo) montado dentro de `TopBarGlobal`. Lista clínicas accesibles al usuario actual + 2 footer actions (Agregar clínica placeholder · Administrar cuenta). Persiste tenant activo en `localStorage` (Zustand `tenant-store` partialize). Selecciona tenant distinto → `window.location.href` hard redirect preservando path (`pathname.replace(/^\/[^/]+/, '/' + newTenantId)`). Cross-user isolation via Clerk `signOut` hook (`useSignOutCleanup`).

## Surface

### Atoms / molecules / organism (`vitalia/frontend/src/components/shared/shell-organism/`)

- `TenantBadge.tsx` — átomo. Hash determinístico `tenant.id` → paleta 6 colores (cyan/purple/fuchsia/amber/lime/rose). Contrast fix: amber+lime usan `text-amber-950/text-lime-950`.
- `TenantOption.tsx` — molécula. Badge + nombre + ciudad + Check icon cuando activa (`data-active="true"` + sr-only "Clínica activa").
- `TenantSwitcher.tsx` — organismo. Compose DropdownMenu Shadcn (4 states: loading/error/success/empty). Trigger truncate responsive (max-w-[180px]/[140px]) + tooltip nativo `title={tenant.name}`.
- `AddClinicPlaceholderModal.tsx` — Dialog Shadcn "Próximamente" + Entendido CTA.
- `TenantStoreBootstrap.tsx` — invisible Client Component montado en `app/layout.tsx`. Hidrata tenant-store con `useTenants` query + activa `useSignOutCleanup` listener.
- `TopBarGlobal.tsx` — F1-S2 organism, ahora monta `<TenantSwitcher />` (reemplaza placeholder slot eliminado).

### State / data / hooks

- `vitalia/frontend/src/stores/tenant-store.ts` — Zustand store con `persist({ name: "vitalia-tenant-state", partialize: { activeTenant } })`.
- `vitalia/frontend/src/hooks/useTenants.ts` — React Query `useQuery(["tenants"], fetchTenants, { staleTime: 5min })`. Consume engine `GET /api/tenants` shipped Story 11.
- `vitalia/frontend/src/hooks/useSignOutCleanup.ts` — listener Clerk `isSignedIn` flip `true→false` → `clearStore()` + `localStorage.removeItem("vitalia-tenant-state")`.
- `vitalia/frontend/src/lib/tenant-palette.ts` — pure functions `getTenantPaletteColor(tenantId)` (hash → palette index) + `buildRedirectPath(currentPath, newTenantId)`.

### Test fixtures + page (F1-S2 parity pattern)

- `vitalia/frontend/e2e/__test-pages__/tenant-switcher/tenant-switcher-showcase.tsx` — Server Component fixture, renderiza `TopBarGlobal` + main wrapper. No Clerk auth, no PHI.
- `vitalia/frontend/src/app/test-stack/tenant-switcher/page.tsx` — Next.js route wrapper que re-exporta fixture.

