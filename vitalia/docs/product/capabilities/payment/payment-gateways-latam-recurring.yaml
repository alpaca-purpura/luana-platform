## Dependencies

- `core/luana-core-channels` (MercadoPagoAdapter base — LIFT shared Story 11)
- `core/luana-core-billing` o `luana-core-payments` (Stripe Connect base)
- `core/luana-core-idempotency` (idempotency keys para webhooks)
- `core/luana-core-events` (DomainEvent emission outbox)

## Scenarios live

- Paciente paga depósito 30% via MercadoPago → webhook HMAC verified → booking activa
- Paciente cross-border paga via Stripe Connect → moneda destino MX clinic en MXN
- Paquete de 10 sesiones → tokenized recurring auto-debita mensual
- Chargeback recibido → ComplianceEvent registrado + admin notificado
- Webhook duplicado → idempotency key descarta segunda invocación
- Cancel booking → refund automático via gateway correspondiente

