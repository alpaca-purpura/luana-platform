# vitalia-payment-gateways-latam-recurring

3 adapters de pago: MercadoPago (LATAM primary), Stripe Connect (cross-border + fallback US/EU), tokenized recurring (paquetes + treatment installments). 5 webhook receivers con HMAC verification + idempotency keys. NO usa `stripe_healthcare` per ratificación D7 (hipaa_lite, NO hipaa_full).

## Surface

### Adapters (`vitalia/backend/src/modules/vitalia/payment/`)

- **`mercadopago_adapter.py`** — extiende `MercadoPagoAdapter` base de `core/luana-core-channels` (LIFT shared post Story 11). Metadata medical-specific: `treatment_id`, `doctor_id`, `consent_required`
- **`stripe_connect_adapter.py`** — Stripe Connect para pagos cross-border + fallback
- **`tokenized_recurring_adapter.py`** — auto-debit para paquetes + treatment installments via Stripe SetupIntent + off_session

### Webhook receivers (`vitalia/backend/src/modules/vitalia/api/webhook_routes.py`)

Prefix `/api/v1/vitalia/webhooks/`:
- `POST /stripe` — confirmaciones Stripe + refunds + chargebacks
- `POST /mercadopago` — confirmaciones MP + reembolsos
- `POST /clerk` — signup → trigger onboarding service
- `POST /whatsapp/inbound` — WhatsApp Business inbound (Twilio adapter)
- `POST /manychat/inbound` — ManyChat Instagram inbound

Todos los webhooks: HMAC signature verification + idempotency key dedup vía `core/luana-core-idempotency`.

### Adapters infrastructure

- `infrastructure/adapters/clerk_webhook_adapter.py`
- `infrastructure/adapters/manychat_webhook_adapter.py`

### Config

```yaml
payment_gateways: [mercadopago, stripe_connect, tokenized_recurring]
# stripe_healthcare NOT enabled per Q6=B (D7: hipaa_lite not hipaa_full)
```

