summary: |
  Vitalia adopta engine `luana-core-iam` para entidades IAM compartidas (users,
  tenants, user_tenants). Migration 022 crea las 3 tablas matching engine ORM
  models. Admin code consume engine repositories (UserRepository, TenantRepository,
  UserTenantRepository) — cero SQL crudo, cero tablas brand-prefixed para
  entidades engine.

surfaces:
  config:
    - vitalia/config/brand.yaml (engine consumer)
  backend:
    - vitalia/backend/alembic/versions/022_vitalia_add_engine_iam_tables.py (NEW)
    - vitalia/backend/src/modules/vitalia/admin/modules/tenants.py (REWRITE consuming TenantRepository)
    - vitalia/backend/src/modules/vitalia/admin/modules/users.py (REWRITE consuming UserRepository + UserTenantRepository)
  tests:
    - vitalia/backend/tests/modules/vitalia/admin/test_tenants_crud.py
    - vitalia/backend/tests/modules/vitalia/admin/test_users_crud.py
    - vitalia/backend/tests/architecture/test_admin_consumes_engine_repos.py (arch fitness)

dependencies:
  - engine_package: core/luana-core-iam (consumed via Python imports, NEVER edited)
  - engine_package: core/luana-core-platform (Settings + get_db)

verification:
  commands:
    - "cd vitalia/backend && ${WS}/.venv/bin/pytest tests/modules/vitalia/admin/ -v"
    - "cd vitalia/backend && ${WS}/.venv/bin/pytest tests/architecture/test_admin_consumes_engine_repos.py -v"
    - "docker exec luana-dev-vitalia_backend_dev-1 alembic current"  # expected: 023_vitalia (head)
  gherkin_evidence:
