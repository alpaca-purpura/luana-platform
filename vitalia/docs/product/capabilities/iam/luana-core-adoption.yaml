business_rules:
  - id: engine-repos-no-direct-sql
    rule: "El código admin consume TenantRepository, UserRepository y UserTenantRepository del engine · cero SQL crudo directo · cero tablas brand-prefixed para entidades engine"
    enforcement:
      - ".claude/rules/anti-duplication.md"
      - "vitalia/backend/tests/architecture/test_admin_consumes_engine_repos.py"
    code_ref: "vitalia/backend/src/modules/vitalia/admin/modules/"
    severity: high
    audit_trail: false
  - id: migration-022-idempotent
    rule: "Migration 022 crea las 3 tablas IAM del engine (users, tenants, user_tenants) de forma idempotente con IF NOT EXISTS · nunca op.create_table() directo"
    enforcement:
      - ".claude/rules/backend-migrations.md"
    code_ref: "vitalia/backend/alembic/versions/022_vitalia_add_engine_iam_tables.py"
    severity: high
    audit_trail: false

