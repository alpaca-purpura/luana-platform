user_facing_name: "Adopción de luana-core IAM"
user_facing_description: >
  Capa de adopción que conecta el módulo IAM de Vitalia con el engine compartido
  luana-core-iam. La migración 022 crea las tablas de users, tenants y user_tenants
  que coinciden con los modelos ORM del engine. El código admin consume los
  repositorios del engine directamente, eliminando SQL crudo y tablas con
  prefijo brand para entidades que son responsabilidad del engine.

