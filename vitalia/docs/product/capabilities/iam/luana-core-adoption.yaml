    name: "Admin crea un nuevo tenant usando el repositorio del engine luana-core-iam"
    actor: admin_clinic
    status: live
    given: "Admin autenticado accede al panel de administración de tenants"
    when: "Invoca TenantRepository.create() con los datos del nuevo tenant"
    then: "Tenant persiste en tabla 'tenants' (creada por migration 022) · cero SQL crudo en admin code · cero tablas brand-prefixed"
