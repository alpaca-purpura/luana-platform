# vitalia-inbox-handler-mode-occ

Handler mode (3-state) + OCC 409 concurrency control + ActionReceipt 5min undo lifecycle. SSoT del control "quién contesta la conversación" entre Adrián (agente IA) y operador humano, con concurrencia segura cuando 2+ tabs/operadores tocan la misma conversación.

## Surface

### Domain — handler_mode 3-state machine (`vitalia/backend/src/modules/vitalia/crm/domain/conversation.py`)

`Conversation.handler_mode`:
- `agent` — Adrián responde automáticamente. UI muestra sugerencias antes de send (con receipt undo).
- `human` — Operador responde sin sugerencias. Adrián observa pero no actúa.
- `paused` — Conversation suspendida. Ni Adrián ni operador envían (modo escucha + read tools state).

Transitions allowed (state machine validated):
- `agent ↔ human`, `agent → paused`, `human → paused`, `paused → agent`, `paused → human`.
- Invalid transitions → 422 Unprocessable Entity.

### Optimistic Concurrency Control (OCC)

`Conversation.version` integer monotónico bumped on every UPDATE handler_mode. Endpoint payload incluye `If-Match: <version>` o `expected_version: int` en body. Race conditions cross-tab:
- Versión match → UPDATE (`SET version = version + 1`) + 200 OK con nueva version.
- Mismatch → 409 Conflict + body `{"current_version": N, "expected_version": M}` para que el cliente refresque.

### ActionReceipt 5-min undo lifecycle (`vitalia/backend/src/modules/vitalia/crm/domain/action_receipt.py`)

Cada tool action Adrián produce un `ActionReceipt` con:
- `status: active` post-create
- `expires_at: NOW + 5min` (TTL business rule)
- Frontend renderiza countdown chip inline en MessageBubble.

Operator click "undo" antes de `expires_at`:
- Recibo → status: undone
- Message → retracted_at = NOW
- Domain event `MessageRetracted` emitted

Pasado `expires_at`:
- Endpoint `POST /messages/{id}/retract` retorna 410 Gone (TTL expirado, no se puede revertir).

Cron sweep (futuro Slice 2): marca receipts active → expired post 5min.

### Application services

- **`set_mode_service.py`** — transition handler_mode con OCC version check + atomic UPDATE + ActivityEvent emit.
- **`retract_message_service.py`** — verifica ActionReceipt.expires_at > NOW + atomic UPDATE (message.retracted_at + receipt.status).
- **`pause_adrian_service.py`** — shortcut `set_mode(paused)`.

### API routes

- `PATCH /api/v1/inbox/conversations/{id}/mode` — body `{mode, expected_version}` → 200 con `{version: M+1}` o 409.
- `POST /api/v1/inbox/conversations/{id}/pause` — shortcut, OCC inside.
- `POST /api/v1/inbox/messages/{id}/retract` — body vacío. 200 OK o 410 Gone si expirado.

