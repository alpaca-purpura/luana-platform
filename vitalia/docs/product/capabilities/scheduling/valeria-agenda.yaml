## KPIs targets (post-launch)

- Click-to-cobro success rate ≥ 95% (charge + fiscal emit happy path)
- Drawer open latency p95 < 200ms
- Subform submit latency p95 < 2s (charge + fiscal saga inline)
- PHI mask coverage 100% (no raw PHI en API responses)
- Audit log coverage 100% en PHI endpoints
- Mobile drawer UX usable ≥ 4/5 staff satisfaction

## Promotion candidate notes

ADR-vitalia-004 shell-feature-architecture es source pattern de esta story. Brands futuras con sub-tabs en shell-organism agéntico pueden adoptar el patrón si construyen shell agéntico similar. `/pm-luana` evalúa lift candidate.
