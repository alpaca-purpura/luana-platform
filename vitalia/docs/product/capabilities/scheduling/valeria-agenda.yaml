## Dependencies cross-package

- Consume `core/luana-core-scheduling` (Appointment + AppointmentRepository — read-only via dual-filter wrapper)
- Consume `core/luana-core-compliance` (ComplianceService.validate_outbound_message)
- Consume `core/luana-core-observability` (sanitize_payload hipaa_lite + base classes)
- Consume `core/luana-core-platform` (BasePhiRepository pattern reuse)
- Consume `vitalia.crm.patient` (Patient model + PHI masking server-side)
- Consume `vitalia.audit.audit_writer` (AsyncAuditWriter transactional sync)
- Plus service-blockers (stubs Option A pending real adapters):
  - `vitalia-payment-adapter-mvp` (state: refined, pending developed)
  - `vitalia-fiscal-emission-pe` (state: refining, pending developed)

## HIPAA-lite compliance (overlay)

- ✅ Dual filter `tenant_id + clinic_id` en TODA query PHI (PhiRepositoryBase pattern)
- ✅ Audit log row sync write antes response en TODOS PHI endpoints (8 endpoints)
- ✅ PHI masking server-side: name → "P. Hernández", DNI → "12.***.***"
- ✅ sanitize_payload(compliance_level='hipaa_lite') en logs + traces + telemetry
- ✅ RBAC @require_phi_access roles=["valeria_assistant","doctor","nurse","admin_clinic"]
- ✅ NO PHI en URL params (whitelist ALLOWED_GRID_PARAMS: view, date, filters, page, page_size, status)
- ✅ NO PHI en localStorage (zustand persist solo drawerWidth numérico)
- ✅ NO PHI en telemetría (PHI_BLOCKED_KEYS enforces sanitize, 24 keys cubiertos)
- ✅ ComplianceService channel guard en notify_router (WhatsApp template-only)
- ✅ PatientAutocomplete returns ONLY patient_id (no PHI form state)
- ✅ Cross-clinic 404 substrate (no 403, no leak)

