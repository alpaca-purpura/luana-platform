# Capability — Valeria Agenda (scheduling)

> Brand: vitalia
> Vertical: Salud + Bienestar (clínicas con reservas prepagadas + cobro inline)
> Owner agente: Valeria (asistente operativa scheduling)
> Status: live (post F2-S1 merge 2026-05-27)
> Pattern: ADR-vitalia-004 shell-feature-architecture (source story)

## Goal

Sub-tab Agenda de Valeria operativa. Calendario día/semana/mes con celdas-slot por estado de pago (pagado · depósito · sin-pago · no-show) y por origen (walk-in · teléfono · proactivo Adrián · existing patient). Click slot → Drawer derecho inline con datos paciente PHI-masked + turno + subform "Cobrar saldo" que emite comprobante fiscal sin salir del flujo.

