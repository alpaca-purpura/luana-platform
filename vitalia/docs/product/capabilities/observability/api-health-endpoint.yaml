# API health endpoint — /api/health

Endpoint mínimo de healthcheck para K8s livenessProbe + post_deploy_smoke.sh.

## Surfaces

- **Backend:** `vitalia/backend/src/main.py` route `GET /api/health`
- **Ops:** K8s deployments `livenessProbe.httpGet.path: /api/health`
- **Smoke:** `vitalia/deploy/scripts/post_deploy_smoke.sh` check 2 (`curl -fsS /api/health`)

## Comportamiento

- `GET /api/health` → 200 JSON `{"status":"ok"}`
- Sin auth, sin tenant filter (es público per middleware matcher)
- Idempotente, sin DB queries

## Verification

```yaml
commands:
  - "WS=$(git rev-parse --show-toplevel) && cd $WS/vitalia/backend && $WS/.venv/bin/ruff check src/main.py"
