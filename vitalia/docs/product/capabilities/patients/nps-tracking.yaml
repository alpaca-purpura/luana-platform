## Scenarios live

- Submit con score=9 + comment="excelente atención" → NPSResponse row con `band=promoter` + `comment` BYTEA encrypted + audit log row sync.
- Summary endpoint con `admin_clinic` role → aggregate stats sin per-patient PHI (avg score, distribution promoter/passive/detractor, total N).
- Read NPSResponse con `marketing` role → 403 (cannot read `comment` decrypted).
- Cross-tenant: tenant_A solicita summary clinic_B (de tenant_B) → 404 (dual filter enforced).
- Lucas consumer ([[lucas-recommendation-tool]]) lee summary aggregate-only → produce recomendaciones (pattern `nps`) sin tocar per-patient PHI.

## KPIs

- Submit rate: 100% sync write (no fire-forget audit)
- pgcrypto trigger encryption: 100% en inserts (verified `test_pgcrypto_encrypt_trigger_active`)
- Summary endpoint response time p95: < 200ms (agregados indexados por tenant_id+clinic_id+submitted_at)
- Retention: 10 años (regulación LatAm health per `vitalia/.claude/rules/hipaa-lite.md` § retention policy PHI)

