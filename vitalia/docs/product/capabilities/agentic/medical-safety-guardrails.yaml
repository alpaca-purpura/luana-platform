# vitalia-medical-safety-guardrails

4 guardrails input+output que enforzan boundaries médicos críticos: no diagnosis, no prescription, disclaimer required, prompt_injection_block reuse. Registrados vía Extension SDK EP-13. Slot 4 `MEDICAL_SAFETY_RAILS` reservado en cache prefix.

## Surface (`vitalia/backend/src/modules/vitalia/agentic/guardrails/`)

- **`medical_safety_no_diagnosis.py`** — input+output guardrail; bloquea LLM de ofrecer diagnósticos médicos
- **`medical_safety_no_prescription.py`** — bloquea LLM de prescribir medicamentos/dosis
- **`medical_disclaimer_required.py`** — enforza presencia de disclaimer cuando se discuten tratamientos
- **`prompt_injection_block_reuse.py`** — registra `prompt_injection_block` de Story E sales-agent (EXTEND, no mirror por R10 anti-duplication)

### Config (`vitalia/config/brand.yaml`)

```yaml
guardrails:
  - medical_safety_no_diagnosis
  - medical_safety_no_prescription
  - medical_disclaimer_required
  - prompt_injection_block
```

### Slot 4 MEDICAL_SAFETY_RAILS

Reservado en prompt cache architecture (D5 ratificado). Prompt MD se compone vía `agentic/prompts/compose.py`.

