[project]
name = "luana-vitalia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-x -q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".git", "__pycache__", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
