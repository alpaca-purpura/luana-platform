infra:
  dev:
    backend_port: 8004
    frontend_port: 3004
    database_name: lupulo_dev
    redis_db: 3
    qdrant_collection_prefix: lupulo_
    domain: lupulo-dev.nicolify.com
    cloudflared_tunnel: lupulo-dev
  staging:
    domain: lupulo-test.nicolify.com
    server: tbd-staging-cluster
  prod:
    domain: app.lupulo.com
    server: tbd
    cloudflared_tunnel: lupulo-prod
