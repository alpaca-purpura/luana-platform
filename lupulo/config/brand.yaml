# NOTA: lupulo es placeholder (Story 13 pendiente). Esta config es minima.
#
# S-DOCKER-DEV-MULTIBRAND T-3 — 2026-05-15
# SSoT infra metadata por entorno. Auto-indexado en docs/portfolio/INFRA-MATRIX.md via make infra-matrix.

brand_slug: lupulo
brand_name: "Lupulo Labs"
brand_description: "Vertical gastronomia brand app — reservas de mesa, pedidos digitales, integracion KDS"
brand_segment: gastronomia
compliance_level: standard
voice_cloning_enabled: false
multi_language_ui: false

features:
  brand_studio_basic: true
  table_reservations: false    # Story 13 pendiente
  digital_orders: false        # Story 13 pendiente
  kds_integration: false       # Story 13 pendiente

# SSoT infra metadata por entorno.
