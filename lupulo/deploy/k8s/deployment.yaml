---
# lupulo/deploy/k8s/deployment.yaml
# PLACEHOLDER — Lupulo Labs no tiene backend operativo aún.
# replicas: 0 — no arranca pods reales hasta Story 13 (lupulo backend).
#
# Este manifest existe para que _deploy-brand.yml no falle con
# "no manifests found" si se dispara un release/lupulo-vX.Y.Z prematuro.
#
# Cuando Story 13 (reservas de mesa, pedidos digitales, integración KDS) se implemente:
#   1. Actualizar replicas a 2
#   2. Agregar configmap.yaml, service.yaml e ingress.yaml definitivos
#   3. Crear namespace y imagePullSecrets: kubectl create namespace lupulo
#   4. Crear secret docker-registry ghcr-creds en namespace lupulo
#
# Arch ref: S-CICD-DEPLOY 03-arch.md § lupulo/deploy/k8s/deployment.yaml placeholder
# T-6 scope: placeholder mínimo viable
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lupulo-app
  namespace: lupulo
  labels:
    app.kubernetes.io/name: lupulo
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: luana-platform
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 0
  selector:
    matchLabels:
      app: lupulo-app
  template:
    metadata:
      labels:
        app: lupulo-app
        app.kubernetes.io/name: lupulo
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: "0.0.1"
    spec:
      containers:
        - name: lupulo-backend
          image: ghcr.io/alpacapurpura/lupulo-backend:0.0.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-creds
