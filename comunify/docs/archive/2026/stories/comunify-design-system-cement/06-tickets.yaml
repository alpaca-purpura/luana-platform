# ═══════════════════════════════════════════════════════════════
# Cross-ticket notes for /dev-team orchestrator
# ═══════════════════════════════════════════════════════════════

cross_ticket_notes:
  parallel_safe_within_session: |
    T-3a / T-3b / T-3c / T-3d touch DISJOINT file sets — same builder session can
    process them in series quickly. They are split as separate tickets for
    traceability + chunked review only.

  required_decision_sources: |
    Decisions D1-D8 are documented in 03-arch.md § 18 "Decisiones registradas".
    Each ticket's `decisions_applicable` field cites which decisions apply.
    Builder commit body MUST include "Decisions honored: <D1, D2, ...>" section
    citing how each was respected (R6 enforcement).

  hot_fix_repro: |
    repro_verified: n/a for all tickets — this is NOT a hot-fix story.
    Origin: capability cement (proactive), not incident response.

  dev_stack_requirement: |
    T-4 (Playwright smoke) requires `make dev-comunify` running.
    Other tickets (T-1, T-2, T-3a/b/c/d, T-5 non-visual portions) run WITHOUT dev stack.
    T-5 visual portions require dev stack same as T-4.

  no_secrets_no_pii: |
    Zero handling of secrets, credentials, or PII. Pure FE design/typography.
    No .env changes needed. No new env vars introduced.

  forbidden_operations: |
    - git add . / -A / -u   (stage by exact filename only)
    - git commit --no-verify (pre-commit hooks mandatory)
    - git pull / fetch+merge / push --force / revert
    - make e2e* (Docker, OOM crash)
    - docker exec ... npx (Native-First mandatory)
    - Editing files outside § Files in scope of 05-guidelines.md
