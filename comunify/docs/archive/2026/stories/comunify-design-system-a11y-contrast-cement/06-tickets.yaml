        --color-comunify-warning-text:  hsl(45 100% 28%)    /* #8E6B00 */
        --color-comunify-stable-text:   hsl(152 80% 28%)    /* #0E804B */
        --color-comunify-accent-text:   hsl(355 100% 45%)   /* #E50013 */
        --color-comunify-critical-text: hsl(0 84% 49%)      /* #E51313 */
        --color-comunify-blue-text:     hsl(217 95% 52%)    /* #1069F8 */

      Mirror in :root with H S% L% channel-only format.
      Mirror in tailwind.config.ts colors with hsl(var(--comunify-X-text)).

      HSL principales (warning/stable/accent/critical/blue) MUST NOT change.

      design-system.md § 1.5 NEW table format:
        | Slot | Uso | HEX | HSL channels | Ratio sobre bg |
        | --comunify-warning-text | Foreground sobre light bg | #8E6B00 | 45 100% 28% | 4.72:1 ✅ AA |
        | ...

      design-system.md § 6 NEW recipes:
        - Camino B button: bg-X/10 border border-X text-X-text hover:bg-X/20
        - Badge tint: bg-X/10 text-X-text
        - Alert banner sólido (alternative): bg-X text-comunify-text
        - Inline error label: text-critical-text

