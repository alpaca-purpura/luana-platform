  # ──────────────────────────────────────────────────────────────
  - id: T-4
    title: "Playwright SC-01 + SC-03 + SC-04 specs + axe wcag2aa on /dashboard/{community,membership}"
    state: ready
    surface: frontend
    owner_eligibility: [qwen-opencode, claude-sonnet]
    production_code: false
    estimated_loc: 200   # 3 specs (~50-70 LOC each) + helpers ~30 LOC
