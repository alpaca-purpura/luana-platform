    depends_on: [T-1, T-2, T-3]
    files_in_scope:
      create:
        - comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/_helpers.ts
        - comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/design-system-pairs.spec.ts
        - comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/moderation-card.spec.ts
        - comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/badges-tints.spec.ts
      maybe_modify:
        - comunify/frontend/package.json   # if @axe-core/playwright not yet installed
    description: |
      Author 3 Playwright regression specs scoped to this story + helper module.

      Pre-flight: confirm @axe-core/playwright is in devDependencies of comunify/frontend/package.json.
      If absent: cd comunify/frontend && npm install --save-dev @axe-core/playwright.

      ── _helpers.ts ──
      Export:
        - getContrastRatio(page, selector): number  — computed style probe + WCAG L formula
        - parseRGB(rgbString): {r, g, b}
        - wcagLuminance(rgb): number
        - wcagRatio(fg, bg): number
        - extractCssBundleClass(page, className): Promise<boolean>  — grep .className in linked stylesheets

      ── design-system-pairs.spec.ts (SC-01) ──
      Test names:
        - sc-01-camino-b-buttons-pass-aa:
            Goto /dashboard/community. Locate buttons[data-action=approve|reject|ban].
            For each: computed contrast ≥ 4.5:1.
        - sc-01-utility-classes-exist-in-bundle:
            Goto /. Assert .text-comunify-warning-text + 4 siblings are present in CSS bundle.
        - sc-01-axe-wcag2aa-membership:
            Goto /dashboard/membership. Run axe wcag2aa filter scoped to dunning banner. results.violations = [].

      ── moderation-card.spec.ts (SC-03) ──
      Test names:
        - sc-03-camino-b-semantic-preserved:
            Goto /dashboard/community. For each moderation card:
              approve button: border color hue ≈ stable (152±10°), bg lightness < 50%
              reject  button: border color hue ≈ warning (45±10°), bg lightness < 50%
              ban     button: border color hue ≈ critical (0±10°), bg lightness < 50%
            Each button has visible border + bg tint + dark text.
            Tab through buttons: focus ring visible (2px).
            Hover transition: bg-/20 applied without layout shift.
        - sc-03-axe-wcag2aa-zero-violations:
            Goto /dashboard/community. AxeBuilder withTags(["wcag2aa","wcag21aa"]) include('[data-testid="moderation-card"]'). violations = [].

      ── badges-tints.spec.ts (SC-04) ──
      Test names:
        - sc-04-tints-contrast-sample:
            Goto various pages where migrated badges render (voice-samples, authority-vault, etc).
            Each badge with bg-X/10 text-X-text computed contrast ≥ 4.5:1.
        - sc-04-no-legacy-patterns-in-source:
            Run grep -rnE "text-comunify-(warning|stable|accent)(?!-text)([^-]|$)" comunify/frontend/src/.
            Expected: zero matches (confirmed by arch test but cross-verify here at E2E layer).

      Authentication: reuse comunify/frontend/e2e/auth.fixture.ts (Clerk testing token).

      Verify against running stack: make dev-comunify (postgres + backend 8003 + frontend 3003).
      Pre-flight: bash scripts/e2e-preflight.sh.

    acceptance:
      validator_ids: [val-fn-2, val-fn-3, val-fn-4, val-vis-1, val-vis-2]
    gherkin_coverage:
      - scenario: "SC-01 — Happy: pares canónicos del recipe aplican"
        tests:
          - "comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/design-system-pairs.spec.ts::sc-01-camino-b-buttons-pass-aa"
          - "comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/design-system-pairs.spec.ts::sc-01-utility-classes-exist-in-bundle"
      - scenario: "SC-03 — Edge: Camino B en moderation card preserva semántica color"
        tests:
          - "comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/moderation-card.spec.ts::sc-03-camino-b-semantic-preserved"
          - "comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/moderation-card.spec.ts::sc-03-axe-wcag2aa-zero-violations"
      - scenario: "SC-04 — Adversarial: tints sobre light bg verificados"
        tests:
          - "comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/badges-tints.spec.ts::sc-04-tints-contrast-sample"
          - "comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/badges-tints.spec.ts::sc-04-no-legacy-patterns-in-source"
      - scenario: "SC-a11y — Sub-categoría mandatory accessibility"
        tests:
          - "comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/moderation-card.spec.ts::sc-03-axe-wcag2aa-zero-violations"
          - "comunify/frontend/e2e/regression/comunify-design-system-a11y-contrast-cement/design-system-pairs.spec.ts::sc-01-axe-wcag2aa-membership"

