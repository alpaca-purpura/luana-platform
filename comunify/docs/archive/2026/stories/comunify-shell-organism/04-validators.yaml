story_id: comunify-shell-organism
brand: comunify
generated_by: /architect
generated_on: 2026-06-16

# ── Naturaleza de la verificación (top-level · D-X4) ──────────────────────────
verification_nature: funcional        # → DoD #37 mandatory + gate anti-burbuja + demo Chris (G)
demo_required: true
regression_guard: true

# concurrent_users / large_dataset declarados N/A en 01-spec (ratificado en handoff) — NO inventar.
not_applicable_subcategories:
  - subcategory: concurrent_users
    reason: "comunify = single-user brand (RN-1) + MVP sin list/detail filtrable. Multi-tenant lo cubre SC-adversarial-tenant."
  - subcategory: large_dataset
    reason: "MVP sin list paginada. Único stream = historial de chat (scroll simple). Aplica en R-shell+1..N."

# ═══════════════════════════════════════════════════════════════════════════════
# CATEGORÍA 1 — NON-FUNCTIONAL (técnica · gates automáticos)
# ═══════════════════════════════════════════════════════════════════════════════
non_functional:
  - id: nf-be-arch
    surface: backend
    gate: "cd comunify/backend && ${WS}/.venv/bin/pytest tests/architecture/ -x -q"
    asserts:
      - "redirect_slashes=False presente en main.py"
      - "no cross-module imports prohibidos (mount thin solo importa engine + main)"
      - "tenant-isolation enforce (delegado al engine)"
  - id: nf-be-lint
    surface: backend
    gate: "cd comunify/backend && ${WS}/.venv/bin/ruff check src/ && ${WS}/.venv/bin/ruff format --check src/"
  - id: nf-fe-tsc
    surface: frontend
    gate: "cd comunify/frontend && npx tsc --noEmit"
  - id: nf-fe-eslint
    surface: frontend
    gate: "cd comunify/frontend && npx eslint src/ --cache"
  - id: nf-fe-arch
    surface: frontend
    gate: "cd comunify/frontend && npx vitest run src/__tests__/architecture/"
    asserts:
      - "FSD boundaries (boundaries/dependencies: error)"
      - "test-no-clerk-organizations (useTenantId, NUNCA useAuth().orgId) — RN-2"
      - "no-hardcoded-hex (tokens, no #RRGGBB en componentes)"
      - "no-low-contrast-pairs (WCAG AA dark/light)"
  - id: nf-pnpm-install
    surface: hygiene
    gate: "cd ${WS} && pnpm install"
    asserts:
      - "resuelve con @luana/* declaradas (workspace:*) — verde, NO blind-delete"
      - "sin lockfile redundante en comunify/frontend (root pnpm-lock SSoT)"

# ═══════════════════════════════════════════════════════════════════════════════
# CATEGORÍA 2 — FUNCTIONAL (DoD #37 · cada SC funcional FE con verificación REAL)
# ═══════════════════════════════════════════════════════════════════════════════
functional:
  business_rules:
    - id: RN-1
      rule: "single-user — Ribbon completo sin role-gating"
      covered_by: [SC-happy]
    - id: RN-2
      rule: "tenant_id vía useTenantId (iam), NUNCA Clerk org; X-Tenant-ID en cada llamada"
      covered_by: [SC-adversarial-tenant]
    - id: RN-3
      rule: "Luana no ejecuta — conversa + anuncia; sin tools de dominio"
      covered_by: [SC-chat-delegate, SC-chat-double-send]
    - id: RN-4
      rule: "consume @luana/ui-kit, cero mirror (kit + nicolify locals)"
      covered_by: [arch-anti-dup]      # gate de build/auditor, no Playwright
    - id: RN-5
      rule: "(dashboard) no reachable post-merge; post-login → shell"
      covered_by: [SC-dashboard-unreachable]
    - id: RN-6
      rule: "spanish neutro LatAm, sin voseo"
      covered_by: [SC-i18n]
    - id: RN-7
      rule: "engine único — Luana consume core/luana-core-copilot /chat"
      covered_by: [SC-chat-ok]

# ═══════════════════════════════════════════════════════════════════════════════
# CATEGORÍA 3 — VISUAL (mockup adherence · playwright_visual_scope)
# ═══════════════════════════════════════════════════════════════════════════════
visual:
  golden: "mockups/shell.html"
  design_system: "comunify/docs/architecture/design-system.md"
  checks:
    - { screen: shell-landing, assert: "Luana sidebar full (avatar + 'Orquestadora · en línea' + StatusDot) + Ribbon (nina activa, ring agent-nina) + panel 'Próximamente'" }
    - { screen: shell-landing, assert: "TopBar wordmark 'Comunify' (grad-text) + LogoMark isotipo + theme toggle" }
    - { screen: chat-delegate, assert: "DelegateMarker chip 'delega en Nina · Mi Marca' color agent-nina" }
    - { screen: tab-placeholder, assert: "EmptyState '{Sub-tab} · Próximamente' + CTA 'Hablar con Luana' + nota 'Se portará en una próxima entrega'" }
    - { screen: ribbon, assert: "5 RibbonTab (Mi Marca/Atraer/Vender/Operar/Retener) + Plataforma; controles pill (rounded-full)" }
    - { theme: dark, assert: "bordes vía --line adaptan (no blancos hardcodeados); contraste AA" }

playwright_visual_scope:
  story_scope_routes:
    - "/[tenantId]/(shell-organism)"
    - "/[tenantId]/nina/marca"
    - "/[tenantId]/[agent]/[subtab]"   # placeholders
    - "/[tenantId]/plataforma"
  story_scope_components:
    - "app/[tenantId]/(shell-organism)/**"
    - "components/shared/shell-organism/**"
    - "stores/{chat-store,shell-store}.ts"
    - "lib/routing/shell-routes.ts"
  forbidden_visual_changes:
    - "core/@luana/ui-kit/src/**"       # engine kit — lift only, NUNCA editar
    - "comunify/frontend/src/app/(dashboard)/**"   # retirar del routing, NO refactorizar visual
    - "comunify/frontend/src/app/onboarding/**"    # wizard intacto
  out_of_mockup_scope:
    - "contenido real de las tabs de agente (placeholder only en MVP)"
    - "N3 sub-sub-tabs salvo nina.marca / nina.ofertas (combos poblados)"
  notes: "Avatares = placeholders SVG en public/agents/{slug}/avatar.svg (Chris da finales). NO screenshot full-page; scoped al shell."

# ═══════════════════════════════════════════════════════════════════════════════
# CATEGORÍA 4 — AGENTIC EVAL (THIN — trace + cost; sin goldens de comportamiento)
# ═══════════════════════════════════════════════════════════════════════════════
agentic_eval:
  rationale: "Sin specialist nuevo ni prompt modificado — se CONSUME el engine /chat tal cual. NO se piden ≥3 goldens de voz/comportamiento."
  checks:
    - id: agentic-trace-scoped
      assert: "tras un turno de chat → ≥1 fila copilot_trace_event WHERE tenant_id=:tid"
      query: "SELECT count(*) FROM copilot_trace_event WHERE tenant_id = :tid AND created_at > :t0"
      expect: ">= 1"
      maps_sc: SC-chat-ok
    - id: agentic-no-domain-write
      assert: "tras turno de delegación → cero filas nuevas en tablas de dominio (offer/cohort/community) — prueba RN-3"
      expect: "0 filas nuevas"
      maps_sc: SC-chat-delegate
    - id: agentic-no-tools-registered
      assert: "comunify/.../copilot/ NO tiene tools/ de dominio (grep) — Luana no puede ejecutar"
      grep: "test -d comunify/backend/src/modules/comunify/copilot/tools && echo FAIL || echo OK"
      expect: "OK"

# ═══════════════════════════════════════════════════════════════════════════════
# CATEGORÍA 5 — ARCHITECTURAL VALIDATION (anti-dup + tenant + FSD + no-clerk-org)
# ═══════════════════════════════════════════════════════════════════════════════
architectural_validation:
  - id: arch-anti-dup
    name: "anti-duplication Cat 12 — cero mirror del kit + cross-brand"
    checks:
      - grep: "find comunify/frontend/src -name 'Ribbon.tsx' -o -name 'ChatPanel.tsx' -o -name 'ConfigTab.tsx' -o -name 'SubSubTabsBar.tsx' -o -name 'EmptyState.tsx' -o -name 'ShellLayout.tsx'"
        expect: "0 matches (esos organismos se importan de @luana/ui-kit)"
      - grep: "grep -rn 'from \"@luana/ui-kit\"' comunify/frontend/src/app/'[tenantId]'/'(shell-organism)'/"
        expect: ">= 1 (el wrapper consume el kit)"
      - grep: "grep -rln 'from .*nicolify/frontend' comunify/frontend/src/"
        expect: "0 (cero import cross-brand)"
  - id: arch-tenant-isolation
    name: "tenant via useTenantId, no Clerk org (RN-2)"
    checks:
      - grep: "grep -rn 'useAuth().orgId\\|useOrganization\\|orgId.*X-Tenant' comunify/frontend/src/app/'[tenantId]'/"
        expect: "0 matches"
      - assert: "arch-test test-no-clerk-organizations.test.ts verde"
  - id: arch-fsd-boundaries
    name: "FSD-Lite boundaries (kit consumido vía @luana, wrappers en components/shared)"
    checks:
      - assert: "boundaries/dependencies: error → 0 violations"
  - id: arch-be-mount-thin
    name: "BE mount thin (engine reexport, cero lógica)"
    checks:
      - grep: "grep -rn 'from luana_core_copilot.api.chat import router' comunify/backend/src/modules/comunify/copilot/api/"
        expect: ">= 1 (reexport thin)"
      - grep: "grep -rn 'include_router(copilot_router, prefix=\"/api/v1/comunify/copilot\"' comunify/backend/src/main.py"
        expect: "1"

