# comunify-shell-organism

Shell-organism agéntico de comunify (zona **Plataforma** del mapa de 3 zonas — el chrome que
hospeda Agentes · Plataforma · Infraestructura). Migró comunify del paradigma dashboard viejo
(`app/(dashboard)/*`) al shell-organism que nicolify/vitalia ya tienen, **consumiendo**
`@luana/ui-kit` (incl. `organism/shell`, lifteado 2026-06-11) — NO mirror cross-brand
(`.claude/rules/anti-duplication.md`).

> `status: live` (merge 2026-06-17). El chat de la sidebar de Luana funciona end-to-end contra el
> engine copilot `/chat` (stream SSE), verificado por e2e autenticado real-backend + DB tenant-scoped.

## Surface

- **Frontend** (`comunify/frontend/src/app/[tenantId]/(shell-organism)/` + `components/shared/shell-organism/`):
  routing tenant-scoped, Ribbon del cast comunify (Nina · Tomás · Sofía · Bruno · Lucía + Plataforma),
  sidebar supervisora (Luana orquestadora con chat live), nav de 3 zonas, Config tab.
  `stores/{chat-store,shell-store}.ts` (chat-store = SSE lifecycle, lift candidate `@luana` post-merge).
  `next.config.ts` rewrite `/api`+`/public` → BE (patrón vitalia/nicolify).
- **Backend** (`comunify/backend/src/modules/comunify/copilot/api` + `main.py`): mount THIN del engine
  `core/luana-core-copilot /chat` en `/api/v1/comunify/copilot` (reexport, cero lógica de dominio).
- **Shared kit consumido:** `@luana/ui-kit` (organism/shell), `@luana/design-tokens`.
- **Reskin:** tokens comunify (`comunify/docs/architecture/design-system.md`).

## Dependencies

- `@luana/ui-kit` (organism/shell — consumido vía import, no recreado)
- `core/luana-core-{copilot,iam,platform}` (engine — consumido; chat-router brand-mountable vía Settings-lazy)
- referencia de port: `nicolify/frontend` shell-organism + skill `nicolify-design-system`

## Scope (MVP R-shell)

Esta cap cubre el **shell levantado** (chrome + routing + Ribbon + nav + Config + chat live de la sidebar).
El porte de las 10 áreas dashboard (authority, cohorts, community, offers, ladder, subscriptions, voice,
brand-studio, community-audit) a sus homes de agente son caps/stories siguientes (R-shell+1..N).

## Deuda diferida (→ /pm-luana · engine)

- Persona del copilot por-marca: `_BASE_IDENTITY` del engine hardcodeado "Nicolify" (cross-brand). La voz
  comunify exige hacerlo brand-aware en el engine. `prompt_versions` NO es la palanca (sólo sales_agent).
  Voz genérica = no-fatal. Detalle: `comunify/docs/learnings/2026-06-17-engine-deuda-surfaced-by-shell-organism.md`.
