# comunify-shell-organism

Shell-organism agéntico de comunify (zona **Plataforma** del mapa de 3 zonas — el chrome que
hospeda Agentes · Plataforma · Infraestructura). Migra comunify del paradigma dashboard viejo
(`app/(dashboard)/*`) al shell-organism que nicolify/vitalia ya tienen, **consumiendo**
`@luana/ui-kit` (incl. `organism/shell`, lifteado 2026-06-11) — NO mirror cross-brand
(`.claude/rules/anti-duplication.md`).

> `status: planned` — esta cap se cementa a `live` al merge de la story `comunify-shell-organism`
> (R-shell MVP). Los scenarios + test_coverage + surface real se llenan en `refined`/`ready`.

## Surface (planeado · /architect refina)

- **Frontend** (`comunify/frontend/src/app/[tenantId]/(shell-organism)/` + `components/shared/shell-organism/`):
  routing tenant-scoped, Ribbon del cast comunify, sidebar supervisora (Luana orquestadora),
  nav de 3 zonas, Config tab.
- **Shared kit consumido:** `@luana/ui-kit` (organism/shell), `@luana/design-tokens`, `@luana/hooks`,
  `@luana/schemas`, `@luana/format`, `@luana/api-client`.
- **Reskin:** tokens comunify (`comunify/docs/architecture/design-system.md`).

## Dependencies

- `@luana/ui-kit` (organism/shell — consumir vía import, no recrear)
- referencia de port: `nicolify/frontend` shell-organism + skill `nicolify-design-system`
- `comunify-frontend-design-system` (tokens visuales)
- ADR-comunify cast de agentes (blocker — define el Ribbon)

## Scope (MVP R-shell)

Esta cap cubre el **shell levantado** (chrome + routing + Ribbon + nav + Config). El porte de las
10 áreas dashboard (authority, cohorts, community, offers, ladder, subscriptions, voice, brand-studio,
community-audit) a sus homes de agente son caps/stories siguientes (R-shell+1..N).
