# comunify-design-system-cement

Cementación de la identidad visual Comunify en el frontend: 15 CSS variables `--comunify-*` (paleta morado/azul/coral/verde + neutros + semánticos), 3 fuentes (Satoshi via Plus Jakarta Sans fallback + Manrope + Inter), 15+1 slots Tailwind extendidos, gradient signature `bg-comunify-gradient`, y arch fitness ratchet anti-stock-palette + anti-HEX-literal (allowlist shrink-only, baseline `[]`). Migración 23 archivos FE: 91 ocurrencias paleta Tailwind stock → 0 (tokens semánticos comunify-*).

## Surface

- **CSS tokens SSoT:** `comunify/frontend/src/app/globals.css` — 15 vars HSL + `--radius`/`--radius-lg` + `--comunify-gradient` literal HEX (allowlisted como SSoT)
- **Font loading:** `comunify/frontend/src/app/layout.tsx` — `next/font/google` Manrope + Inter + Plus_Jakarta_Sans (Path B fallback per D2 hasta que Chris provea `Satoshi-Bold.woff2`), 3 `.variable` aplicados a `<html>`, body className con tokens comunify (`bg-comunify-bg font-inter text-comunify-text`)
- **Tailwind config:** `comunify/frontend/tailwind.config.ts` — `theme.extend.colors` con 16 slots comunify-* + `backgroundImage.comunify-gradient` + `fontFamily.{satoshi,manrope,inter}` + `borderRadius.{DEFAULT,lg}`
- **Arch fitness ratchet:** `comunify/frontend/src/__tests__/architecture/test-no-stock-palette.test.ts` — 3 tests (stock palette regex + HEX literal regex + allowlist shrink-only invariant)
- **Allowlist:** `comunify/frontend/src/__tests__/architecture/_stock-palette-allowlist.json` — `[]` (clean slate baseline 2026-05-18)
- **Vitest unit:** `comunify/frontend/src/app/__tests__/layout.test.tsx` — 9 tests assertando font vars + body className
- **Playwright smoke spec:** `comunify/frontend/e2e/specs/smoke/design-system.smoke.spec.ts` — 3 tests (font CSS vars on `<html>` + body comunify tokens + sign-in inherits comunify classes). Verificación visual deferida a post-merge dev stack restart.
- **23 archivos migrados:** `src/app/(dashboard)/**` (9) + `src/features/comunify/components/**` (7) + `src/app/(auth)/** + onboarding/** + page.tsx + public/**` (6) + `src/features/comunify/utils/format-engagement-bucket.ts` (1)
- **Design system SSoT doc:** `comunify/docs/architecture/design-system.md` (consumido verbatim para tokens)

## Test coverage

- T-1 result: foundation (globals.css + layout fonts + tailwind config + layout.test.tsx) — `fe_typecheck + fe_lint + scenario_happy_tokens_loaded + scenario_edge_satoshi_fallback` GREEN
- T-2 result: arch fitness RED baseline — 91 violations capturadas (deliberate TDD baseline)
- T-3a/b/c/d result: migración incremental 91→0 violations, allowlist stays `[]`
- T-4 result: Playwright smoke spec creado verbatim per arch §8 — visual execution deferida (worktree mount mismatch, post-merge)
