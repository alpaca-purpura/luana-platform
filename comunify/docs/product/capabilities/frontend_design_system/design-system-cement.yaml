## Dependencies

- `@luana/comunify-web` package (Next 16 + React 19)
- `tailwindcss ^4.1.0` (theme.extend pattern preservado)
- `next/font/google` (Manrope + Inter + Plus_Jakarta_Sans built-in, sin npm install)

## Scenarios live

- Creator visita `/sign-in` → body usa `bg-comunify-bg` + `text-comunify-text` + `font-inter` computed (rgb 248,250,252 / rgb 11,16,32)
- Developer agrega `bg-gray-500` en componente nuevo → arch fitness FAILS con cite `file:line — class (use bg-comunify-surface or bg-comunify-bg)` (verificable agregando + corriendo test)
- Developer intenta HEX literal `#7B2FF7` o `bg-[#7B2FF7]` en componente → arch fitness FAILS (regex catch ambas formas, allowlist solo globals.css)
- Falta `Satoshi-Bold.woff2` binary → `--font-satoshi` mapeado a Plus Jakarta Sans Bold como fallback, build no rompe

