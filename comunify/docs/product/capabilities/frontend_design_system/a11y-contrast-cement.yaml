## Pares canónicos (cementados en design-system.md § 6)

| Use case | Background | Foreground | Ratio |
|---|---|---|---|
| Botón primary CTA | `bg-comunify-primary` o `bg-comunify-gradient` | `text-comunify-primary-foreground` (white) | 5.85:1 ✅ |
| Botón outline semantic (Camino B) | `bg-comunify-{X}/10 border border-comunify-{X}` | `text-comunify-{X}-text` | 4.5-9.7:1 ✅ |
| Badge / status pill | `bg-comunify-{X}/10` | `text-comunify-{X}-text` | idem ✅ |
| Alert banner sólido | `bg-comunify-{X}` | `text-comunify-text` (oscuro) | 5-10:1 ✅ |
| Error label inline | (transparente) | `text-comunify-critical-text` | 4.53:1 ✅ |

## Arch fitness híbrido (opción C ratificada)

**HARD blocked patterns (6):**
- `bg-comunify-warning text-white` (1.80:1)
- `bg-comunify-stable text-white` (2.20:1)
- `bg-comunify-accent text-white` (2.95:1)
- `text-comunify-warning bg-comunify-bg` (1.72:1)
- `text-comunify-stable bg-comunify-bg` (2.10:1)
- `text-comunify-accent bg-comunify-bg` (2.82:1)

**NO blocked (responsabilidad dev — UI/large only acceptable):**
- `bg-comunify-critical text-white` (3.76:1 OK como UI/large)
- `bg-comunify-blue text-white` (3.81:1 OK como UI/large)

**Magic comment escape:** `// a11y-allow: <reason>` permite excepciones documentadas (allowlist `[]` baseline mantenido — 0 excepciones post-sweep).

