## Limitations (deferred / out-of-scope)

- **Live E2E execution:** dev stack offline durante audit phase. Comandos reproducibles documentados en 07-merge.md § 5. Auditor explícitamente APPROVED-WITH-CAVEAT non-blocking.
- **Cross-brand lift:** Camino B pattern + arch fitness anti-low-contrast son PROMOTABLE candidates a `_pm-brand-template/` scaffold + `core/luana-core-platform/design-tokens/` cuando 2+ brands lo necesiten. Pingear `/pm-luana` post-merge.
- **chrome-devtools-verify deprecated Linux:** 4to ciclo consecutivo sin alternativa live verification — PROMOTABLE outcome platform `linux-live-verification-replacement`.
- **Dark mode:** out of scope (ADR separado futuro)
- **Audit otras brands (vitalia/nicolify/lupulo):** PROMOTABLE candidate, no en scope story

