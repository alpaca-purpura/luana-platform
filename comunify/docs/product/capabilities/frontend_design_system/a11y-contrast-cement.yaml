## Scenarios live

- Developer agrega botón warning outline siguiendo recipe Camino B → contrast ≥ 4.5:1 verificado en computed style + arch fitness GREEN
- Developer escribe `bg-comunify-warning text-white` → arch fitness FALLA build con cite path + line + suggestion
- Developer agrega badge nuevo con `bg-comunify-warning/10 text-comunify-warning` (sin `-text` sufijo) → arch fitness FALLA legacy ratchet
- Moderation card renderiza 3 botones outline (verde/amarillo/rojo) — semantic color preserved, contrast 4.5-9.7:1 AA per pair

