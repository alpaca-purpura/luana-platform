[project]
name = "luana-comunify"
version = "0.1.0"
requires-python = ">=3.12"
# Workspace member stub para comunify. Runtime deps consumidas por comunify/backend/
# pero declaradas aquí porque comunify/backend/ no es workspace member (S-DOCKER-DEV-MULTIBRAND gap).
# Cuando comunify/backend/ se promueva a workspace member, mover estas deps allí.
# Espejo: vitalia/pyproject.toml (cementado en vitalia-dev-stack-functional 07-merge.md paso 6)
dependencies = [
    # ASGI server (dev compose llama `uv run uvicorn`)
    "uvicorn[standard]>=0.34.0",
    # FastAPI runtime
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "starlette>=0.46",
    "structlog>=25.1",
    # Persistence (comunify/backend/src importa SQLAlchemy)
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Engine core packages (comunify/backend/src importa luana_core_*)
    "luana-core-platform",
    "luana-core-observability",
    "luana-core-extension-sdk",
    "luana-core-channels",
    "luana-core-extraction",
    # Durable flows engine (checkpointer durable compartido) — proposal 2026-06-02
    "luana-core-flows",
    # Copilot engine (comunify-shell-organism T-agentic — thin mount of /chat) +
    # IAM (auth deps get_current_user/get_tenant_context que el router del engine importa).
    # Espejo vitalia/pyproject.toml (declara luana-core-iam para el mismo mount).
    "luana-core-copilot",
    "luana-core-iam",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# comunify/src/ no existe — solo declaramos packages para satisfacer hatchling build.
# El "build" de luana-comunify no se hace en runtime; solo se instala editable para
# arrastrar dependencies. Hatchling acepta force-include vacío.
[tool.hatch.build.targets.wheel]
bypass-selection = true
