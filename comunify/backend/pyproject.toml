[project]
name = "luana-comunify-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "starlette>=0.46",
    "structlog>=25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-x -q --tb=short"
markers = [
    "integration: requires live Postgres instance (skipped when DB unavailable)",
    "verify: data reliability layer verification tests",
    "agentic_eval: agentic evaluation tests (cost-bucketed)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".git", "__pycache__", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
