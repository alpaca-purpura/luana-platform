---
# comunify/deploy/k8s/secrets.template.yaml
# PLANTILLA — NUNCA commitear valores reales en este archivo.
# Todos los valores deben ser "REEMPLAZAR".
#
# Chris crea el Secret en el cluster via:
#   kubectl create secret generic comunify-secrets \
#     --from-literal=ANTHROPIC_API_KEY=<valor> \
#     --from-literal=DATABASE_URL=<postgres-dsn> \
#     --from-literal=REDIS_URL=<redis-url> \
#     --from-literal=CLERK_SECRET_KEY=<valor> \
#     --from-literal=CLERK_PUBLISHABLE_KEY=<valor> \
#     -n luana-platform
#
# Arch ref: S-CICD-DEPLOY 05-guidelines.md § F8 (no commitear secretos reales)
apiVersion: v1
kind: Secret
metadata:
  name: comunify-secrets
  namespace: luana-platform
  labels:
    app: comunify
    app.kubernetes.io/name: comunify
    app.kubernetes.io/part-of: luana-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REEMPLAZAR"
  DATABASE_URL: "REEMPLAZAR"
  REDIS_URL: "REEMPLAZAR"
  CLERK_SECRET_KEY: "REEMPLAZAR"
  CLERK_PUBLISHABLE_KEY: "REEMPLAZAR"
