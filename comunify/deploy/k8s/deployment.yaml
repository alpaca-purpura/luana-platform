---
# Comunify — Kubernetes Deployment (Story 12 T-deploy-1)
# Vertical: Creator Economy (coaches/nutritionists/productivity)
# Tenants: anabella-coaching-ar, trini-nutrition-cl, pablo-productividad-mx
#
# Apply:
#   kubectl apply -f deploy/k8s/deployment.yaml
#
# Secrets required (create before applying):
#   kubectl create secret generic comunify-secrets \
#     --from-literal=ANTHROPIC_API_KEY=<key> \
#     --from-literal=DATABASE_URL=<postgres-dsn> \
#     --from-literal=REDIS_URL=<redis-url> \
#     --from-literal=CLERK_SECRET_KEY=<key> \
#     --from-literal=CLERK_PUBLISHABLE_KEY=<key>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: comunify-backend
  namespace: luana-platform
  labels:
    app: comunify
    component: backend
    vertical: creator-economy
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: comunify
      component: backend
  template:
    metadata:
      labels:
        app: comunify
        component: backend
        vertical: creator-economy
    spec:
      containers:
        - name: comunify-backend
          image: ghcr.io/alpacapurpura/luana-comunify-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: VERTICAL
              value: "creator-economy"
            # Secrets from K8s secret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: comunify-secrets
                  key: ANTHROPIC_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: comunify-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: comunify-secrets
                  key: REDIS_URL
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: comunify-secrets
                  key: CLERK_SECRET_KEY
            - name: CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: comunify-secrets
                  key: CLERK_PUBLISHABLE_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      imagePullSecrets:
        - name: ghcr-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comunify-frontend
  namespace: luana-platform
  labels:
    app: comunify
    component: frontend
    vertical: creator-economy
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: comunify
      component: frontend
  template:
    metadata:
      labels:
        app: comunify
        component: frontend
        vertical: creator-economy
    spec:
      containers:
        - name: comunify-frontend
          image: ghcr.io/alpacapurpura/luana-comunify-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.comunify.lat"
            - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: comunify-secrets
                  key: CLERK_PUBLISHABLE_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      imagePullSecrets:
        - name: ghcr-credentials
