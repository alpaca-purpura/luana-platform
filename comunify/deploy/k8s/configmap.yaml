---
# comunify/deploy/k8s/configmap.yaml
# Valores no sensibles para la aplicacion Comunify.
# Secretos sensibles viven en secrets.template.yaml — NUNCA commitear valores reales aqui.
#
# Wire CI/CD (S-CICD-DEPLOY T-5):
#   _deploy-brand.yml aplica este ConfigMap via kubectl apply antes del rolling update.
#   Secrets: viven en GitHub Environment 'comunify-prod' o 'comunify-staging'.
#
# Arch ref: S-CICD-DEPLOY 03-arch.md § T-5
apiVersion: v1
kind: ConfigMap
metadata:
  name: comunify-config
  namespace: luana-platform
  labels:
    app: comunify
    app.kubernetes.io/name: comunify
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: luana-platform
    app.kubernetes.io/managed-by: kubectl
data:
  # ── Aplicacion ─────────────────────────────────────────────────────────────
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  VERTICAL: "creator-economy"

  # ── Dominio ─────────────────────────────────────────────────────────────────
  COMUNIFY_APP_DOMAIN: "comunify.lat"
  NEXT_PUBLIC_API_URL: "https://api.comunify.lat"

  # ── Identificacion del brand ─────────────────────────────────────────────
  COMUNIFY_BRAND_SLUG: "comunify"
  COMUNIFY_COMPLIANCE_LEVEL: "standard"
