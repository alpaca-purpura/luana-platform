# Comunify — Cloudflare Tunnel configuration (Story 12 T-deploy-1)
#
# Tunnel: comunify-prod
#
# Prerequisites:
#   1. Create tunnel: cloudflared tunnel create comunify-prod
#   2. Copy <tunnel-id>.json credential file to this directory
#   3. Update tunnel field below with the tunnel UUID
#   4. Apply DNS records per DNS-RECORDS.md
#   5. Deploy cloudflared as K8s Deployment (see deployment instructions below)
#
# K8s Deployment for cloudflared:
#   kubectl create secret generic tunnel-credentials \
#     --from-file=credentials.json=deploy/cloudflared/<tunnel-id>.json \
#     -n luana-platform
#
#   kubectl apply -f - <<EOF
#   apiVersion: apps/v1
#   kind: Deployment
#   metadata:
#     name: cloudflared
#     namespace: luana-platform
#   spec:
#     replicas: 1
#     selector:
#       matchLabels:
#         app: cloudflared
#     template:
#       metadata:
#         labels:
#           app: cloudflared
#       spec:
#         containers:
#           - name: cloudflared
#             image: cloudflare/cloudflared:latest
#             args:
#               - tunnel
#               - --config
#               - /etc/cloudflared/config/config.yml
#               - run
#             volumeMounts:
#               - name: config
#                 mountPath: /etc/cloudflared/config
#               - name: creds
#                 mountPath: /etc/cloudflared/creds
#         volumes:
#           - name: config
#             configMap:
#               name: cloudflared-config
#           - name: creds
#             secret:
#               secretName: tunnel-credentials
#   EOF

tunnel: <YOUR-TUNNEL-UUID>
credentials-file: /etc/cloudflared/creds/credentials.json

ingress:
  # API backend
  - hostname: api.comunify.lat
    service: http://comunify-backend.luana-platform.svc.cluster.local:8000

  # Widget embed endpoint
  - hostname: widget.comunify.lat
    service: http://comunify-frontend.luana-platform.svc.cluster.local:3000

  # Main app
  - hostname: comunify.lat
    service: http://comunify-frontend.luana-platform.svc.cluster.local:3000

  # Catch-all (required by cloudflared)
  - service: http_status:404
