# comunify/docker-compose.dev.yml
# Brand-specific services para Comunify (creator economy y educacion).
# Siempre se usa combinado con el compose raiz:
#   docker compose -f docker-compose.dev.yml -f comunify/docker-compose.dev.yml up -d
# O mas facil: make dev-comunify
# SSoT puertos/DB/etc: comunify/config/brand.yaml::infra
#
# S-DOCKER-DEV-MULTIBRAND T-2 — 2026-05-15
# Decisions: D2, D4, D5, D6

name: luana-dev  # mismo name que raiz para compartir network/volumes

services:
  comunify_backend_dev:
    build:
      context: .  # contexto = raiz monorepo (accede a core/ y comunify/backend/)
      dockerfile: comunify/backend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - path: comunify/.env.dev  # gitignored; copiado desde comunify/.env.dev.template
        required: false  # compose config --quiet pasa aunque el archivo no exista aun
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:password@luana_postgres_dev:5432/comunify_dev"
      REDIS_URL: "redis://luana_redis_dev:6379/2"
      QDRANT_HOST: "luana_qdrant_dev"
      QDRANT_COLLECTION_PREFIX: "comunify_"
      PORT: "8003"
      # uv run desde /workspace/comunify/backend (subproject sin workspace member) crearía
      # su propio .venv local. Forzamos el venv workspace root donde sí están las deps
      # runtime (uvicorn, sqlalchemy, asyncpg, alembic, luana_core_*).
      # Espejo vitalia compose (receta 07-merge.md paso 3).
      UV_PROJECT_ENVIRONMENT: "/workspace/.venv"
    volumes:
      - .:/workspace:rw  # bind mount monorepo completo (hot-reload)
      # Named volume protege el venv del container en la ruta donde el Dockerfile lo crea
      # (workspace root, NO en {brand}/backend/.venv). Docker populates the empty named volume
      # from the image's /workspace/.venv on first start (built-in init behavior).
      - comunify_backend_venv:/workspace/.venv
    ports:
      - "127.0.0.1:8003:8003"
    networks:
      - luana_dev_net
    depends_on:
      luana_postgres_dev:
        condition: service_healthy
    command: >
      sh -c "cd /workspace/comunify/backend &&
      uv run alembic upgrade head &&
      uv run uvicorn src.main:app
      --host 0.0.0.0
      --port 8003
      --proxy-headers
      --forwarded-allow-ips '*'
      --reload
      --reload-dir /workspace/comunify/backend/src
      --reload-dir /workspace/core"
    deploy:
      resources:
        limits:
          memory: 1G

  comunify_frontend_dev:
    build:
      context: .
      dockerfile: comunify/frontend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - path: comunify/.env.dev
        required: false
    environment:
      PORT: "3003"
      # Cap heap V8 de `next dev`. 768 alcanzaba con .next caliente, pero el COLD-compile del shell
      # (@luana/ui-kit completo vía Turbopack) revienta el proceso (exit-during-compile) tras un wipe
      # de .next. 2048 da headroom para el cold-compile; el límite de memoria sube a 3G acorde.
      NODE_OPTIONS: "--max-old-space-size=2048"
      # NEXT_PUBLIC_API_URL removed (2026-05-20) — let env_file (comunify/.env.dev) win:
      #   - tunnel mode: https://dev-app.comunifyagents.com (browser hits tunnel which routes /api/* to backend)
      #   - local mode:  http://127.0.0.1:8003 (set en .env.dev cuando no se usa tunnel)
      # Hardcode previo rompía post-login flows desde dev-app.* (mixed content + 127.0.0.1 unreachable from external host).
    volumes:
      # Bind mount al path donde el Dockerfile pone WORKDIR + pnpm install (/app/comunify/frontend),
      # NO en /app raíz (eso sobrescribiría /app/node_modules + /app/pnpm-workspace.yaml del image).
      - ./comunify/frontend:/app/comunify/frontend:rw
      # Anonymous volume enmascara node_modules del host (con symlinks pnpm host-only)
      # exponiendo los node_modules del image (pnpm install --filter "@luana/comunify-web").
      - /app/comunify/frontend/node_modules
    ports:
      - "127.0.0.1:3003:3003"
    networks:
      - luana_dev_net
    deploy:
      resources:
        limits:
          memory: 3G

  comunify_cloudflared_dev:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]  # opt-in: make dev-comunify-tunnel
    restart: unless-stopped
    # Locally-managed tunnel: usa dev-config.yml versionado + credentials.json gitignored.
    # NO usar TUNNEL_TOKEN aqui (eso seria remotely-managed mode, mutuamente excluyente).
    command: tunnel --config /etc/cloudflared/dev-config.yml --no-autoupdate run
    volumes:
      - ./comunify/deploy/cloudflared/dev-config.yml:/etc/cloudflared/dev-config.yml:ro
      - ./comunify/deploy/cloudflared/.credentials/dev-tunnel.json:/etc/cloudflared/dev-tunnel.json:ro
    depends_on:
      - comunify_backend_dev
      - comunify_frontend_dev
    networks:
      - luana_dev_net

volumes:
  comunify_backend_venv:
    name: comunify_backend_venv
  # comunify_frontend_node_modules: removido (reemplazado por anonymous volume en el servicio,
  # ver comunify_frontend_dev.volumes — Docker maneja el lifecycle automáticamente)

# NOTA: network luana_dev_net es definida en el compose raiz (docker-compose.dev.yml).
