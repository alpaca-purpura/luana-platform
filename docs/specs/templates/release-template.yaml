# Release schema (v2 cement 2026-05-27)
# Doc: docs/process/release-protocol.md
# Path canónico: {brand}/docs/product/releases/{release_id}.yaml

release_id: RELEASE_ID                # ej "F2" · PK funcional · NO renombrar después
brand: BRAND                          # vitalia | nicolify | comunify | lupulo | ...
name: "Nombre corto del release"      # ej "Migración progresiva · primer valor Valeria + Lisa"
description: "Descripción 1-2 líneas que explican el bloque de trabajo + outcome esperado"
status: planning                       # planning | in_progress | ready_to_merge | shipped | backlog
target_date: null                      # ISO date YYYY-MM-DD · null hasta que Chris la llene
shipped_date: null                      # ISO date · solo al cerrar status=shipped
order: 0                                # int (menor = primero en Roadmap)
created_at: YYYY-MM-DDTHH:MM:SS-05:00
created_by: chris

# Stories asignadas (denormalizada · source-of-truth = checkpoint.md de cada story)
# Drag stories entre releases en cockpit Roadmap actualiza esta lista + el `release:` field del checkpoint.md
stories: []
# stories:
#   - story-id-1
#   - story-id-2

# Legacy outcome mapping (transition phase · removerlo cuando todas las stories migren al schema v2)
# Útil para vista de migración + auditoría
maps_legacy_outcome: null              # ej "vitalia-mvp-ui-foundation" · null si net-new
maps_legacy_phase: null                # ej "fase-2" · null si net-new
