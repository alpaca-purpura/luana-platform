# 04-validators.yaml — S-GIT-STRATEGY-CORE
#
# Schema v4. Validators ejecutables para /dev-team iterando contra gates.
# Surface: INFRA (rules MD + workflows YAML + bash hook).
# No aplica: visual (sin UI), agentic_eval (sin agente).
#
# Iteration policy: max_iterations=10, on_fail fix targeted file + re-run.
# All validators must_pass: true — no validator can be skipped without justified commit.

story_id: S-GIT-STRATEGY-CORE
schema_version: v4
surface: INFRA

validators:
  # ═══════════════════════════════════════════════════════════════
  # NON-FUNCTIONAL — code/file quality (lint, format, syntax)
  # ═══════════════════════════════════════════════════════════════

  - id: actionlint_workflows
    category: non_functional
    type: shell
    cmd: "actionlint .github/workflows/ci.yml .github/workflows/ci-wip.yml .github/workflows/cd-staging.yml .github/workflows/cd-prod.yml .github/workflows/cleanup-wip.yml"
    must_pass: true
    timeout_sec: 30
    description: "Syntax + semantic validation de GitHub Actions YAML. actionlint detecta references inválidas, expressions mal formadas, steps sin name, triggers incorrectos."
    install_hint: "go install github.com/rhysd/actionlint/cmd/actionlint@latest"
    fallback_cmd: "python3 -c \"import yaml; [yaml.safe_load(open(f)) for f in ['.github/workflows/ci.yml', '.github/workflows/ci-wip.yml', '.github/workflows/cd-staging.yml', '.github/workflows/cd-prod.yml', '.github/workflows/cleanup-wip.yml']]\" && echo 'YAML parse OK'"

  - id: shellcheck_pre_commit
    category: non_functional
    type: shell
    cmd: "shellcheck -e SC2086,SC2046 scripts/git-hooks/pre-commit"
    must_pass: true
    timeout_sec: 30
    description: "ShellCheck análisis estático del hook bash. SC2086/SC2046 deshabilitados (word-splitting intencional en loop git diff output). 0 errores restantes."
    install_hint: "apt-get install shellcheck"

  - id: shellcheck_test_hook
    category: non_functional
    type: shell
    cmd: "shellcheck scripts/tests/test_pre_commit_hook.sh"
    must_pass: true
    timeout_sec: 30
    description: "ShellCheck sobre el script de tests bash del hook. Mismo nivel de calidad que el hook mismo."

  - id: markdownlint_rules
    category: non_functional
    type: shell
    cmd: "markdownlint .claude/rules/git-safety.md .claude/rules/parallel-safety.md .claude/rules/git-haiku-delegation.md --config .markdownlint.json 2>/dev/null || markdownlint .claude/rules/git-safety.md .claude/rules/parallel-safety.md .claude/rules/git-haiku-delegation.md"
    must_pass: true
    timeout_sec: 15
    description: "Markdown lint sobre las 3 rules MD reescritas. 0 errores. Config .markdownlint.json si existe, defaults si no."
    install_hint: "npm install -g markdownlint-cli"

  - id: workflow_permissions_check
    category: non_functional
    type: shell
    cmd: "for f in .github/workflows/ci-wip.yml .github/workflows/cd-staging.yml .github/workflows/cd-prod.yml .github/workflows/cleanup-wip.yml; do grep -q 'permissions:' \"$f\" || { echo \"FAIL: $f missing permissions: block\"; exit 1; }; done && echo 'OK: all workflows have permissions block'"
    must_pass: true
    timeout_sec: 10
    description: "Security check: cada workflow nuevo MUST tener bloque permissions: con least-privilege. Workflows sin permissions: heredan GITHUB_TOKEN write en todos los scopes (supply chain risk)."

  - id: workflow_pinned_actions
    category: non_functional
    type: shell
    cmd: "grep -rn 'uses:.*@main\\|uses:.*@latest\\|uses:.*@master' .github/workflows/ci-wip.yml .github/workflows/cd-staging.yml .github/workflows/cd-prod.yml .github/workflows/cleanup-wip.yml && echo 'FAIL: unpinned @main/@latest/@master action found' && exit 1 || echo 'OK: no unpinned actions'"
    must_pass: true
    timeout_sec: 10
    description: "Verifica que los nuevos workflows no usen @main/@latest/@master en actions (supply chain risk en prod). Versiones pinadas como @v4, @v3, etc. son OK."

  - id: release_yml_preserved
    category: non_functional
    type: shell
    cmd: "git diff HEAD -- .github/workflows/release.yml | wc -l | grep -E '^0$' && echo 'OK: release.yml not modified' || (echo 'FAIL: release.yml was modified — must be preserved unchanged'; exit 1)"
    must_pass: true
    timeout_sec: 10
    description: "Regresión: release.yml (GH Packages publish) debe estar intacto. Si el diff muestra cambios → ticket salió de scope."

  # ═══════════════════════════════════════════════════════════════
  # FUNCTIONAL — 1 validator por Scenario del 01-spec.md
  # ═══════════════════════════════════════════════════════════════

  - id: scenario_1_wip_ci_trigger
    category: functional
    type: shell
    scenario_id: wip-branch-ci-light
    cmd: |
      set -e
      # Verificar que ci-wip.yml tiene trigger wip/**
      grep -qE "branches:.*wip|'wip/\*\*'" .github/workflows/ci-wip.yml \
        || grep -qE "- 'wip/\*\*'" .github/workflows/ci-wip.yml \
        || { echo 'FAIL: ci-wip.yml missing wip/** trigger'; exit 1; }
      # Verificar que ci.yml NO tiene trigger wip/**
      if grep -qE "wip" .github/workflows/ci.yml; then
        echo "FAIL: ci.yml must NOT include wip/** in triggers"
        exit 1
      fi
      # Verificar que cd-staging.yml NO tiene trigger wip/**
      if grep -qE "wip" .github/workflows/cd-staging.yml; then
        echo "FAIL: cd-staging.yml must NOT include wip/** in triggers"
        exit 1
      fi
      echo "PASS: Scenario 1 — ci-wip.yml triggers correctly on wip/**, ci.yml and cd-staging.yml do not"
    must_pass: true
    timeout_sec: 15

  - id: scenario_2_main_triggers_staging
    category: functional
    type: shell
    scenario_id: squash-merge-main-to-staging
    cmd: |
      set -e
      # Verificar que cd-staging.yml trigger en push:main
      grep -qE "branches.*\[main\]|branches:.*main" .github/workflows/cd-staging.yml \
        || grep -qE "- main$" .github/workflows/cd-staging.yml \
        || { echo 'FAIL: cd-staging.yml missing main trigger'; exit 1; }
      # Verificar que ci.yml tiene jobs con arch-fitness o coverage mencionado
      grep -qE "arch.fitness|coverage|architecture" .github/workflows/ci.yml \
        || { echo 'FAIL: ci.yml missing arch-fitness/coverage gates'; exit 1; }
      # Verificar que cd-prod.yml NO se dispara en main
      if grep -qE "branches.*\[main\]|branches:.*main" .github/workflows/cd-prod.yml; then
        echo "FAIL: cd-prod.yml must NOT trigger on main (only release/**)"
        exit 1
      fi
      echo "PASS: Scenario 2 — main triggers ci.yml + cd-staging.yml, NOT cd-prod.yml"
    must_pass: true
    timeout_sec: 15

  - id: scenario_3_release_branch_to_prod
    category: functional
    type: shell
    scenario_id: release-branch-to-prod
    cmd: |
      set -e
      # Verificar trigger release/**
      grep -qE "release/\*\*|'release/\*'" .github/workflows/cd-prod.yml \
        || grep -qE "- 'release/\*\*'" .github/workflows/cd-prod.yml \
        || { echo 'FAIL: cd-prod.yml missing release/** trigger'; exit 1; }
      # Verificar que tiene parsing brand+version via regex
      grep -qE "BASH_REMATCH|release/.*-v.*\|sed.*release" .github/workflows/cd-prod.yml \
        || { echo 'FAIL: cd-prod.yml missing brand/version extraction logic'; exit 1; }
      # Verificar que usa dorny/paths-filter o equivalente
      grep -qE "dorny/paths-filter|paths-filter" .github/workflows/cd-prod.yml \
        || { echo 'FAIL: cd-prod.yml missing dorny/paths-filter for selective deploy'; exit 1; }
      echo "PASS: Scenario 3 — cd-prod.yml triggers on release/**, parses brand+version, uses paths-filter"
    must_pass: true
    timeout_sec: 15

  - id: scenario_4_pull_prohibited_in_rules
    category: functional
    type: shell
    scenario_id: pull-prohibited-regression
    cmd: |
      set -e
      # git pull sigue prohibido en la nueva rule
      grep -qiE "git pull.*PROHIBIDO|PROHIBIDO.*git pull|pull.*prohib" .claude/rules/git-safety.md \
        || { echo 'FAIL: git-safety.md must still prohibit git pull'; exit 1; }
      # git fetch && merge también prohibido
      grep -qiE "fetch.*merge.*PROHIBID|PROHIBID.*fetch.*merge|fetch.*&&.*merge" .claude/rules/git-safety.md \
        || { echo 'FAIL: git-safety.md must prohibit git fetch && merge'; exit 1; }
      # legacy "única rama development" debe estar REMOVIDA
      if grep -qiE "development.*única.*rama|única.*rama.*development" .claude/rules/git-safety.md; then
        echo "FAIL: git-safety.md still mentions 'development única rama' — legacy text must be removed"
        exit 1
      fi
      # Nueva triple-branch mencionada
      grep -qiE "triple.branch|wip/|release/" .claude/rules/git-safety.md \
        || { echo 'FAIL: git-safety.md must mention triple-branch and wip/*, release/*'; exit 1; }
      echo "PASS: Scenario 4 — git-safety.md prohibits pull, removes legacy, adds triple-branch"
    must_pass: true
    timeout_sec: 10

  - id: scenario_5_hook_dynamic_gates
    category: functional
    type: shell
    scenario_id: hook-dynamic-gates-wip
    cmd: |
      set -e
      # Hook tiene branch detection via symbolic-ref
      grep -qE "symbolic-ref|git.*branch.*show-current" scripts/git-hooks/pre-commit \
        || { echo 'FAIL: pre-commit hook missing branch detection (symbolic-ref)'; exit 1; }
      # Hook tiene case/switch para wip/*
      grep -qE "case.*BRANCH|wip/\*\)|wip\*" scripts/git-hooks/pre-commit \
        || { echo 'FAIL: pre-commit hook missing case statement for wip/* branch'; exit 1; }
      # GATE_LEVEL variable present
      grep -qE "GATE_LEVEL" scripts/git-hooks/pre-commit \
        || { echo 'FAIL: pre-commit hook missing GATE_LEVEL variable'; exit 1; }
      # Tests bash existen y pasan
      if [ -f scripts/tests/test_pre_commit_hook.sh ]; then
        bash scripts/tests/test_pre_commit_hook.sh
      else
        echo "FAIL: scripts/tests/test_pre_commit_hook.sh missing — TDD required (write tests first)"
        exit 1
      fi
      echo "PASS: Scenario 5 — hook has branch detection + GATE_LEVEL + test suite passes"
    must_pass: true
    timeout_sec: 60

  - id: scenario_6_cleanup_wip_safe
    category: functional
    type: shell
    scenario_id: cleanup-wip-safe-30d
    cmd: |
      set -e
      # Workflow existe
      [ -f .github/workflows/cleanup-wip.yml ] \
        || { echo 'FAIL: cleanup-wip.yml missing'; exit 1; }
      # Tiene schedule (cron)
      grep -qE "schedule:|cron:" .github/workflows/cleanup-wip.yml \
        || { echo 'FAIL: cleanup-wip.yml missing schedule/cron trigger'; exit 1; }
      # Tiene workflow_dispatch (manual trigger)
      grep -qE "workflow_dispatch:" .github/workflows/cleanup-wip.yml \
        || { echo 'FAIL: cleanup-wip.yml missing workflow_dispatch trigger'; exit 1; }
      # NO toca main ni release/* (grep negativo)
      if grep -qE "delete.*main|branch.*main.*delete|delete.*release/" .github/workflows/cleanup-wip.yml; then
        echo "FAIL: cleanup-wip.yml must NEVER delete main or release/* branches"
        exit 1
      fi
      # Tiene lógica de fecha (committerdate o log --since)
      grep -qE "committerdate|git log.*since|MAX_AGE|max_age" .github/workflows/cleanup-wip.yml \
        || { echo 'FAIL: cleanup-wip.yml missing date-based filtering logic'; exit 1; }
      # dry_run input presente
      grep -qE "dry.run|dry_run" .github/workflows/cleanup-wip.yml \
        || { echo 'FAIL: cleanup-wip.yml missing dry_run input'; exit 1; }
      echo "PASS: Scenario 6 — cleanup-wip.yml has cron, workflow_dispatch, safe filtering, dry-run"
    must_pass: true
    timeout_sec: 15

  # ═══════════════════════════════════════════════════════════════
  # ADDITIONAL FUNCTIONAL — integrity checks cross-file
  # ═══════════════════════════════════════════════════════════════

  - id: parallel_safety_m9_m10_m11
    category: functional
    type: shell
    cmd: |
      set -e
      # M9: worktree Agent isolation mencionado
      grep -qiE "M9|worktree.*agent|agent.*isolation.*worktree" .claude/rules/parallel-safety.md \
        || { echo 'FAIL: parallel-safety.md missing M9 (worktree Agent isolation)'; exit 1; }
      # M10: wip branches autosave mencionado
      grep -qiE "M10|wip.*autosave|autosave.*wip" .claude/rules/parallel-safety.md \
        || { echo 'FAIL: parallel-safety.md missing M10 (wip autosave)'; exit 1; }
      # M11: push >30min mencionado
      grep -qiE "M11|30.*min|push.*30|30.*push" .claude/rules/parallel-safety.md \
        || { echo 'FAIL: parallel-safety.md missing M11 (push every 30 min)'; exit 1; }
      # Ban legacy "WORKTREES PROHIBIDOS" debe estar removido
      if grep -qiE "WORKTREES PROHIBIDOS|worktrees.*PROHIBID" .claude/rules/parallel-safety.md; then
        echo "FAIL: parallel-safety.md still has legacy 'WORKTREES PROHIBIDOS' text — must be removed"
        exit 1
      fi
      echo "PASS: parallel-safety.md has M9+M10+M11, removed legacy worktree ban"
    must_pass: true
    timeout_sec: 10

  - id: haiku_delegation_3_destinos
    category: functional
    type: shell
    cmd: |
      set -e
      # Los 3 destinos mencionados
      grep -qiE "wip/|wip branch" .claude/rules/git-haiku-delegation.md \
        || { echo 'FAIL: git-haiku-delegation.md missing wip/* as destination'; exit 1; }
      grep -qiE "release/|release branch" .claude/rules/git-haiku-delegation.md \
        || { echo 'FAIL: git-haiku-delegation.md missing release/* as destination'; exit 1; }
      grep -qiE "\bmain\b" .claude/rules/git-haiku-delegation.md \
        || { echo 'FAIL: git-haiku-delegation.md missing main as destination'; exit 1; }
      # Hardcode "origin development" debe estar removido del guardrail template
      if grep -qE "push origin development" .claude/rules/git-haiku-delegation.md; then
        echo "FAIL: git-haiku-delegation.md still has hardcoded 'git push origin development' — must be generalized to 3 destinations"
        exit 1
      fi
      echo "PASS: git-haiku-delegation.md generalized to 3 destinations (main, wip/*, release/*)"
    must_pass: true
    timeout_sec: 10

  - id: ci_yml_full_gates
    category: functional
    type: shell
    cmd: |
      set -e
      # ci.yml trigger en main + PR
      grep -qE "branches.*\[main\]|branches:.*main" .github/workflows/ci.yml \
        || { echo 'FAIL: ci.yml missing main trigger'; exit 1; }
      grep -qE "pull_request:" .github/workflows/ci.yml \
        || { echo 'FAIL: ci.yml missing pull_request trigger'; exit 1; }
      # Jobs esperados
      grep -qE "python.lint|python-lint" .github/workflows/ci.yml \
        || { echo 'FAIL: ci.yml missing python-lint job'; exit 1; }
      grep -qE "python.test|python-test" .github/workflows/ci.yml \
        || { echo 'FAIL: ci.yml missing python-test job'; exit 1; }
      grep -qE "ts.lint|ts-lint" .github/workflows/ci.yml \
        || { echo 'FAIL: ci.yml missing ts-lint job'; exit 1; }
      grep -qE "ts.test|ts-test" .github/workflows/ci.yml \
        || { echo 'FAIL: ci.yml missing ts-test job'; exit 1; }
      # arch-fitness o architecture gate
      grep -qE "arch.fitness|architecture|arch_fitness" .github/workflows/ci.yml \
        || { echo 'FAIL: ci.yml missing arch-fitness gate'; exit 1; }
      echo "PASS: ci.yml has main+PR triggers and all required jobs"
    must_pass: true
    timeout_sec: 10

  # ═══════════════════════════════════════════════════════════════
  # VISUAL — NO APLICA (sin UI)
  # AGENTIC_EVAL — NO APLICA (sin agente)
  # ═══════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════
# Scenario coverage matrix
# ═══════════════════════════════════════════════════════════════

scenario_coverage:
  - scenario_id: wip-branch-ci-light
    validators: [scenario_1_wip_ci_trigger, workflow_permissions_check, actionlint_workflows]
  - scenario_id: squash-merge-main-to-staging
    validators: [scenario_2_main_triggers_staging, ci_yml_full_gates, actionlint_workflows]
  - scenario_id: release-branch-to-prod
    validators: [scenario_3_release_branch_to_prod, workflow_pinned_actions, actionlint_workflows]
  - scenario_id: pull-prohibited-regression
    validators: [scenario_4_pull_prohibited_in_rules, markdownlint_rules]
  - scenario_id: hook-dynamic-gates-wip
    validators: [scenario_5_hook_dynamic_gates, shellcheck_pre_commit, shellcheck_test_hook]
  - scenario_id: cleanup-wip-safe-30d
    validators: [scenario_6_cleanup_wip_safe, actionlint_workflows]

# ═══════════════════════════════════════════════════════════════
# Iteration policy
# ═══════════════════════════════════════════════════════════════

iteration:
  max_iterations: 10
  on_fail: "fix targeted file based on validator output, re-run failing validator only"
  on_all_pass: "set state=developing→developed, append iteration_log to T-{n}-impl-log.md"
  on_cap_reached: "set state=developing→blocked, escalate to Chris with last error trace"
