  .panel2 { background: var(--panel2); border: 1px solid var(--border); }
  .border-c { border-color: var(--border); }
  .text-muted { color: var(--muted); }
  /* compact scrollbars */
  ::-webkit-scrollbar { width:8px; height:8px } ::-webkit-scrollbar-thumb { background:#2a3142; border-radius:4px }
  ::-webkit-scrollbar-track { background:transparent }
  .badge { padding:2px 8px; border-radius:4px; font-size:11px; font-weight:500; }
  .pill { padding:1px 6px; border-radius:3px; font-size:10px; font-weight:500; letter-spacing:.02em; }

  .col { width:170px; min-width:170px; }
  details > summary { cursor:pointer; list-style:none; } details > summary::-webkit-details-marker { display:none; }
  /* drawer */
  .drawer { position:fixed; top:0; right:0; height:100vh; width:540px; transform:translateX(100%); transition:transform .2s ease; z-index:50; }
  .drawer.open { transform:translateX(0); }
  /* tabs */
  .tab { padding:8px 14px; border-bottom:2px solid transparent; color:var(--muted); cursor:pointer; font-size:13px; font-weight:500; }
  .tab.active { color:var(--text); border-bottom-color:var(--accent); }
  /* state colors */
  .s-idea { background:#1f2937; color:#9ca3af; }
  .s-refining { background:#1e3a8a; color:#93c5fd; }
  .s-refined { background:#312e81; color:#a5b4fc; }

  .a-lisa  { background:#16a34a20; color:#86efac; border-color:#16a34a40; }

  .f-vitalia { background:#06b6d430; color:#67e8f9; }
  .f-promote { background:#f59e0b30; color:#fcd34d; }

function switchView(v) {
  document.querySelectorAll('section[id^=view-]').forEach(s=>s.classList.add('hidden'));
  document.getElementById('view-'+v).classList.remove('hidden');
  document.querySelectorAll('[id^=nav-]').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-'+v).classList.add('active');
}

function renderBoard() {
  const cols = document.getElementById('board-cols');
  cols.innerHTML = '';
  STATES.forEach(state => {
    const items = STORIES.filter(s=>s.state===state);
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `
      <div class="flex items-center justify-between mb-2 px-1">
        <span class="text-xs font-semibold uppercase tracking-wider">${state}</span>
        <span class="text-xs text-muted">${items.length}</span>
      </div>
      <div class="space-y-2 min-h-[400px]" data-state="${state}">
        ${items.map(s=>renderCard(s)).join('')}
      </div>
    `;
    cols.appendChild(col);
  });
}

function renderCard(s) {
  const agent = AGENTS[s.agent] || AGENTS.mateo;
  return `
    <div class="card" onclick='openStoryDrawer(${JSON.stringify(s).replace(/'/g,"&#39;")})'>
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-[10px] font-mono text-muted">${s.id}</span>
        ${s.prio === 'high' ? '<span class="text-amber-400 text-[10px]">⚡high</span>' : ''}
      </div>
      <div class="text-xs font-medium leading-snug mb-1.5">${s.cap || s.slug}</div>
      <div class="flex items-center gap-1 flex-wrap">
        <span class="pill ${agent.class}">${agent.name}</span>
        ${s.days ? `<span class="pill bg-zinc-800 text-zinc-400">${s.days}d</span>` : ''}
      </div>
      ${s.deps_hard ? `<div class="mt-1.5 text-[10px] text-muted">🔒 ${s.deps_hard} deps hard${s.deps_soft?' · '+s.deps_soft+' soft':''}</div>` : ''}
      ${s.state==='refining' && !s.ratified ? '<div class="mt-1.5 text-[10px] text-amber-400">⏳ AWAIT feedback Chris</div>' : ''}
      ${s.state==='done' && s.merge_sha ? `<div class="mt-1.5 text-[10px] text-muted">✓ ${s.merge_sha}</div>` : ''}
    </div>
  `;
}

function renderMap() {
  const grid = document.getElementById('map-grid');
  grid.innerHTML = '';
  Object.entries(MAP_DATA).forEach(([agentKey, modules]) => {
    const a = AGENTS[agentKey];
    if (!a) return;
    const liveCount = modules.flatMap(m=>m.caps).filter(c=>c.status==='live').length;
    const devCount  = modules.flatMap(m=>m.caps).filter(c=>c.status==='developing').length;
    const card = document.createElement('div');
    card.className = 'panel rounded-lg p-3';
    card.innerHTML = `
      <div class="flex items-center justify-between mb-3 pb-2 border-b border-c">
        <div class="flex items-center gap-2">
          <span class="pill ${a.class} !text-xs !px-2 !py-0.5">${a.name}</span>
          <span class="text-xs text-muted">${a.role}</span>
        </div>
        <div class="text-[10px] text-muted">${liveCount}✓ ${devCount?devCount+'🚧':''}</div>
      </div>
      <div class="space-y-3">
        ${modules.map(m=>`
          <div>
            <div class="text-[10px] uppercase tracking-wider text-muted mb-1">${m.module}</div>
            <div class="space-y-1">
              ${m.caps.map(c=>`
                <div class="flex items-center justify-between text-xs hover:bg-white/5 px-1.5 py-1 rounded cursor-pointer" onclick='openCapDrawer(${JSON.stringify({...c,agent:agentKey,module:m.module}).replace(/'/g,"&#39;")})'>
                  <span class="flex items-center gap-1.5">
                    <span class="${c.status==='live'?'text-green-400':c.status==='developing'?'text-amber-400':'text-zinc-500'}">
                      ${c.status==='live'?'✓':c.status==='developing'?'🚧':'⚪'}
                    </span>
                    <span class="${c.status==='live'?'':'text-muted'}">${c.name}</span>
                  </span>
                  <span class="pill f-${c.prov}">★${c.prov==='core'?'C':c.prov==='vitalia'?'V':'→C'}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `;
    grid.appendChild(card);
  });
}

function renderLearnings() {
  const list = document.getElementById('learnings-list');
  let current = '';
  let html = '';
  LEARNINGS.forEach(l => {
    const month = l.date.slice(0,7);
    if (month !== current) {
      current = month;
      html += `<div class="px-4 py-2 bg-black/30 text-xs uppercase tracking-wider text-muted font-semibold">${monthLabel(month)} — ${LEARNINGS.filter(x=>x.date.startsWith(month)).length} learnings</div>`;
    }
    html += `
      <div class="px-4 py-3 border-b border-c hover:bg-white/5 cursor-pointer" onclick='openLearningDrawer(${JSON.stringify(l).replace(/'/g,"&#39;")})'>
        <div class="flex items-center justify-between mb-1">
          <div class="flex items-center gap-3">
            <span class="text-xs font-mono text-muted">${l.date}</span>
            <span class="text-sm font-medium">${l.slug}</span>
          </div>
          <div class="flex items-center gap-2">
            ${l.refs ? `<span class="text-[10px] text-muted">↗ ${l.refs.length} refs</span>` : ''}
            <span class="pill t-${l.tag}">${tagLabel(l.tag)}</span>
          </div>
        </div>
        <div class="text-xs text-muted leading-relaxed pl-[88px]">${l.summary}</div>
      </div>
    `;
  });
  list.innerHTML = html;
}

function monthLabel(m) {
  const map = {'2026-05':'mayo 2026','2026-04':'abril 2026'};
  return map[m] || m;
}
function tagLabel(t) {
  return {'process':'① process','arq':'② arquitectura','tooling':'③ tooling','ux':'④ ux','runtime':'⑤ runtime'}[t] || t;
}

            </div>
          </div>
          <div>
            <div class="text-[10px] uppercase text-cyan-300 mb-1">🎨 FRONTEND</div>
            <code class="text-xs text-muted">vitalia/frontend/src/features/${c.name.split('.')[0]}/</code>
          </div>
          <div>
            <div class="text-[10px] uppercase text-amber-300 mb-1">🤖 AGENTIC</div>
            <span class="text-xs text-muted">${c.module==='sales_agent'||c.module==='copilot'?`vitalia/backend/src/modules/vitalia/${c.module}/`:'(esta capability no tiene surface agentic)'}</span>
          </div>
        </div>
      </div>

      <div class="panel2 rounded-lg p-4">
        <div class="text-xs uppercase tracking-wider text-muted font-semibold mb-2">📜 Linaje</div>
        <div class="text-xs space-y-1">
          ${c.story ? `<div>story origen → <code class="text-purple-300">${c.story}</code> <button class="text-muted hover:text-white ml-1">[abrir]</button></div>` : ''}
          ${c.merge ? `<div>merge SHA → <code class="text-green-400">${c.merge}</code></div>` : ''}
          <div>referenced by → 3 stories pendientes</div>
        </div>
      </div>
    </div>
  `);
}

function openLearningDrawer(l) {
  openDrawer(`
    <div class="p-5">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <button onclick="closeDrawer()" class="text-muted hover:text-white">←</button>
          <span class="text-xs font-mono text-muted">${l.date}</span>
          <span class="text-sm font-semibold">${l.slug}</span>
        </div>
        <span class="pill t-${l.tag}">${tagLabel(l.tag)}</span>
      </div>

      <div class="panel2 rounded-lg p-4 mb-4">
        <div class="text-xs uppercase tracking-wider text-muted font-semibold mb-2">📝 Summary</div>
        <p class="text-sm leading-relaxed text-zinc-300">${l.summary}</p>
      </div>

      <div class="panel2 rounded-lg p-4 mb-4">
        <div class="text-xs uppercase tracking-wider text-muted font-semibold mb-2">📄 Contenido markdown</div>
        <div class="text-xs text-muted italic">→ render react-markdown del file <code class="text-purple-300">learnings/${l.date}-${l.slug}.md</code></div>
        <div class="text-xs text-muted mt-2">(en la app real acá aparece el contenido completo del .md con cross-refs auto-detectadas)</div>
      </div>

      ${l.refs ? `
      <div class="panel2 rounded-lg p-4">
        <div class="text-xs uppercase tracking-wider text-muted font-semibold mb-2">🔗 Referenced by (${l.refs.length})</div>
        <div class="flex flex-wrap gap-2">${l.refs.map(r=>`<span class="pill bg-zinc-800 text-zinc-300 cursor-pointer hover:bg-zinc-700">${r}</span>`).join('')}</div>
      </div>` : ''}
    </div>
  `);
}

// init
renderBoard();
renderMap();
renderLearnings();
</script>
</body>
</html>
