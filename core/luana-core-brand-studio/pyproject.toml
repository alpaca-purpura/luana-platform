[project]
name = "luana-core-brand-studio"
version = "0.0.1-alpha"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "structlog>=24.0",
    "httpx>=0.27",                 # extraction crawler
    "langgraph>=0.2",              # StyleAnalyzer agent
    "langchain-core>=0.3",
    "qdrant-client>=1.10",         # style_anchor_store
    "luana-core-platform",
    "luana-core-iam",
    "luana-core-events",
    "luana-core-llm",
    "luana-core-extraction",
    "luana-core-copilot",          # Story 6 T-16 — copilot_provider/ unlift requires domain.ports + workflow
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_brand_studio"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
