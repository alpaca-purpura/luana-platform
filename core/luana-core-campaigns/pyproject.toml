[project]
name = "luana-core-campaigns"
version = "0.0.8-alpha"
requires-python = ">=3.12"
description = "Luana campaigns engine — lifted from AISALESHT backend/src/modules/campaigns/"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "structlog>=24.0",
    "httpx>=0.27",
    "arq>=0.26",                   # workers (execution_task, scheduler_tick, audit_retention, segment_refresh)
    "cachetools>=5.0",             # TTLCache in application/services/cache.py
    "luana-core-platform",
    "luana-core-iam",
    "luana-core-observability",
    "luana-core-idempotency",
    "luana-core-channels",
    "luana-core-events",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_campaigns"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
