[project]
name = "luana-core-offer-studio"
version = "0.0.1-alpha"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "structlog>=24.0",
    "httpx>=0.27",
    "qdrant-client>=1.10",
    "luana-core-platform",
    "luana-core-iam",
    "luana-core-events",
    "luana-core-llm",
    "luana-core-extraction",
    "luana-core-brand-studio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_offer_studio"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
