[project]
name = "luana-core-sales-agent"
version = "0.0.7-alpha"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "structlog>=24.0",
    "httpx>=0.27",
    "langgraph>=0.2",              # StateGraph supervisor specialist routing
    "langchain-core>=0.3",
    "langchain-openai>=0.2",       # for OpenAI-protocol providers
    "arq>=0.26",                   # workers (follow_up_engine, appointment_reminder, verify_pending_*)
    "jinja2>=3.1",                 # prompts templates (specialist_*, supervisor_routing.j2)
    "tiktoken>=0.7",               # token counter
    "litellm>=1.40",
    "luana-core-platform",
    "luana-core-iam",
    "luana-core-observability",
    "luana-core-llm",
    "luana-core-channels",
    "luana-core-events",
    "luana-core-idempotency",
    "luana-core-billing",
    "luana-core-compliance",
    "luana-core-extraction",
    "luana-core-brand-studio",     # D-T3 BrandVoicePort consumer (T-11/T-12 thread)
    "luana-core-offer-studio",
    "luana-core-crm",              # LeadModel SQLA mapper resolution
    "luana-core-copilot",          # for copilot_provider/provider.py subclass (T-15)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_sales_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
