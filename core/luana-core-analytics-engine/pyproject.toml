[project]
name = "luana-core-analytics-engine"
version = "0.0.1-alpha"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "structlog>=24.0",
    "httpx>=0.27",
    "arq>=0.26",
    "redis>=5.0",
    "luana-core-platform",
    "luana-core-iam",
    "luana-core-copilot",          # Story 6 T-16 — copilot_provider/ unlift requires copilot ports
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.118.0",
    "google-analytics-data>=0.20.0",
    "facebook-business>=22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_analytics_engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
