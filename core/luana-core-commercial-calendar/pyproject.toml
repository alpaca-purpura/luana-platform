[project]
name = "luana-core-commercial-calendar"
version = "0.0.1-alpha"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "structlog>=24.0",
    "luana-core-platform",
    "luana-core-iam",
    "luana-core-copilot",          # Story 6 T-16 — copilot_provider/ unlift requires copilot ports
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_commercial_calendar"]
