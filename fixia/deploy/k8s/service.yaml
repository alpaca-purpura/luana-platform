# fixia/deploy/k8s/service.yaml
# Placeholder K8s service manifest — Fixia
# bootstrap brand topology — 2026-05-15

apiVersion: v1
kind: Service
metadata:
  name: fixia-backend
  namespace: luana
  labels:
    app: fixia-backend
    brand: fixia
spec:
  type: ClusterIP
  selector:
    app: fixia-backend
  ports:
    - name: http
      port: 8008
      targetPort: 8008
---
apiVersion: v1
kind: Service
metadata:
  name: fixia-frontend
  namespace: luana
  labels:
    app: fixia-frontend
    brand: fixia
spec:
  type: ClusterIP
  selector:
    app: fixia-frontend
  ports:
    - name: http
      port: 3008
      targetPort: 3008
