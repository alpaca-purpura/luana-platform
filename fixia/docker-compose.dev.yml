# fixia/docker-compose.dev.yml
# Brand-specific services para Fixia (Servicios Hogar + Oficios).
# Siempre se usa combinado con el compose raiz:
#   docker compose -f docker-compose.dev.yml -f fixia/docker-compose.dev.yml up -d
# O mas facil: make dev-fixia
# SSoT puertos/DB/etc: fixia/config/brand.yaml::infra
#
# NOTA: fixia/backend usa placeholder (Story TBD pendiente).
# El compose file funciona correctamente con el placeholder.
#
# bootstrap brand topology — 2026-05-15
# Decisions: D2, D4 (backend placeholder), D5, D6

name: luana-dev  # mismo name que raiz para compartir network/volumes

services:
  fixia_backend_dev:
    build:
      context: .  # contexto = raiz monorepo
      dockerfile: fixia/backend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - path: fixia/.env.dev  # gitignored; copiado desde fixia/.env.dev.template
        required: false  # compose config --quiet pasa aunque el archivo no exista aun
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:password@luana_postgres_dev:5432/fixia_dev"
      REDIS_URL: "redis://luana_redis_dev:6379/7"
      QDRANT_HOST: "luana_qdrant_dev"
      QDRANT_COLLECTION_PREFIX: "fixia_"
      PORT: "8008"
    volumes:
      - ./fixia/backend/src:/workspace/fixia/backend/src:rw  # bind mount src placeholder
    ports:
      - "127.0.0.1:8008:8008"
    networks:
      - luana_dev_net
    depends_on:
      luana_postgres_dev:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  fixia_frontend_dev:
    build:
      context: .
      dockerfile: fixia/frontend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - path: fixia/.env.dev
        required: false
    environment:
      PORT: "3008"
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:8008"
    volumes:
      - ./fixia/frontend/src:/app/fixia/frontend/src:rw
    ports:
      - "127.0.0.1:3008:3008"
    networks:
      - luana_dev_net
    deploy:
      resources:
        limits:
          memory: 512M

  fixia_cloudflared_dev:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]  # opt-in: make dev-fixia-tunnel
    restart: unless-stopped
    env_file:
      - path: fixia/.env.dev  # debe contener TUNNEL_TOKEN
        required: false
    command: tunnel run fixia-dev
    networks:
      - luana_dev_net

volumes:
  fixia_backend_venv:
    name: fixia_backend_venv

# NOTA: network luana_dev_net es definida en el compose raiz (docker-compose.dev.yml).
