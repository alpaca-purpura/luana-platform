    backend_port: 8007
    frontend_port: 3007
    database_name: retailly_dev
    redis_db: 6
    qdrant_collection_prefix: retailly_
    domain: retailly-dev.nicolify.com
    cloudflared_tunnel: retailly-dev
  staging:
    domain: retailly-test.nicolify.com
    server: tbd-staging-cluster
  prod:
    domain: app.retailly.com
    server: tbd
    cloudflared_tunnel: retailly-prod
