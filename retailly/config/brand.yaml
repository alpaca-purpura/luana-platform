# bootstrap brand topology — 2026-05-15
# SSoT infra metadata por entorno. Auto-indexado en docs/portfolio/INFRA-MATRIX.md via make infra-matrix.

brand_slug: retailly
brand_name: "Retailly"
brand_description: "Vertical E-commerce / D2C brand app — catálogos sincronizados con Shopify/WooCommerce, cart recovery y cross-selling automático"
brand_segment: ecommerce
compliance_level: pci-light
voice_cloning_enabled: false
multi_language_ui: false

features:
  brand_studio_basic: true
  shopify_woocommerce_sync: false  # Story TBD
  cart_recovery_flow: false        # Story TBD
  cross_selling_checkout: false    # Story TBD
  logistics_carrier_sync: false    # Story TBD

