# retailly/docker-compose.dev.yml
# Brand-specific services para Retailly (E-commerce / D2C).
# Siempre se usa combinado con el compose raiz:
#   docker compose -f docker-compose.dev.yml -f retailly/docker-compose.dev.yml up -d
# O mas facil: make dev-retailly
# SSoT puertos/DB/etc: retailly/config/brand.yaml::infra
#
# NOTA: retailly/backend usa placeholder (Story TBD pendiente).
# El compose file funciona correctamente con el placeholder.
#
# bootstrap brand topology — 2026-05-15
# Decisions: D2, D4 (backend placeholder), D5, D6

name: luana-dev  # mismo name que raiz para compartir network/volumes

services:
  retailly_backend_dev:
    build:
      context: .  # contexto = raiz monorepo
      dockerfile: retailly/backend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - path: retailly/.env.dev  # gitignored; copiado desde retailly/.env.dev.template
        required: false  # compose config --quiet pasa aunque el archivo no exista aun
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:password@luana_postgres_dev:5432/retailly_dev"
      REDIS_URL: "redis://luana_redis_dev:6379/6"
      QDRANT_HOST: "luana_qdrant_dev"
      QDRANT_COLLECTION_PREFIX: "retailly_"
      PORT: "8007"
    volumes:
      - ./retailly/backend/src:/workspace/retailly/backend/src:rw  # bind mount src placeholder
    ports:
      - "127.0.0.1:8007:8007"
    networks:
      - luana_dev_net
    depends_on:
      luana_postgres_dev:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  retailly_frontend_dev:
    build:
      context: .
      dockerfile: retailly/frontend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - path: retailly/.env.dev
        required: false
    environment:
      PORT: "3007"
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:8007"
    volumes:
      - ./retailly/frontend/src:/app/retailly/frontend/src:rw
    ports:
      - "127.0.0.1:3007:3007"
    networks:
      - luana_dev_net
    deploy:
      resources:
        limits:
          memory: 512M

  retailly_cloudflared_dev:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]  # opt-in: make dev-retailly-tunnel
    restart: unless-stopped
    env_file:
      - path: retailly/.env.dev  # debe contener TUNNEL_TOKEN
        required: false
    command: tunnel run retailly-dev
    networks:
      - luana_dev_net

volumes:
  retailly_backend_venv:
    name: retailly_backend_venv

# NOTA: network luana_dev_net es definida en el compose raiz (docker-compose.dev.yml).
