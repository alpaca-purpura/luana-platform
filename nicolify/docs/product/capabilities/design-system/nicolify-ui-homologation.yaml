# Homologación del design system Nicolify (adopción @luana/ui-kit + design-tokens + lock no-arbitrary)

Adopción comprehensiva (ADR-014 "homologar antes de crecer") del design system compartido en Nicolify.

## Qué shippeó (story nicolify-r0-design-system-adoption)

- **4 mirrors locales borrados** → consumo directo de `@luana/ui-kit` (EntityWorkspaceLayout, EntitySubNavBar, EmptyState, AutosaveBadge).
- **globals.css** alineado a la escala de `@luana/design-tokens` + `@custom-variant dark` (single-axis `data-theme`, vitalia-aligned) + `@source` escanea el kit completo.
- **Lock no-arbitrary encendido**: eslint `@luana/ds/no-arbitrary-value` + arch-tests (`no-kit-mirror`, `no-div-layout`, `no-native-select`, `single-token-source`).

## Decisiones cardinales

- **Dark single-axis** (`data-theme`): el script anti-FOUC custom se eliminó (era dual-write con `.dark` → tema trabado). next-themes maneja el anti-FOUC (= vitalia). Commits b09bc9dc → 7411c862 → b5acab8e → 42f759c8.
- **Pill controls** vía `--radius-control` en `@theme` (kit-lift @luana/ui-kit 0.6.0).
- **Edge-redirect** del root `/` (proxy.ts 307) para evitar el "Rendered more hooks" de Next 16 en soft-nav.

## Followups (NO bloquean)

- Goldens visuales A/C1/C2/D + e2e a11y-subnav: capturar/correr con stack dev estable (deferred por inestabilidad, cubierto por live-verify #37).
- **HB-109** (/pm-luana): tsc engine `core/@luana/hooks` (zustand persist StateCreator).
- **HB-110** (/pm-luana): eslint flat-config dep-drift (lock vapor) — candidato cross-brand.

