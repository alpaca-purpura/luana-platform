    title: "2 PATCH casi-simultáneos → ICP íntegro (merge por campo / last-write+aviso)"
    test: "nicolify/backend/tests/modules/nicolify/abel/api/test_icp_api.py"
  - id: SC-adversarial-tenant
    title: "GET/PATCH icp_id de otro tenant → 404 (no revela existencia · RN-1)"
    e2e_test: "nicolify/frontend/e2e/specs/regression/abel-icp-regression.spec.ts"
  - id: SC-empty
    title: "Tenant sin ICPs → DraftFirstStarter (2 caminos), sin EntitySubNavBar"
    e2e_test: "nicolify/frontend/e2e/specs/smoke/abel-icp.smoke.spec.ts"
  - id: SC-network
    title: "Timeout extract → job.status=failed → reintento+fallback, sin spinner infinito ni next-overlay"
    e2e_test: "nicolify/frontend/e2e/specs/regression/abel-icp-regression.spec.ts"
  - id: SC-race-unique
    title: "2 POST misma etiqueta → 1 creado + 1×409 (RN-7 idempotente)"
    test: "nicolify/backend/tests/modules/nicolify/abel/infrastructure/test_icp_repository.py"
  - id: SC-concurrent
    title: "2 tenants listando/creando → cada uno ve lo suyo (RN-1)"
    test: "nicolify/backend/tests/modules/nicolify/abel/api/test_icp_api.py"
  - id: SC-large
    title: "200 ICPs + 30 buyers → pagina/virtualiza + EntitySubNavBar overflow"
    test: "nicolify/frontend/src/features/abel/components/icp/IcpMasterListView.test.tsx"
  - id: SC-a11y
    title: "EntitySubNavBar role=tablist + roving tabindex + flechas · directory aria-disabled · axe wcag2aa"
    e2e_test: "nicolify/frontend/e2e/specs/smoke/abel-icp.smoke.spec.ts"
