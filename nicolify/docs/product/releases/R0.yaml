# R0 · Fundación + shell agéntico

> Primer release del rebuild **agentic-first** de Nicolify. Levanta la marca como app activa y monta el esqueleto del shell-organism agéntico (Luana orquestadora + Ribbon de los 5 agentes), reusando la base FE madura de Vitalia. Sin este release no hay dónde "vivir" la lógica de Abel/Brenda/Christian/Norvil.

## Outcome esperado

- Stack dev de Nicolify levantado y verde (BE :8001 / FE :3001 / health OK / alembic baseline).
- Shell-organism agéntico navegable: TopBar global + Ribbon de 5 agentes (Luana/Abel/Brenda/Christian/Norvil) + panel orquestador de Luana (chat lateral, skeleton).
- Contrato de diseño del shell + árbol de navegación (sub-tabs por agente) cementado como SSoT para los releases siguientes (R1+).

## Criterios de éxito (draft · a refinar en cada story)

1. `make dev-nicolify` levanta BE+FE sin errores · `curl :8001/health` OK.
2. Ruta raíz del tenant renderiza el shell con el Ribbon de 5 agentes + Luana chat skeleton.
3. Navegación entre agentes (tabs) funciona · cada agente muestra su empty-state.
4. Patrón de arquitectura del shell documentado (ADR-nicolify-001 candidato) reusando aprendizajes de ADR-vitalia-003/004.

## Prior art (reuse, NO mirror)

- **Vitalia** (`vitalia/frontend/` + ADR-vitalia-003 mockup-per-component + ADR-vitalia-004 shell-feature-architecture): fuente del paradigma shell-organism. Reuse del patrón, adaptado a los 5 agentes de Nicolify.
- **Engine** `core/luana-core-copilot/` + `core/luana-core-sales-agent/`: Luana/Christian/Norvil/Brenda se construyen como brand-extensions, NO se recrean.
- Detalle del scan se hace al refinar cada story (`.claude/rules/anti-duplication-refining.md`).

