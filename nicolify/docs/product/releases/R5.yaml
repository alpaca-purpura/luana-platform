# R5 · Motor de fidelización Norvil

> Hacer que una agencia de 3 personas se sienta como si tuviera un equipo de account management que **nunca olvida un cliente y siempre aparece en el momento justo con lo correcto.** Útil + novedoso para SMB B2B.

## Outcome esperado (4 hojas N3 de norvil.fidelizacion)
- **Momentos que importan:** señales del cliente vía Apify (cumpleaños/aniversario/ronda/prensa/hito/inactividad) → touch contextual, no genérico.
- **Champion-shield (la joya):** el champion cambia de empresa → alerta churn + intro caliente en su nueva empresa (+114% win con champion previo).
- **Value-proof / QBR:** reporte trimestral "esto logramos para vos" → justifica retainer + dispara renovación.
- **Gifting orquestado:** mensaje/correo/regalo timed; el dueño aprueba.

## Notas
- Net-new real: account-health compuesto B2B + champion-tracking + QBR-gen + gifting-orchestration.
- Reusa infra existente (social-listening Brenda/Apify, crm, commercial-calendar) → barato + alto valor.
- **Sara:** diferida (Próximamente). Reevaluar reactivar la capa operación/ERP en este release si se prioriza — requiere enmienda a ADR-nicolify-002 D-D.
