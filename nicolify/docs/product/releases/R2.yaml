# R2 · Christian · Outbound + cierre

> El motor de ventas operativo. Christian prospecta, atiende todo lo que entra (inbox), enruta cada lead al ejecutivo que mejor calza, y cierra con propuestas/licitaciones — hablando por el fundador (voz clonada) cuando hace falta.

## Outcome esperado
- **Base de contactos:** integra CRMs/sistemas + importa BDs + contactos propios + botón "investigar" (enrichment). El funnel aún-no-cliente (Cuenta+Stakeholder).
- **Inbox omnicanal:** todos los DMs filtrables por canal (empresa/personal). Recepción pasiva nunca se corta. Responde comentarios personales del fundador. **Sin pantalla de secuencias** (el agente ejecuta el outbound; las respuestas caen acá).
- **Pipeline + lead-routing:** deals ligados a la Cuenta + decide quién atiende.
- **Equipo comercial:** carga ejecutivos + perfiles → derivación skill-based.
- **Agenda** + **Propuestas** (+ Licitaciones minería · vinculadas al dossier de Abel).
- **Engine sales_agent** cableado + **voz-fundador** clonada (consent + aprobación 1er envío).
- **Seguridad:** audit de acciones autónomas + consent LinkedIn + firma electrónica eIDAS-like + compliance WABA/opt-in.

## Notas
- Inbox = réplica de vitalia (ver story `nicolify-r0-sitemap-completo/00-research.md`).
- Christian es el agente bifronte (copilot + sales_agent).
- Outbound respeta consent + rate limits + opt-out (rule `agent-revenue-engine.md`).
