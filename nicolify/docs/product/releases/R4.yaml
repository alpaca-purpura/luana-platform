# R4 · Token economy + observabilidad

> Nicolify es AaaS intensivo en LLM; el margen depende de medir y acotar el uso. Este release hace visible y gobernable la economía de tokens + la autonomía de los agentes.

## Outcome esperado
- **Tokens / Plan:** bolsa por tenant según tier + alertas progresivas 80/95/100%.
- **Autonomía de agentes:** umbrales CAC/ROAS (Brenda), consent LinkedIn (Christian), aprobaciones (Norvil) — todo config del tenant, nunca hardcodeado. **Tier gating server-side** (Básico no invoca Christian/Norvil).
- **Metering:** costo LLM por (agente, acción, tenant) vía `core/luana-core-observability` (NUNCA recrear el recorder).
- **Funciones críticas nunca se cortan** (recepción pasiva de leads sigue aunque la bolsa = 0).

## Notas
- Consume `core/luana-core-billing` (BudgetGuard) + `core/luana-core-observability` (cost + FX + pricing).
- Gates de la rule `agent-revenue-engine.md § 4` (token economy).
