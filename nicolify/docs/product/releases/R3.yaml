# R3 · Norvil · Retención (liviano)

> Norvil toma acciones con los clientes que Christian trajo. Arranca **liviano** y **client-first**: una cartera donde cada cliente abre su detalle (salud + stakeholders + historia en una página, sin tabs) y desde ahí se dispara la renovación/upsell.

## Outcome esperado
- **Cartera de clientes (master-detail):** lista → detalle del cliente. El detalle contiene la **salud de cuenta** (churn signals) + mapa multi-stakeholder + historia + touchpoints. La salud NO es área aparte.
- **Renovaciones & upsell:** nurturing pre-renovación + cross/up-sell. Propone; el dueño aprueba el contacto.

## Notas
- El **motor de fidelización** (momentos · champion-shield · QBR · gifting) = **R5** (no acá).
- Reusa `core/luana-core-crm` (NPS/referral/inactivity/lifecycle) + commercial-calendar.
- DealWon (R2) → Norvil incorpora el cliente a la cartera (cross-flow).
