# R1 · Abel + Brenda · Atracción inbound

> Primer release **vendible**: estrategia (Abel) + marketing B2B in-house (Brenda). El dueño no-marketinero define a quién apunta (ICP), arma su oferta empaquetada en tiers, y Brenda lo mantiene vigente en LinkedIn (postea por él), gestiona pauta con kill-switch CAC/ROAS, y le dice qué pega con sustento.

## Outcome esperado
- **Abel:** ICP/buyer definible · catálogo & escalera de valor (packaging en tiers) · marca/posicionamiento.
- **Brenda:** contenido & presencia (post-by-proxy del fundador, dos frentes) · pauta (atribución a pipeline + kill-switch) · inteligencia & asesoría (Apify + loop replicar-adaptar). Métricas reales a-la-mano.
- **Voz-fundador** compartida operativa (Brenda publica como el fundador, con consent + aprobación humana).
- **Onboarding** conduce el alta (Luana) + Abel captura la visión/dirección del CEO.
- **Conexiones** Meta/LinkedIn (fuente de las métricas reales).
- **Luana:** memoria/continuidad + reportes digeridos.

## Notas
- R1 es grande → se partirá en varias stories al refinar (1 área = 1+ stories).
- Toda sub-tab nueva cita `ADR-nicolify-001` (shell-feature-architecture).
- Pricing/SKU NO se deciden acá (vision §5).
