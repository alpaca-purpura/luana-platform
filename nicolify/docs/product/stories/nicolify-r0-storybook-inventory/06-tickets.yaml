notes:
  - "Tier: workhorse en TODOS los tickets (FE no-agentic). NUNCA flagship — R23 (agentic→flagship) NO aplica."
  - "Cero ticket BE, cero ticket AGENTIC. La story no toca backend ni copilot/sales_agent."
  - "T-3 y T-4 son paralelizables tras T-2 (buckets distintos de stories, mismo code:design-system → serializar si misma sesión)."
  - "promote_net_new (RN-6): improbable en un inventario. Si aparece pieza net-new compartible → PROMOTE vía /pm-luana (deliverable extra), NO local. Auditor lo verifica por prosa (advisory mecánico — HB-107 no cubre el promote-gate)."
