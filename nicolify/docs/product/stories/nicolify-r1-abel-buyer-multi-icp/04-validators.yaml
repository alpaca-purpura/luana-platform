# ═══════════════════════════════════════════════════════════════
# VALIDATORS (5 categories)
# ═══════════════════════════════════════════════════════════════
validators:
  # ── NON-FUNCTIONAL ──────────────────────────────────────────
  - id: be_arch_fitness
    category: non_functional
    type: pytest
    cmd: "cd nicolify/backend && ${WS}/.venv/bin/pytest tests/architecture/ -x -q --override-ini='addopts='"
    must_pass: true
    timeout_sec: 120
    description: "migraciones idempotentes (003 raw SQL), response_model en cada route, no cross-brand, growth_studio no-PII, main app config"

  - id: be_lint
    category: non_functional
    type: shell
    cmd: "cd nicolify/backend && ${WS}/.venv/bin/ruff check src/modules/nicolify/abel/ tests/modules/nicolify/abel/ tests/integration/ --no-cache"
    must_pass: true
    timeout_sec: 30

  - id: be_format
    category: non_functional
    type: shell
    cmd: "cd nicolify/backend && ${WS}/.venv/bin/ruff format --check src/modules/nicolify/abel/ tests/modules/nicolify/abel/"
    must_pass: true
    timeout_sec: 30

  - id: fe_typecheck
    category: non_functional
    type: shell
    cmd: "cd nicolify/frontend && npx tsc --noEmit"
    must_pass: true
    timeout_sec: 90

  - id: fe_lint
    category: non_functional
    type: shell
    cmd: "cd nicolify/frontend && npx eslint src/features/abel src/lib/routing/shell-routes.ts src/components/shared/shell-organism/SubTabContent.tsx --max-warnings 0 --cache"
    must_pass: true
    timeout_sec: 60
    description: "incluye no-arbitrary-value (DS gate) — cero arbitrary spacing/radius/color"

  # ── FUNCTIONAL ──────────────────────────────────────────────
  - id: be_abel_unit
    category: functional
    type: pytest
    cmd: "cd nicolify/backend && ${WS}/.venv/bin/pytest tests/modules/nicolify/abel/ -x -q"
    must_pass: true
    timeout_sec: 180
    description: "domain + repo (join) + service (attach/detach/set-primary/directory) + api (SC-1,2,3,3b,5,6,7)"

  - id: be_migration_backfill
    category: functional
    type: pytest
    cmd: "cd nicolify/backend && ${WS}/.venv/bin/pytest tests/integration/test_abel_icp_buyer_migration_backfill.py -x -q"
    must_pass: true
    timeout_sec: 120
    description: "SC-8 — migración real sobre DB con filas: count preservado + idempotencia (2º run no-op) + is_primary preservado"

  - id: fe_abel_unit
    category: functional
    type: shell
    cmd: "cd nicolify/frontend && npx vitest run src/features/abel"
    must_pass: true
    timeout_sec: 120
    description: "api/hooks/components (attach/detach/directory + BuyerLeafForm directory-mode)"

  - id: e2e_buyer_multi_icp
    category: functional
    type: shell
    cmd: "cd nicolify/frontend && E2E_BASE_URL=http://localhost:3001 npx playwright test e2e/regression/nicolify-r1-abel-buyer-multi-icp/ --project=regression"
    must_pass: true
    timeout_sec: 300
    description: "SC-1 attach, SC-4 edit-propagates, SC-9 network, SC-10 empty, SC-11 a11y — real backend"

  # ── VISUAL ──────────────────────────────────────────────────
  - id: fe_visual_scope
    category: visual
    type: shell
    cmd: "cd nicolify/frontend && npx playwright test e2e/regression/nicolify-r1-abel-buyer-multi-icp/buyers-directory.spec.ts --project=regression"
    must_pass: true
    timeout_sec: 180
    description: "composición reuse-only (átomos @luana/ui-kit) — bounded locators, assertShellMounted antes de axe (HB-68)"

  # ── AGENTIC_EVAL ────────────────────────────────────────────
  - id: agentic_eval
    category: agentic_eval
    type: none
    must_pass: true
    not_applicable: true
    not_applicable_reason: "sin superficie agentic (copilot/sales_agent). Story service+FE."

  # ── ARCHITECTURAL_VALIDATION ────────────────────────────────
  - id: arch_no_new_layer
    category: architectural_validation
    type: shell
    cmd: "grep -rn 'from luana_core_' nicolify/backend/src/modules/nicolify/abel/ | grep -v 'base_entity\\|BaseEntity' || true"
    must_pass: true
    timeout_sec: 20
    description: "EXTEND no NEW: cero import nuevo de engine salvo Base/BaseEntity; join table es dominio del módulo (no capa)"

  - id: arch_tenant_isolation_join
    category: architectural_validation
    type: shell
    cmd: "grep -n 'tenant_id' nicolify/backend/src/modules/nicolify/abel/infrastructure/repositories/icp_buyer_repository.py"
    must_pass: true
    timeout_sec: 20
    description: "RN-1: toda query de abel_icp_buyers filtra tenant_id (grep confirma presencia; test funcional SC-5 lo ejerce)"

  - id: arch_no_cross_brand
    category: architectural_validation
    type: pytest
    cmd: "cd nicolify/backend && ${WS}/.venv/bin/pytest tests/architecture/test_no_cross_brand_imports.py -x -q --override-ini='addopts='"
    must_pass: true
    timeout_sec: 60
    description: "cero mirror cross-brand, cero core/ edit"
