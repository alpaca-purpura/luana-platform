    tests: ["nicolify/frontend/e2e/regression/nicolify-r1-abel-buyer-multi-icp/buyers-directory.spec.ts::test_buyers_directory_empty_state"]
  - scenario_id: SC-11
    name: accessibility
    type: edge
    sub: accessibility
    tests: ["nicolify/frontend/e2e/regression/nicolify-r1-abel-buyer-multi-icp/buyers-directory.spec.ts::test_buyers_directory_a11y"]
  - scenario_id: SC-12                        # v2 — RN-11
    name: icp-delete-cascade
    type: edge
    tests:
      - "nicolify/backend/tests/modules/nicolify/abel/application/test_icp_service.py::test_delete_icp_cascades_detach_and_soft_deletes_orphans"
      - "nicolify/backend/tests/modules/nicolify/abel/application/test_icp_service.py::test_delete_icp_not_found_no_cascade"
      - "nicolify/frontend/src/features/abel/components/icp/IcpWorkspaceView.test.tsx"   # copy cascade en confirm
  - scenario_id: SC-13                        # v2 — RN-12
    name: attach-first-auto-primary
