# 04-validators · nicolify-r1-abel-icp-buyer
# Validation contract: qué demuestra que la story está hecha de verdad (no "tests verdes" mockeados).
# Consumido por /dev-team (construye), gate-runner (corre), /auditor (verifica gherkin-matrix Phase D).
---
story_id: nicolify-r1-abel-icp-buyer
brand: nicolify
architecture_pattern: ADR-nicolify-001
surfaces: [be, fe, agentic]

# ─────────────────────────────────────────────────────────────────────────────
# VERIFICATION BLOCK (DoD #37 · definition-of-done-live-verify)
# ─────────────────────────────────────────────────────────────────────────────
verification:
  nature: both            # funcional (UI user-reachable) + técnica (extractor/service/migración)
  demo_required: true     # toca frontend + endpoints con consumer FE → demo manual de Chris
  runtime_error_gate: required   # gate anti-burbuja: base.ts (pageerror/console/response/next-overlay)
  dev_app: "make dev-nicolify → localhost:3001 (o dev-app.nicolify.com vía tunnel). Chrome DevTools MCP live-verify."
  dod_evidence_required:
    - "POST /api/v1/abel/icp/extract con URL real (autenticado owner.demo@nicolify.com) → fila abel_icps status=borrador + buyers en DB + render del detalle"
    - "PATCH /api/v1/abel/icp/{id} editar campo + guardar → toast 'Guardado.' + persiste al recargar + backend log 200 sin traceback"
    - "mark-ready sin mínimo → 422 missing[] + ICP sigue borrador (estado sin cambio en DB)"
    - "cross-tenant: request de tenant A a icp_id de tenant B → 404, 0 datos (logs)"

# ─────────────────────────────────────────────────────────────────────────────
# 1. NON-FUNCTIONAL
# ─────────────────────────────────────────────────────────────────────────────
non_functional:
  performance:
    - id: NF-perf-list
      desc: "Lista de 200 ICPs pagina/virtualiza; detalle con 30 buyers no rompe el layout (SC-large)"
      verify: "render < 1.5s p95 con 200 ICPs; EntitySubNavBar scroll/overflow con 30 leaves"
    - id: NF-perf-extract
      desc: "Extracción con timeout configurable; sin spinner infinito (SC-network)"
  security:
    - id: NF-sec-tenant
      desc: "Tenant isolation raíz en toda query (RN-1). Cross-tenant → 404 (no revela existencia)"
      verify: "arch-test + e2e SC-adversarial-tenant"
    - id: NF-sec-injection
      desc: "Semilla = dato no confiable (RN-9). Inyección no ejecuta acción destructiva (SC-adversarial-injection)"
    - id: NF-sec-pii
      desc: "response_model= en toda ruta; growth_studio_event sin PII (account_id + montos bucketeados + ids hasheados); trazas via sanitize_payload"
  resilience:
    - id: NF-res-extract
      desc: "extractor timeout/5xx → job.status=failed → FE reintento + fallback manual; best-effort trace/cost no rompe extracción"

# ─────────────────────────────────────────────────────────────────────────────
# 2. FUNCTIONAL — business_rules matrix (regla → @tag → scenario)  [gherkin-matrix Phase D]
# ─────────────────────────────────────────────────────────────────────────────
functional:
  business_rules:
    - { rule: RN-1,  tag: "@rule-tenant-isolation",  scenarios: [SC-adversarial-tenant, SC-concurrent], surface: be }
    - { rule: RN-2,  tag: "@rule-draft-first",        scenarios: [SC-empty], surface: fe }
    - { rule: RN-3,  tag: "@rule-propose-ratify",     scenarios: [SC-happy], surface: [agentic, fe] }
    - { rule: RN-4,  tag: "@rule-field-consumer",     scenarios: [SC-happy], surface: fe }   # WhatForChip + catálogo consumer_agent
    - { rule: RN-5,  tag: "@rule-buyer-one-icp",      scenarios: [SC-happy-buyer, SC-add-buyer], surface: be }
    - { rule: RN-6,  tag: "@rule-one-primary",        scenarios: [SC-edge-primary], surface: be }
    - { rule: RN-7,  tag: "@rule-label-unique",       scenarios: [SC-race-unique], surface: be }
    - { rule: RN-8,  tag: "@rule-ready-min-no-bar",   scenarios: [SC-negative], surface: [be, fe] }
    - { rule: RN-9,  tag: "@rule-seed-untrusted",     scenarios: [SC-adversarial-injection], surface: agentic }
    - { rule: RN-10, tag: "@rule-extractor-audit",    scenarios: [SC-happy], surface: agentic }
    - { rule: RN-11, tag: "@rule-currency-preserved", scenarios: [SC-i18n], surface: [be, fe] }

# ─────────────────────────────────────────────────────────────────────────────
# 3. VISUAL (G1 mockup adherence · frontend-visual-fidelity D2)
# ─────────────────────────────────────────────────────────────────────────────
visual:
  mockup_ref: nicolify/docs/product/stories/nicolify-r1-abel-icp-buyer/mockups/icp-buyer.html
  goldens:
    - { view: arranque,  themes: [light, dark] }     # DraftFirstStarter
    - { view: lista,     themes: [light, dark] }     # IcpMasterList + IcpCard (SIN completeness ring — RN-8)
    - { view: detalle,   themes: [light, dark] }     # EntitySubNavBar + IcpDatosForm + WhatForChip
    - { view: propuesta, themes: [light, dark] }     # ProposalBanner (draft-first)
  notes:
    - "El mockup tiene CSS .ring de completitud RESIDUAL — NO implementar (RN-8 eliminó la barra). El spec manda sobre el CSS."
    - "Side-by-side scoped a /abel/icp** (NO full-page del shell wrapper — port R0)."

# ─────────────────────────────────────────────────────────────────────────────
# 4. AGENTIC EVAL (extractor draft-first · pytest stub default)
# ─────────────────────────────────────────────────────────────────────────────
agentic_eval:
  llm_real_opt_in: "RUN_LLM_EXTRACT=1"
  cases:
    - { id: EV-1, desc: "seed con inyección → tratada como dato, no ejecuta orden destructiva (RN-9)", scenario: SC-adversarial-injection }
    - { id: EV-2, desc: "extraído nace status=borrador origin=draft (RN-3)", scenario: SC-happy }
    - { id: EV-3, desc: "thin-seed → esqueleto + pide vertical+dolor, no alucina cifras", scenario: SC-edge-thin-seed }
    - { id: EV-4, desc: "timeout → job.status=failed, no rompe la hoja (SC-network)", scenario: SC-network }
    - { id: EV-5, desc: "persist borrador → audit row propose_icp_draft (RN-10)", scenario: SC-happy }
    - { id: EV-6, desc: "extract escribe solo en el tenant del request (RN-1)" }
  cost_observability: "LLM call registra costo via core/luana-core-observability (NUNCA recrear). Trace via sanitize_payload."

# ─────────────────────────────────────────────────────────────────────────────
# 5. ARCHITECTURAL VALIDATION (arch fitness · ratchet shrink-only)
# ─────────────────────────────────────────────────────────────────────────────
architectural_validation:
  backend:
    - test_response_model_required          # EXTEND — toda ruta abel
    - test_no_cross_brand_imports           # abel NO importa otro brand
    - test_main_app_config                  # redirect_slashes=False
    - test_migrations_idempotent            # 002_abel_icp_buyer raw SQL IF NOT EXISTS
    - test_no_secret_leak
    - test_growth_studio_event_no_pii       # NEW (CREATE)
  frontend:
    - test_shell_routes_ssot                # abel.icp ya en SSoT — NO duplicar catálogos
    - test_agent_tw_classes                 # EntitySubNavBar via _agent-tw-classes (G3)
    - test_spanish_neutro                   # microcopy neutro
    - no-store-in-ssr-skeleton              # EntityWorkspaceLayout skeleton store-free (G2)
  no_new_layer_audit: "ICP=NET-NEW brand-local (no engine, no cross-brand mirror — verificado). Buyer=replicate brand-local async (engine sync incompatible). EntitySubNavBar=port vitalia (lift candidate, NO lift acá). Ningún ticket edita core/."

# ─────────────────────────────────────────────────────────────────────────────
# SCENARIO COVERAGE — los 15 SC del spec (cualquier MISSING bloquea · Phase D)
# ─────────────────────────────────────────────────────────────────────────────
scenario_coverage:
  # Base (4)
  - { id: SC-happy,                 nature: functional, playwright: true,  surfaces: [fe, be, agentic], subcategory: happy }
  - { id: SC-negative,              nature: functional, playwright: true,  surfaces: [fe, be],          subcategory: negative }
  - { id: SC-edge-concurrent,       nature: functional, playwright: false, surfaces: [be],              subcategory: race }
  - { id: SC-adversarial-tenant,    nature: functional, playwright: true,  surfaces: [be],              subcategory: security }
  # Sub-categorías mandatory
  - { id: SC-empty,                 nature: functional, playwright: true,  surfaces: [fe],              subcategory: empty }
  - { id: SC-network,               nature: functional, playwright: true,  surfaces: [fe, agentic],     subcategory: network }
  - { id: SC-race-unique,           nature: functional, playwright: false, surfaces: [be],              subcategory: race }
  - { id: SC-concurrent,            nature: functional, playwright: false, surfaces: [be],              subcategory: concurrent }
  - { id: SC-large,                 nature: functional, playwright: false, surfaces: [fe],              subcategory: large }
  - { id: SC-a11y,                  nature: functional, playwright: true,  surfaces: [fe],              subcategory: a11y }
  - { id: SC-i18n,                  nature: functional, playwright: true,  surfaces: [fe, be],          subcategory: i18n }
  # Específicas list→detail + draft-first
  - { id: SC-happy-buyer,           nature: functional, playwright: true,  surfaces: [fe, be],          subcategory: happy }
  - { id: SC-add-buyer,             nature: functional, playwright: true,  surfaces: [fe, be],          subcategory: happy }
  - { id: SC-edge-primary,          nature: functional, playwright: true,  surfaces: [fe, be],          subcategory: edge }
  - { id: SC-adversarial-injection, nature: functional, playwright: false, surfaces: [agentic],         subcategory: security }
  - { id: SC-edge-thin-seed,        nature: functional, playwright: false, surfaces: [agentic],         subcategory: edge }
  orphans: none
  gaps: none

# ─────────────────────────────────────────────────────────────────────────────
# TEST CONSTRUCTION PLAN (TDD RED-first · creation_order = builder construye en este orden)
# ─────────────────────────────────────────────────────────────────────────────
test_construction_plan:
  creation_order:
    - { layer: be-domain,        tests: ["Icp/Buyer invariants: status default, FK icp_id, RN-6 ≤1 primary helper"] }
    - { layer: be-infra,         tests: ["repos tenant-scoped (cross-tenant→None)", "unique label RN-7", "clear_primary RN-6"] }
    - { layer: be-application,   tests: ["mark_ready missing[] RN-8", "set_primary RN-6", "label conflict RN-7", "extraction audit RN-10"] }
    - { layer: agentic,          tests: ["seed sanitization RN-9", "draft status RN-3", "thin-seed no-halluc", "timeout fallback", "tenant-isolation extract"] }
    - { layer: be-api,           tests: ["response_model shape", "Bearer/X-Tenant-ID required", "cross-tenant 404", "dup label 409", "concurrent patch"] }
    - { layer: fe-hooks,         tests: ["useIcps/useIcp/useBuyers/useIcpExtract: RQ keys + invalidation"] }
    - { layer: fe-components,    tests: ["IcpCard", "IcpDatosForm autosave+mark-ready", "BuyerLeafForm", "UniversalIntake 4 modos", "ProposalBanner", "DraftFirstStarter", "WhatForChip", "EntitySubNavBar leaves dinámicos+roving+directory-disabled"] }
    - { layer: fe-store,         tests: ["abel-ui-store SSR-safe G2"] }
    - { layer: e2e,              tests: ["15 SC via base.ts anti-burbuja", "visual goldens 4 vistas×2 themes", "axe wcag2aa"] }
  scenario_to_test:
    SC-happy: "e2e: intake URL → analizando → borrador (banner) → ratificar → status=listo en DB. + agentic EV-2/EV-5."
    SC-negative: "e2e+be: mark-ready sin mínimo → 422 missing[] + estado sin cambio."
    SC-edge-concurrent: "be: 2 PATCH casi-simultáneos → merge por campo o last-write+aviso; ICP íntegro."
    SC-adversarial-tenant: "be+e2e: GET/PATCH icp_id de otro tenant → 404."
    SC-empty: "e2e: tenant sin ICPs → DraftFirstStarter (2 caminos), 0 forms, sin EntitySubNavBar."
    SC-network: "e2e+agentic: forzar timeout extract → reintento+fallback; sin next-overlay/console-error."
    SC-race-unique: "be: 2 POST misma etiqueta → 1 creado + 1×409."
    SC-concurrent: "be: 2 tenants listando/creando → cada uno ve lo suyo."
    SC-large: "fe: 200 ICPs + 30 buyers → pagina/virtualiza + EntitySubNavBar overflow."
    SC-a11y: "e2e: EntitySubNavBar role=tablist + roving tabindex + flechas; directory aria-disabled; axe wcag2aa."
    SC-i18n: "e2e: copy neutro tuteo + monto en moneda del locale (no hardcoded)."
    SC-happy-buyer: "e2e: click buyer-leaf → detalle buyer + URL /{icpId}/{buyerId} sin reload."
    SC-add-buyer: "e2e+be: + buyer → buyer hijo + leaf nuevo."
    SC-edge-primary: "e2e+be: 2º primary → exactamente 1 is_primary=true en DB."
    SC-adversarial-injection: "agentic: payload inyección → no ejecuta, estado intacto, audit log."
    SC-edge-thin-seed: "agentic: seed pobre → esqueleto + pide datos, sin cifras inventadas."
  poms_required:
    - "AbelIcpMasterPage (lista) — open, cards, generar/nuevo CTAs"
    - "AbelIcpDetailPage (EntitySubNavBar) — leaves, back, datos form, mark-ready"
    - "AbelBuyerLeafPage — buyer form"
    - "UniversalIntakeModal — 4 modos, analizar"
  fixtures_required:
    - "base.ts (anti-burbuja — pageerror/console/response/next-overlay · import obligatorio, NO @playwright/test)"
    - "setupClerkTestingToken + owner.demo@nicolify.com (dev-app-test-creds)"
    - "seed tenant con N ICPs (be fixture) + thin-seed/injection seed fixtures (agentic)"
    - "extract LLM stub (default; RUN_LLM_EXTRACT=1 real)"

# ─────────────────────────────────────────────────────────────────────────────
# PLAYWRIGHT VISUAL SCOPE (D3 scope discipline · architect-autonomous-mode)
# ─────────────────────────────────────────────────────────────────────────────
playwright_visual_scope:
  story_scope_routes:
    - "/{tenantId}/abel/icp"
    - "/{tenantId}/abel/icp/{icpId}/datos"
    - "/{tenantId}/abel/icp/{icpId}/{buyerId}"
  story_scope_components:
    - "features/abel/components/icp/*"
    - "components/shared/intake/UniversalIntake.tsx"
    - "components/shared/{ProposalBanner,DraftFirstStarter,WhatForChip}.tsx"
    - "components/shared/shell-organism/{EntitySubNavBar,EntityWorkspaceLayout}.tsx"  # NEW (port)
  forbidden_to_touch:
    - "components/ui/**"                       # átomos engine/shadcn — reuse, no editar
    - "components/shared/shell-organism/{TopBarGlobal,Ribbon,SubTabsBar,LuanaSidebar,ShellOrganismLayout}.tsx"  # wrapper R0 shipped
    - "lib/routing/shell-routes.ts"           # SSoT — abel.icp ya está; NO duplicar
    - "otros features/* (brenda/christian/sara/norvil)"
  out_of_mockup_scope:
    - "completeness ring (CSS residual del mockup — RN-8 lo eliminó, NO implementar)"
    - "modo Conectar del intake → renderizar disabled+CTA, NO funcional (dep Config→conexiones)"
  non_egoismo: "Si se detecta un bug en el wrapper R0 (TopBar/Ribbon/etc.) → documentar en nicolify/docs/observed-bugs/, NO arreglar acá (fuera de scope)."

# ─────────────────────────────────────────────────────────────────────────────
# REGRESSION GUARD (modificación · §6 DoD)
# ─────────────────────────────────────────────────────────────────────────────
regression_guard:
  - "Shell R0 (rutas genéricas [agent]/[subtab], SubTabContent otros combos, EmptyStates) sigue verde sin modificarse."
  - "test_shell_routes_ssot intacto (NO se agregan catálogos nuevos — abel.icp ya existe)."
  - "Otros subtabs de Abel (oferta/marca) siguen mostrando EmptyState (no se tocan)."
