      - "seed_test_users_link.py: 1 tenant 'Agencia Demo'/agencia-demo/PEN/PE + owner.demo@nicolify.com (role owner) + user_tenants(owner) + --clerk-sync (publicMetadata). uuid5 determinístico. Idempotente (ON CONFLICT). Sin clinic branch."
