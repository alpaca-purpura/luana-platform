---
# nicolify/deploy/k8s/secrets.template.yaml
# PLANTILLA — NUNCA commitear valores reales en este archivo.
# Todos los valores deben ser "REEMPLAZAR".
#
# Chris crea el Secret en el cluster via:
#   kubectl create secret generic nicolify-secrets \
#     --from-literal=POSTGRES_PASSWORD=<valor> \
#     --from-literal=NICOLIFY_CLERK_SECRET_KEY=<valor> \
#     --from-literal=NICOLIFY_CLERK_WEBHOOK_SECRET=<valor> \
#     --from-literal=NICOLIFY_STRIPE_SECRET_KEY=<valor> \
#     --from-literal=NICOLIFY_STRIPE_WEBHOOK_SECRET=<valor> \
#     --from-literal=ANTHROPIC_API_KEY=<valor> \
#     --from-literal=REDIS_PASSWORD=<valor> \
#     -n nicolify
#
# Alternativamente, los secretos se inyectan via GitHub Environment
# 'nicolify-prod' referenciados en _deploy-brand.yml.
#
# Arch ref: S-CICD-DEPLOY 05-guidelines.md § F8 (no commitear secretos reales)
apiVersion: v1
kind: Secret
metadata:
  name: nicolify-secrets
  namespace: nicolify
  labels:
    app.kubernetes.io/name: nicolify
    app.kubernetes.io/part-of: luana-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REEMPLAZAR"
  NICOLIFY_CLERK_SECRET_KEY: "REEMPLAZAR"
  NICOLIFY_CLERK_WEBHOOK_SECRET: "REEMPLAZAR"
  NICOLIFY_STRIPE_SECRET_KEY: "REEMPLAZAR"
  NICOLIFY_STRIPE_WEBHOOK_SECRET: "REEMPLAZAR"
  ANTHROPIC_API_KEY: "REEMPLAZAR"
  REDIS_PASSWORD: "REEMPLAZAR"
