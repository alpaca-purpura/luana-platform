---
# nicolify/deploy/k8s/service.yaml
# Service ClusterIP para el backend de Nicolify.
# El tráfico externo llega via Ingress (ver ingress.yaml).
#
# Arch ref: S-CICD-DEPLOY 03-arch.md § nicolify/deploy/k8s/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: nicolify-backend
  namespace: nicolify
  labels:
    app.kubernetes.io/name: nicolify
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: luana-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app: nicolify-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
