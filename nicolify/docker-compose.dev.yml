# nicolify/docker-compose.dev.yml
# Brand-specific services para Nicolify (agencias y servicios B2B).
# Siempre se usa combinado con el compose raiz:
#   docker compose -f docker-compose.dev.yml -f nicolify/docker-compose.dev.yml up -d
# O mas facil: make dev-nicolify
# SSoT puertos/DB/etc: nicolify/config/brand.yaml::infra
#
# S-DOCKER-DEV-MULTIBRAND T-2 — 2026-05-15
# Decisions: D2 (brand-autocontenida), D4 (hot-reload bind mount), D5 (cloudflared opt-in), D6 (ports)

name: luana-dev  # mismo name que raiz para compartir network/volumes

services:
  nicolify_backend_dev:
    build:
      context: .  # contexto = raiz monorepo (accede a core/ y nicolify/backend/)
      dockerfile: nicolify/backend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - path: nicolify/.env.dev  # gitignored; copiado desde nicolify/.env.dev.template
        required: false  # compose config --quiet pasa aunque el archivo no exista aun
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:password@luana_postgres_dev:5432/nicolify_dev"
      REDIS_URL: "redis://luana_redis_dev:6379/0"
      QDRANT_HOST: "luana_qdrant_dev"
      QDRANT_COLLECTION_PREFIX: "nicolify_"
      PORT: "8001"
      # uv usa el venv del workspace root (con uvicorn + engine instalados) en vez de
      # crear uno local en nicolify/backend/.venv. Mismo patrón que vitalia (sin esto el
      # container crash-loopea "Failed to spawn uvicorn"). SSoT: vitalia/docker-compose.dev.yml.
      UV_PROJECT_ENVIRONMENT: "/workspace/.venv"
    volumes:
      - .:/workspace:rw  # bind mount monorepo completo (hot-reload)
      # Named volume protege el venv del container en la ruta donde el Dockerfile lo crea
      # (workspace root, NO en {brand}/backend/.venv). Docker populates the empty named volume
      # from the image's /workspace/.venv on first start (built-in init behavior).
      - nicolify_backend_venv:/workspace/.venv
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - luana_dev_net
    depends_on:
      luana_postgres_dev:
        condition: service_healthy
    # Invoca los binarios del venv root directamente (NO `uv run`). `uv run` desde
    # nicolify/backend re-sincroniza el [project] local (sin uvicorn) y poda el venv
    # → "Failed to spawn uvicorn". El venv root (image build `uv sync` del workspace)
    # ya tiene uvicorn/alembic/engine. Alembic upgrade en boot (idempotente, baseline IAM).
    command: >
      sh -c "cd /workspace/nicolify/backend &&
      /workspace/.venv/bin/alembic upgrade head &&
      exec /workspace/.venv/bin/uvicorn src.main:app
      --host 0.0.0.0 --port 8001 --proxy-headers --forwarded-allow-ips '*'
      --reload --reload-dir /workspace/nicolify/backend/src --reload-dir /workspace/core"
    deploy:
      resources:
        limits:
          memory: 1G

  nicolify_frontend_dev:
    build:
      context: .
      dockerfile: nicolify/frontend/Dockerfile
      target: dev
    restart: unless-stopped
    # NOTA turbopack (HB-78, intentos 2026-06-17): `pnpm dev:turbo` baja RAM ~30%
    # (2.37→1.6GiB) PERO turbopack NO resuelve módulos en este setup pnpm-workspace+Docker
    # bind-mount — falla hasta con deps DIRECTAS del FE (next-themes, sonner, tailwind-merge,
    # lucide-react). `transpilePackages` no alcanza: el problema es la resolución pnpm
    # non-hoisted + la inferencia de `root` de turbopack en el monorepo montado.
    # Fix real = migrar a `node-linker=hoisted` (root .npmrc) + reinstall + rebuild de las
    # 3 imágenes + barrido de regresión (relajar la estrictez pnpm puede destapar phantom-deps).
    # Tarea dedicada en worktree protocol — NO en el hub de marca. Mantener `pnpm dev` (--webpack).
    env_file:
      - path: nicolify/.env.dev
        required: false
    environment:
      PORT: "3001"
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:8001"
      # Cap heap V8 de `next dev` (fuga en sesiones largas). 2048MB bajo el límite 3G.
      NODE_OPTIONS: "--max-old-space-size=2048"
    volumes:
      # Bind mount al path donde el Dockerfile pone WORKDIR + pnpm install (/app/nicolify/frontend),
      # NO en /app raíz (eso sobrescribiría /app/node_modules + /app/pnpm-workspace.yaml del image).
      - ./nicolify/frontend:/app/nicolify/frontend:rw
      # Nicolify usa workspace deps @luana/* (api-client, ui-kit, design-tokens, format, hooks, schemas).
      # Los symlinks en node_modules apuntan a /app/core/@luana/* — necesitamos exponer core/ del host.
      - ./core:/app/core:ro
      # Anonymous volume enmascara node_modules del host (con symlinks pnpm host-only)
      # exponiendo los node_modules del image (pnpm install --filter "@luana/nicolify-web").
      - /app/nicolify/frontend/node_modules
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - luana_dev_net
    deploy:
      resources:
        limits:
          memory: 3G  # nicolify FE necesita más: webpack + React 19 + Sentry + workspace deps @luana/*
                     # con 2G se peg al cap (98%) compilando muchas rutas → GC thrashing/cuelgues.
                     # 3G da headroom (host con vitalia parado). NODE_OPTIONS heap cap 2048.

  nicolify_cloudflared_dev:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]  # opt-in: make dev-nicolify-tunnel
    restart: unless-stopped
    # Locally-managed tunnel: usa dev-config.yml versionado + credentials.json gitignored.
    # NO usar TUNNEL_TOKEN aqui (eso seria remotely-managed mode, mutuamente excluyente).
    command: tunnel --config /etc/cloudflared/dev-config.yml --no-autoupdate run
    volumes:
      - ./nicolify/deploy/cloudflared/dev-config.yml:/etc/cloudflared/dev-config.yml:ro
      - ./nicolify/deploy/cloudflared/.credentials/dev-tunnel.json:/etc/cloudflared/dev-tunnel.json:ro
    depends_on:
      - nicolify_backend_dev
      - nicolify_frontend_dev
    networks:
      - luana_dev_net

volumes:
  nicolify_backend_venv:
    name: nicolify_backend_venv
  # nicolify_frontend_node_modules: removido (reemplazado por anonymous volume en el servicio,
  # ver nicolify_frontend_dev.volumes — Docker maneja el lifecycle automáticamente)

# NOTA: network luana_dev_net es definida en el compose raiz (docker-compose.dev.yml).
# El name: luana-dev compartido permite que los compose files compartan la misma network.
